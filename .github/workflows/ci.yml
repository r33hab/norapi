name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run pytest -q
      - name: Registry smoke test (index builds, search answers, site generates)
        run: |
          uv run norapi stats
          uv run norapi search "adresse" --limit 3
          uv run norapi ops "enheter" --limit 3 || true
          uv run norapi site --out _site
          test -f _site/index.html && test -f _site/sitemap.xml

      dokumentert av eieren. Robots.txt oppgir Crawl-delay 10 sekunder.
    category: finans
    access: open
    auth: none
    formats: [JSON]
    endpoints:
      - https://www.finanstilsynet.no/api/search/investorwarnings/
    docs_url: https://www.finanstilsynet.no/markedsadvarsler/
    probe_url: https://www.finanstilsynet.no/api/search/investorwarnings/
    keywords: [markedsadvarsel, investorvarsel, svindel, uregistrert, finanstilsynet, investor warnings, scam]
    tags: [no-auth, undocumented]
    caveats:
      - Ikke dokumentert av eieren, og kan endres uten forvarsel.
      - Respekter Crawl-delay på 10 sekunder fra robots.txt.
      - Ingen lisens oppgitt.

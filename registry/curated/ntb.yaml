updated: 2026-11-24
provider:
  name: NTB (Norsk Telegrambyrå)
  sector: privat
apis:
  - id: ntb-api-hub
    title: NTB API Hub (nyheter, sport og bilder)
    title_en: NTB API Hub (news, sport and images)
    description: >-
      NTBs API-portal for kunder med nyhetsstrøm, sportsdata og bilde og video fra nyhetsbyrået. Autentisering er
      OAuth 2.0 client credentials: du får klient-id og hemmelighet av NTB og henter et Bearer-token som varer i et døgn.
      Tilgang krever kundeavtale, men oppsettveiledningen er åpen.
    category: kultur-og-kunnskap
    access: restricted
    auth: oauth2
    formats: [JSON]
    endpoints:
      - https://api.ntb.no/
    docs_url: https://api.ntb.no/portal/getting_started
    keywords: [ntb, nyhetsbyrå, nyheter, sport, bilder, telegram, news agency, oauth]
    tags: [agreement, oauth2, private-provider]
    caveats:
      - Krever kundeavtale med NTB; kontakt kundesenteret for å få klient.
      - Ingen lisens oppgitt; bruksrett følger kundeavtalen.
    quick_start: |
      # token (client credentials), se oppsettveiledningen for detaljer
      curl --request POST --url "https://login.sdl.no/oauth/token" \
        --header "Content-Type: application/x-www-form-urlencoded" \
        --data grant_type=client_credentials --data client_id=$CLIENT_ID \
        --data client_secret=$CLIENT_SECRET --data audience=https://api.ntb.no
  - id: ntb-kommunikasjon-pressemeldinger
    title: NTB Kommunikasjon pressemeldinger
    title_en: NTB Kommunikasjon press releases
    description: >-
      Pressemeldinger publisert gjennom NTB Kommunikasjon, fra norske virksomheter og offentlige etater, som JSON
      med tittel, ingress, brødtekst, utgiver, bilder, vedlegg og kontaktpersoner, og som RSS. Svarer anonymt med
      sideinndeling (nextPage). Ikke omtalt i NTBs API-portal.
    category: kultur-og-kunnskap
    access: open
    auth: none
    formats: [JSON, RSS]
    endpoints:
      - https://kommunikasjon.ntb.no/json/v2/releases
      - https://kommunikasjon.ntb.no/rss/releases/latest
    docs_url: https://kommunikasjon.ntb.no/
    probe_url: https://kommunikasjon.ntb.no/json/v2/releases
    keywords: [pressemelding, ntb kommunikasjon, pressemeldinger, nyheter, virksomhet, press releases, newsroom]
    tags: [no-auth, feed, private-provider, undocumented]
    caveats:
      - Pressemeldingene inneholder navn og kontaktinfo til pressekontakter.
      - robots.txt ber om ett sekund mellom kallene (Crawl-delay 1).
      - Ingen lisens oppgitt; rettighetene til innholdet ligger hos utgiverne.
    quick_start: |
      curl "https://kommunikasjon.ntb.no/json/v2/releases"

provider:
  name: Sikt - Kunnskapssektorens tjenesteleverandør
  orgnr: "919477822"
  sector: stat
apis:
  - id: sikt-nva
    title: Nasjonalt vitenarkiv (NVA) API
    title_en: Norwegian national research archive API
    description: >-
      Norske forskningsresultater fra Nasjonalt vitenarkiv: publikasjoner med forfattere, institusjoner, kategorier og
      fulltekst i åpen tilgang der den finnes. NVA har erstattet Cristin og de lokale vitenarkivene. Søk uten nøkkel.
    category: kultur-og-kunnskap
    access: open
    auth: none
    formats: [JSON]
    endpoints:
      - https://api.nva.unit.no/search/resources
    docs_url: https://swagger-ui.nva.unit.no/
    probe_url: https://api.nva.unit.no/search/resources?query=klima&results=1
    keywords: [forskning, publikasjon, vitenarkiv, nva, cristin, åpen tilgang, open access, research]
    tags: [no-auth]
    quick_start: |
      curl "https://api.nva.unit.no/search/resources?query=klima&results=3"

  - id: sikt-cristin
    title: Cristin API v2
    title_en: Cristin research information API
    description: >-
      Forskningsresultater, personer, prosjekter og institusjoner fra Cristin, uten nøkkel. Cristin er erstattet av
      Nasjonalt vitenarkiv og stengt for ny registrering, så velg NVA for nye resultater. API-et svarer fortsatt og
      dekker historikken.
    category: kultur-og-kunnskap
    access: open
    auth: none
    formats: [JSON]
    endpoints:
      - https://api.cristin.no/v2/
    docs_url: https://api.cristin.no/v2/doc/index.html
    probe_url: https://api.cristin.no/v2/results?title=klima&per_page=1
    merge_with: https://dataservice-catalog.fellesdatakatalog.digdir.no/data-services/5f61d3b3d800fd7444e6ba90
    keywords: [cristin, forskning, publikasjon, forsker, prosjekt, institusjon, research]
    tags: [no-auth]
    quick_start: |
      curl "https://api.cristin.no/v2/results?title=klima&per_page=3"

  - id: sikt-bibsys-sru
    title: BIBSYS-katalogen (SRU)
    title_en: BIBSYS union catalogue (SRU)
    description: >-
      SRU-søk i fellesbibliotekkatalogen til norske universiteter og høgskoler (BIBSYS-nettverket i Alma), med
      CQL-spørringer og svar som MARCXML. Standard SRU 1.2, uten nøkkel; operation=explain beskriver indeksene. Den samme
      katalogen kan høstes med OAI-PMH. Ingen lisens oppgitt.
    category: kultur-og-kunnskap
    access: open
    auth: none
    formats: [XML, MARCXML, OAI-PMH]
    endpoints:
      - https://bibsys-k.alma.exlibrisgroup.com/view/sru/47BIBSYS_NETWORK
      - https://bibsys-k.alma.exlibrisgroup.com/view/oai/47BIBSYS_NETWORK/request
    docs_url: https://bibsys-k.alma.exlibrisgroup.com/view/sru/47BIBSYS_NETWORK?version=1.2&operation=explain
    keywords: [bibliotek, katalog, bøker, bibsys, sru, marc, universitetsbibliotek, library catalogue]
    tags: [no-auth]
    caveats:
      - Ingen lisens oppgitt; katalogen ligger hos Ex Libris (Alma).
      - Avklar bruk i stor skala med Sikt.
    quick_start: |
      curl "https://bibsys-k.alma.exlibrisgroup.com/view/sru/47BIBSYS_NETWORK?version=1.2&operation=searchRetrieve&query=alma.title=fjord&maximumRecords=1"

  - id: sikt-bibsys-autoritetsregister
    title: BIBSYS autoritetsregister (SRU)
    title_en: BIBSYS authority file (SRU)
    description: >-
      Autoritetsregisteret for personer og korporasjoner i norske fag- og forskningsbibliotek: én post per forfatter
      eller organisasjon med navneformer, levetid og identifikatorer, brukt til å samle verk under riktig navn. Standard
      SRU 1.2 uten nøkkel; operation=explain beskriver indeksene. Ingen lisens oppgitt.
    category: kultur-og-kunnskap
    access: open
    auth: none
    formats: [XML]
    endpoints:
      - https://authority.bibsys.no/authority/rest/sru
    docs_url: https://authority.bibsys.no/authority/rest/sru?operation=explain&version=1.2
    probe_url: https://authority.bibsys.no/authority/rest/sru?operation=searchRetrieve&version=1.2&query=ibsen&maximumRecords=1
    keywords: [bibliotek, autoritetsregister, forfatter, navneform, bibsys, sru, authority file, library]
    tags: [no-auth, reference-data]
    caveats:
      - Ingen lisens oppgitt og ingen dokumentasjon utover explain-svaret.
    quick_start: |
      curl "https://authority.bibsys.no/authority/rest/sru?operation=searchRetrieve&version=1.2&query=ibsen&maximumRecords=1"

  - id: sikt-nva-publiseringskanaler
    title: NVA publiseringskanaler (tidsskrifter, serier og forlag)
    title_en: NVA publication channels (journals, series and publishers)
    description: >-
      Register over vitenskapelige publiseringskanaler i NVA: tidsskrifter, serier og forlag med nivå per år, ISSN,
      og tilhørende id. Dette er det som erstattet Kanalregisteret og brukes ved rapportering av vitenskapelig
      publisering. Søk uten nøkkel med query og year, og bla med offset og size.
    category: kultur-og-kunnskap
    access: open
    auth: none
    formats: [JSON]
    endpoints:
      - https://api.nva.unit.no/publication-channels-v2/
    docs_url: https://swagger-ui.nva.unit.no/
    probe_url: https://api.nva.unit.no/publication-channels-v2/journal?query=nature&year=2024
    keywords: [publiseringskanal, tidsskrift, forlag, serie, nivå, issn, kanalregister, nvi, journal register]
    tags: [no-auth, reference-data, undocumented]
    caveats:
      - Ikke dokumentert av eieren, og kan endres uten forvarsel.
      - Ingen lisens oppgitt.
    quick_start: |
      curl "https://api.nva.unit.no/publication-channels-v2/journal?query=nature&year=2024"
      curl "https://api.nva.unit.no/publication-channels-v2/publisher?query=springer&year=2024"

  - id: sikt-nva-cristin-register
    title: NVA, Cristin-register (organisasjoner, prosjekter, finansieringskilder)
    title_en: NVA Cristin register (organisations, projects, funding sources)
    description: >-
      Oppslag i forskningsregistrene som NVA bygger på: organisasjonshierarkiet til norske forskningsinstitusjoner,
      forskningsprosjekter og finansieringskilder, i et nyere JSON-LD-API enn Cristin API v2. Åpent uten nøkkel,
      dokumentert i NVAs OpenAPI-fil. Resultatene pagineres med page og results.
    category: kultur-og-kunnskap
    access: open
    auth: none
    formats: [JSON]
    endpoints:
      - https://api.nva.unit.no/cristin/
    docs_url: https://swagger-ui.nva.unit.no/
    spec_url: https://swagger-ui.nva.unit.no/docs/openapi.yaml
    probe_url: https://api.nva.unit.no/cristin/funding-sources
    keywords: [cristin, forskningsprosjekt, organisasjon, institusjon, finansiering, forskning, nva, research projects]
    tags: [no-auth, reference-data]
    caveats:
      - Overlapper delvis med Cristin API v2, som er avviklet for ny registrering; velg dette for nye integrasjoner.
      - Ingen lisens oppgitt.
    quick_start: |
      curl "https://api.nva.unit.no/cristin/organization/?query=oslo&results=2"
      curl "https://api.nva.unit.no/cristin/project?query=climate&results=2"
      curl "https://api.nva.unit.no/cristin/funding-sources"

  - id: sikt-feide-oidc
    title: Feide OpenID Connect (innlogging for utdanningssektoren)
    title_en: Feide OpenID Connect (login for the education sector)
    description: >-
      Feides OpenID Connect- og OAuth 2.0-leverandør for innlogging og brukerattributter for skoler, universiteter og
      høyskoler. Discovery-dokumentet er åpent, men for å bruke tjenesten må tjenesten din registreres hos Feide og få
      klient-id, og brukerdata utleveres etter hvilke attributtgrupper tjenesten har fått. Dokumentasjonen er åpen.
    category: identitet-og-tilgang
    access: restricted
    auth: oauth2
    formats: [JSON]
    endpoints:
      - https://auth.dataporten.no/
    docs_url: https://docs.feide.no/service_providers/openid_connect/index.html
    probe_url: https://auth.dataporten.no/.well-known/openid-configuration
    keywords: [feide, oidc, openid connect, oauth, innlogging, skole, utdanning, sso, dataporten, login]
    tags: [oauth2, registration]
    caveats:
      - Krever registrering av tjenesten hos Feide (kundeportalen) og avtale med den som eier brukerne.
      - Ingen lisens oppgitt.
    quick_start: |
      # discovery-dokumentet er åpent
      curl "https://auth.dataporten.no/.well-known/openid-configuration"
      # resten krever registrert klient: authorization code med PKCE mot
      # https://auth.dataporten.no/oauth/authorization og https://auth.dataporten.no/oauth/token

  - id: sikt-feide-groups-api
    title: Feide Groups API
    title_en: Feide Groups API
    description: >-
      REST-API for gruppedata i Feide: hvilke grupper en bruker er med i (skoler, basisgrupper, undervisningsgrupper,
      studieprogram og kull), og medlemmer av grupper per organisasjon via domene eller organisasjonsnummer.
      Krever et Feide-token med riktige attributtgrupper (groups-edu, groups-org eller groups-other), og tjenesten
      må være registrert hos Feide.
    category: identitet-og-tilgang
    access: restricted
    auth: oauth2
    formats: [JSON]
    endpoints:
      - https://groups-api.dataporten.no/groups
    docs_url: https://docs.feide.no/reference/apis/groups_api/groups_endpoints.html
    probe_url: https://groups-api.dataporten.no/groups/me/groups
    keywords: [feide, grupper, skole, undervisningsgruppe, klasse, utdanning, groups, medlemmer]
    tags: [oauth2, registration, personal-data]
    caveats:
      - Krever registrert tjeneste og Feide-token med riktige attributtgrupper.
      - Svarene inneholder personopplysninger om elever og ansatte; bruk krever behandlingsgrunnlag.
      - Ingen lisens oppgitt.
    quick_start: |
      curl -H "Authorization: Bearer $FEIDE_TOKEN" \
        "https://groups-api.dataporten.no/groups/me/groups"


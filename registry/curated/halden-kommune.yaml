provider:
  name: Halden kommune
  sector: kommune
  orgnr: "959159092"
apis:
  - id: halden-kommune-agol
    title: Halden kommunes kartdata på ArcGIS Online (REST)
    title_en: Halden municipality map data on ArcGIS Online (REST)
    description: >-
      Halden kommunes åpne tjenestekatalog på ArcGIS Online, med omtrent 450 publiserte kartlag, blant annet
      kommunegrense, kommuneplan, reguleringsplaner, skolekretser, bygninger og sykkelplan. Hvert lag kan
      spørres med /query og gir JSON, uten nøkkel. Katalogen er kommunens arbeidsområde, så lag kommer og går
      og innholdet varierer i kvalitet.
    category: kart-og-geodata
    access: open
    auth: none
    formats: [JSON]
    endpoints:
      - https://services5.arcgis.com/11d3pK26AR5cueFZ/arcgis/rest/services
    docs_url: https://services5.arcgis.com/11d3pK26AR5cueFZ/arcgis/rest/services
    probe_url: https://services5.arcgis.com/11d3pK26AR5cueFZ/arcgis/rest/services?f=json
    keywords: [kommune, kart, arcgis, arcgis online, kartlag, gis, geodata, feature service, Halden]
    tags: [no-auth]
    caveats:
      - Ingen lisens oppgitt.
      - Laglisten er kommunens arbeidskart og endres uten varsel; noen lag er under arbeid eller test.
    quick_start: |
      # kommunegrensen som JSON (lag 1 i Halden_kommune)
      curl "https://services5.arcgis.com/11d3pK26AR5cueFZ/arcgis/rest/services/Halden_kommune/FeatureServer/1/query?where=1=1&outFields=*&returnGeometry=false&f=json"

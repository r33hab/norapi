updated: 2026-11-16
provider:
  name: Sarpsborg kommune
  sector: kommune
apis:
  - id: sarpsborg-kommune-agol
    title: Sarpsborg kommunes kartdata på ArcGIS Online (REST)
    title_en: Sarpsborg municipality map data on ArcGIS Online (REST)
    description: >-
      Sarpsborg kommunes åpne tjenestekatalog på ArcGIS Online, med omtrent 554 publiserte kartlag, blant annet badeplasser, skoler, naturtyper, friluftsliv, kulturmiljø og områdesatsing. Hvert lag
      kan spørres med /query og gir JSON eller GeoJSON, uten nøkkel. Katalogen er kommunens arbeidsområde, så lag
      kommer og går og innholdet varierer i kvalitet.
    category: kart-og-geodata
    access: open
    auth: none
    formats: [JSON, GeoJSON]
    endpoints:
      - https://services.arcgis.com/43oQDcO8lvhTZSOO/arcgis/rest/services
    docs_url: https://services.arcgis.com/43oQDcO8lvhTZSOO/arcgis/rest/services
    probe_url: https://services.arcgis.com/43oQDcO8lvhTZSOO/arcgis/rest/services?f=json
    keywords: [kommune, kart, arcgis, arcgis online, kartlag, gis, geodata, feature service]
    tags: [no-auth]
    caveats:
      - Ingen lisens oppgitt.
      - Laglisten er kommunens arbeidskart og endres uten varsel; noen lag er under arbeid eller test.
      - Noen lag kan inneholde innspill fra innbyggere eller andre persondata, så sjekk laget før du bruker det.
    quick_start: |
      # tjenestene i organisasjonens katalog
      curl "https://services.arcgis.com/43oQDcO8lvhTZSOO/arcgis/rest/services?f=json"

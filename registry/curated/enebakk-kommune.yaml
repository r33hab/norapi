provider:
  name: Enebakk kommune
  orgnr: "964949581"
  sector: kommune
apis:
  - id: enebakk-kommune-agol
    title: Enebakk kommunes kartdata på ArcGIS Online (REST)
    title_en: Enebakk municipality map data on ArcGIS Online (REST)
    description: >-
      Enebakk kommunes åpne tjenestekatalog på ArcGIS Online med 50 publiserte tjenester, blant annet skolekrets, ungdomsskolekrets, valgkrets og severdigheter. Hvert lag kan spørres med /query og gir JSON eller GeoJSON, uten nøkkel. Katalogen er et arbeidsområde, så lag kommer og går og innholdet varierer i kvalitet.
    category: kart-og-geodata
    access: open
    auth: none
    formats: [JSON, GeoJSON]
    endpoints:
      - https://services-eu1.arcgis.com/sTWqtYwVllvOYYIJ/arcgis/rest/services
    docs_url: https://services-eu1.arcgis.com/sTWqtYwVllvOYYIJ/arcgis/rest/services
    probe_url: https://services-eu1.arcgis.com/sTWqtYwVllvOYYIJ/arcgis/rest/services?f=json
    keywords: [enebakk, kommune, kart, arcgis, arcgis online, kartlag, gis, geodata, feature service]
    tags: [no-auth]
    caveats:
      - Ingen lisens oppgitt.
      - Katalogen er et arbeidsområde der lag kommer og går, og noen lag er under arbeid eller test.
      - Noen lag kan inneholde innspill fra innbyggere, så sjekk laget før du bruker det.
    quick_start: |
      # tjenestene i organisasjonens katalog
      curl "https://services-eu1.arcgis.com/sTWqtYwVllvOYYIJ/arcgis/rest/services?f=json"
      # antall objekter i ett lag
      curl "https://services-eu1.arcgis.com/sTWqtYwVllvOYYIJ/arcgis/rest/services/3028_Skolekrets/FeatureServer/0/query?where=1%3D1&returnCountOnly=true&f=json"

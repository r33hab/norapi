provider:
  name: Equinor
  orgnr: "923609016"
  sector: statlig-selskap
apis:
  - id: equinor-api-portal
    title: Equinor API-portal
    title_en: Equinor API portal
    description: >-
      Utviklerportalen for Equinors API-er, bygget på Azure API Management, med API-oversikt, produkter, interaktiv
      testing og nøkkelutdeling. Forsiden, retningslinjer for REST-design og sidene for API-er og produkter laster
      anonymt, men selve API-listen vises ikke uten innlogging. Tilgang til API-ene krever innlogging og abonnement.
    category: annet
    access: restricted
    auth: oauth2
    formats: [JSON]
    endpoints:
      - https://api.equinor.com/
    docs_url: https://api.equinor.com/
    keywords: [equinor, olje, energi, api-portal, apim, developer portal]
    tags: [oauth2]
    caveats:
      - API-listen er ikke lesbar uten innlogging, så enkelt-API-er er ikke oppført.
    quick_start: |
      # åpne portalen, logg inn og abonner på et produkt for å få nøkkel
      curl -I "https://api.equinor.com/"

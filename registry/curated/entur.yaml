  - id: entur-offers
    title: Offers v3 (billettilbud og priser)
    title_en: Offers v3 (ticket offers and prices)
    description: >-
      Søker etter tilbud: billettene en gruppe reisende kan kjøpe, med priser. Du kan søke på en bestemt avgang,
      mellom to stoppesteder eller takstsoner (periodebilletter), eller på en myndighet med flat takst. Beta-versjon
      for partnere med avtale, OAuth2 client credentials.
    category: transport-og-samferdsel
    access: restricted
    auth: oauth2
    formats: [JSON]
    endpoints:
      - https://api.entur.io/offers/v3
    docs_url: https://developer.entur.no/apis/offers-partner
    probe_url: https://developer.entur.no/apis/offers-partner/latest/openapi.json
    spec_url: https://developer.entur.no/apis/offers-partner/latest/openapi.json
    keywords: [tilbud, pris, billett, takst, takstsone, periodebillett, offers, fare]
    tags: [agreement, oauth2]
    caveats:
      - Beta; kan endre seg uten forvarsel.
      - Krever partneravtale med Entur.
      - Ingen lisens oppgitt.
    quick_start: |
      # token fra https://partner.entur.org/oauth/token; søkeparametere står i OpenAPI-spesifikasjonen
      curl -X POST "https://api.entur.io/offers/v3/search/trip-pattern" \
        -H "Authorization: Bearer $TOKEN" -H "ET-Client-Name: firma-app" -H "Content-Type: application/json" -d @sok.json


  - id: entur-geocoder-v3
    title: Geocoder v3 (stedssøk og reverssøk)
    title_en: Geocoder v3 (place search and reverse geocoding)
    description: >-
      Gjeldende versjon av Enturs geokoder: autofullføring, reverssøk fra koordinater og oppslag på id for adresser,
      stoppesteder og andre steder, levert som GeoJSON. Kan filtrere på stedstype, fylke, kommune og takstsone, og
      listes uten søketekst når minst ett filter er satt. Krever en ET-Client-Name-header. Parameteren heter q, ikke

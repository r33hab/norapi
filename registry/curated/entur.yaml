provider:
  name: Entur
  orgnr: "917422575"
  sector: statlig-selskap
apis:
  - id: entur-journey-planner
    title: Journey Planner v3 (GraphQL)
    description: >-
      Reiseplanlegging og rutedata for all kollektivtransport i Norge: reisesøk mellom steder, avgangstavler
      per stoppested, linjer, turer og sanntid. Ett GraphQL-endepunkt. Krever bare en ET-Client-Name-header
      som identifiserer applikasjonen din.
    category: transport-og-samferdsel
    access: open
    auth: none
    formats: [JSON, GraphQL]
    endpoints:
      - https://api.entur.io/journey-planner/v3/graphql
    docs_url: https://developer.entur.org/pages-journeyplanner-journeyplanner
    license: NLOD 2.0
    keywords: [kollektiv, rutetider, reiseplanlegger, avganger, buss, tog, trikk, ferge, stoppested, public transport, transit]
    tags: [starter, no-auth, graphql]
    quick_start: |
      curl -X POST https://api.entur.io/journey-planner/v3/graphql \
        -H "Content-Type: application/json" -H "ET-Client-Name: norapi-demo" \
        -d '{"query":"{ stopPlace(id: \"NSR:StopPlace:58366\") { name estimatedCalls(numberOfDepartures: 3) { expectedDepartureTime destinationDisplay { frontText } } } }"}'

  - id: entur-geocoder
    title: Geocoder (stedssøk)
    description: >-
      Autofullfør og søk på stoppesteder, adresser og steder i Norge, med koordinater og kategorier.
      Bygger på Pelias og Nasjonalt stoppestedsregister.
    category: transport-og-samferdsel
    access: open
    auth: none
    formats: [JSON, GeoJSON]
    endpoints:
      - https://api.entur.io/geocoder/v1/autocomplete
    docs_url: https://developer.entur.org/pages-geocoder-intro
    license: NLOD 2.0
    keywords: [geokoding, stedssøk, autocomplete, stoppested, adresse]
    tags: [no-auth]
    quick_start: |
      curl -H "ET-Client-Name: norapi-demo" "https://api.entur.io/geocoder/v1/autocomplete?text=Oslo%20S&lang=no"

  - id: entur-realtime
    title: Sanntidsdata (SIRI og GTFS-RT)
    description: >-
      Sanntid for hele landet: forventede avgangstider (SIRI ET), kjøretøyposisjoner (SIRI VM) og
      avviksmeldinger (SIRI SX), også som GTFS-Realtime. Strømmer for alt eller per operatør.
    category: transport-og-samferdsel
    access: open
    auth: none
    formats: [XML, Protobuf, JSON]
    endpoints:
      - https://api.entur.io/realtime/v1/rest/et
    docs_url: https://developer.entur.org/pages-real-time-intro
    license: NLOD 2.0
    keywords: [sanntid, siri, gtfs-rt, forsinkelser, kjøretøyposisjon, avvik, realtime]
    tags: [no-auth, streaming]

  - id: entur-stop-places
    title: Nasjonalt stoppestedsregister (NSR)
    description: >-
      Alle stoppesteder, plattformer og knutepunkt i Norge med id-er, navn, koordinater og
      transportmåte. Grunnlaget for id-ene som brukes i Journey Planner og sanntid.
    category: transport-og-samferdsel
    access: open
    auth: none
    formats: [JSON, XML]
    endpoints:
      - https://api.entur.io/stop-places/v1
    docs_url: https://developer.entur.org/pages-nsr-nsr
    license: NLOD 2.0
    keywords: [stoppested, holdeplass, nsr, knutepunkt, plattform]
    tags: [no-auth, reference-data]

  - id: entur-timetable-data
    title: Rutedata som filer (NeTEx og GTFS)
    description: >-
      Komplette rutedatasett for hele landet eller per operatør som NeTEx (den nasjonale standarden) og GTFS,
      oppdatert daglig. Riktig inngang når du vil ha alle rutene lokalt i stedet for å spørre Journey Planner.
    category: transport-og-samferdsel
    access: open
    auth: none
    formats: [NeTEx, GTFS, ZIP]
    endpoints:
      - https://developer.entur.org/stops-and-timetable-data
    docs_url: https://developer.entur.org/stops-and-timetable-data
    license: NLOD 2.0
    keywords: [rutedata, netex, gtfs, rutetabell, datasett, timetable]
    tags: [no-auth, data-files]

  - id: entur-mobility
    title: Mobility v2 (delte sparkesykler, sykler og biler)
    title_en: Shared mobility API
    description: >-
      Delte sparkesykler, bysykler og delebiler fra alle operatører i Norge i ett GraphQL-API: kjøretøy med
      posisjon, stasjoner med ledige plasser, operatører og geofencing-soner. Bygger på GBFS-feedene fra
      operatørene, som også kan hentes rått under /mobility/v2/gbfs. Krever en ET-Client-Name-header.
    category: transport-og-samferdsel
    access: open
    auth: none
    formats: [JSON, GraphQL, GBFS]
    endpoints:
      - https://api.entur.io/mobility/v2/graphql
    docs_url: https://developer.entur.org/pages-mobility-docs-mobility-v2/
    keywords: [sparkesykkel, bysykkel, bildeling, delt mobilitet, gbfs, mikromobilitet, scooter, shared mobility]
    tags: [no-auth, graphql]
    quick_start: |
      curl -X POST https://api.entur.io/mobility/v2/graphql \
        -H "Content-Type: application/json" -H "ET-Client-Name: norapi-demo" \
        -d '{"query":"{ vehicles(lat: 59.911, lon: 10.750, range: 300, count: 3) { id lat lon system { name { translation { value } } } } }"}'

  - id: entur-vehicle-positions
    title: Kjøretøyposisjoner (GraphQL)
    title_en: Vehicle positions
    description: >-
      Busser, trikker og tog i sanntid: posisjon, fart, retning, forsinkelse, linje, neste stopp og
      belegg, filtrert på operatør (codespace), linje eller område. Samme kilde som SIRI VM i sanntidsoppføringen,
      men som GraphQL med abonnement for strømming. Krever en ET-Client-Name-header.
    category: transport-og-samferdsel
    access: open
    auth: none
    formats: [JSON, GraphQL]
    endpoints:
      - https://api.entur.io/realtime/v2/vehicles/graphql
    docs_url: https://developer.entur.org/pages-real-time-vehicle-positions
    license: NLOD 2.0
    keywords: [kjøretøyposisjon, sanntid, buss, trikk, tog, forsinkelse, gps, vehicle positions, realtime]
    tags: [no-auth, graphql, streaming]
    quick_start: |
      curl -X POST https://api.entur.io/realtime/v2/vehicles/graphql \
        -H "Content-Type: application/json" -H "ET-Client-Name: norapi-demo" \
        -d '{"query":"{ vehicles(codespaceId: \"ATB\") { vehicleId lastUpdated delay line { publicCode } location { latitude longitude } } }"}'

  - id: entur-emissions-calculator
    title: Utslippskalkulator (CO2e per transportmiddel)
    title_en: Emissions Calculator (CO2e per transport mode)
    description: >-
      Beregner CO2e-utslipp for en strekning for tog, buss, fly, bil, sykkel og andre transportmidler. Strekningen
      oppgis som stoppesteder fra Nasjonalt stoppestedsregister eller som koordinater, og svaret har ett utslippstall
      per transportmiddel. Åpent for alle, men en ET-Client-Name-header er påkrevd, og tallene er estimater basert på
      typekjøretøy fra SINTEF.
    category: natur-og-miljo
    access: open
    auth: none
    formats: [JSON]
    endpoints:
      - https://api.entur.io/emissions-calculator-api/api/v1/calculate-emissions
    docs_url: https://developer.entur.no/apis/emissions-calculator
    spec_url: https://developer.entur.no/apis/emissions-calculator/latest/openapi.json
    license: NLOD 2.0
    keywords: [utslipp, co2, klimagass, reise, miljø, tog, buss, fly, emissions, carbon footprint]
    tags: [no-auth, rate-limited]
    caveats:
      - Kun POST; ingen GET-adresse å teste anonymt uten å sende en forespørsel.
      - Uten ET-Client-Name gjelder en strengere grense (60 forespørsler per minutt).
    quick_start: |
      curl -X POST https://api.entur.io/emissions-calculator-api/api/v1/calculate-emissions \
        -H "Content-Type: application/json" -H "ET-Client-Name: norapi-demo" \
        -d '{"transportModes":["TRAIN","BIKE"],"route":{"stopIds":["NSR:StopPlace:337","NSR:StopPlace:59983"]},"numberOfPassengers":1}'

  - id: entur-transit-data
    title: Transit Data (NeTEx-data som GraphQL og MCP)
    title_en: Transit Data (NeTEx data as GraphQL and MCP)
    description: >-
      Lesetilgang til det statiske kollektivdatasettet: linjer, stoppesteder, plattformer, turer, operatører og
      myndigheter, fra NeTEx. Samme data kan hentes som GraphQL eller gjennom en MCP-server for KI-agenter. Åpent
      uten nøkkel, men markert beta og kan endre seg.
    category: transport-og-samferdsel
    access: open
    auth: none
    formats: [JSON, GraphQL]
    endpoints:
      - https://api.entur.io/transit-data/v1beta/graphql
    docs_url: https://developer.entur.no/apis/graphql/transit-data
    license: NLOD 2.0
    keywords: [kollektiv, netex, linjer, stoppesteder, operatører, mcp, graphql, transit, public transport]
    tags: [no-auth, graphql, rate-limited]
    caveats:
      - Beta (v1beta); felter og skjema kan endres uten forvarsel.
    quick_start: |
      curl -X POST https://api.entur.io/transit-data/v1beta/graphql \
        -H "Content-Type: application/json" -H "ET-Client-Name: norapi-demo" \
        -d '{"query":"{ lines(first: 2) { nodes { id name publicCode } } }"}'

  - id: entur-journey-planner-mcp
    title: Journey Planner MCP-server
    title_en: Journey Planner MCP server
    description: >-
      MCP-server (Streamable HTTP) som lar KI-agenter planlegge reiser og slå opp avganger i Enturs reiseplanlegger
      uten å skrive GraphQL selv. Åpen uten nøkkel, men krever ET-Client-Name og JSON-RPC-kall med POST.
    category: transport-og-samferdsel
    access: open
    auth: none
    formats: [JSON]
    endpoints:
      - https://api.entur.io/journey-planner-mcp/v1/mcp
    docs_url: https://developer.entur.no/apis/opentripplanner-mcp
    probe_url: https://developer.entur.no/apis/opentripplanner-mcp
    license: NLOD 2.0
    keywords: [mcp, reiseplanlegger, kollektiv, agent, ki, journey planner, model context protocol]
    tags: [no-auth, rate-limited]
    caveats:
      - Kun JSON-RPC over POST; ingen GET-adresse som svarer med data.
    quick_start: |
      curl -X POST https://api.entur.io/journey-planner-mcp/v1/mcp \
        -H "Content-Type: application/json" -H "Accept: application/json, text/event-stream" \
        -H "ET-Client-Name: norapi-demo" \
        -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"demo","version":"1"}}}'

  - id: entur-sales-v2
    title: Sales v2 (billettsalg, OMSA)
    title_en: Sales v2 (ticket sales, OMSA)
    description: >-
      Salgs-API for å søke etter, velge og kjøpe kollektivbilletter, bygget på standarden Open Mobility Sales API
      (OMSA). Dekker pakker, tilbud, kunder, refusjon og endring. Krever partneravtale med Entur og OAuth2 client
      credentials, pluss ET-Client-Name.
    category: transport-og-samferdsel
    access: restricted
    auth: oauth2
    formats: [JSON]
    endpoints:
      - https://api.entur.io/sales/v2
    docs_url: https://developer.entur.no/apis/sales
    probe_url: https://api.entur.io/sales/v2/collections/packages/items
    spec_url: https://developer.entur.no/apis/sales/latest/openapi.json
    keywords: [billett, billettsalg, omsa, kollektiv, salg, refusjon, tickets, sales]
    tags: [agreement, oauth2]
    caveats:
      - Krever partneravtale med Entur; klienter opprettes i Entur Partner av en bruker med rollen Brukeradministrator.
      - Ingen lisens oppgitt.
    quick_start: |
      # token fra https://partner.entur.org/oauth/token (client_credentials, audience https://api.entur.io)
      curl -H "Authorization: Bearer $TOKEN" -H "ET-Client-Name: firma-app" "https://api.entur.io/sales/v2/collections/packages/items"


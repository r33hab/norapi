  - id: entur-transit-data-mcp
    title: Transit Data MCP-server
    title_en: Transit Data MCP server
    description: >-
      MCP-server (Streamable HTTP) som gir KI-agenter lesetilgang til det statiske kollektivdatasettet fra NeTEx:
      linjer, stoppesteder, plattformer, turer, operatører og myndigheter. Samme data som Transit Data GraphQL.
      Åpen uten nøkkel, men krever ET-Client-Name og JSON-RPC-kall med POST, og er markert beta.
    category: transport-og-samferdsel
    access: open
    auth: none
    formats: [JSON]
    endpoints:
      - https://api.entur.io/transit-data/v1beta/mcp
    docs_url: https://developer.entur.no/docs/open-services/transit-data
    license: NLOD 2.0
    keywords: [mcp, kollektiv, netex, linjer, stoppesteder, agent, ki, model context protocol, transit]
    tags: [no-auth, rate-limited]
    caveats:
      - Beta (v1beta); verktøy og skjema kan endres uten forvarsel.
      - Kun JSON-RPC over POST; ingen GET-adresse som svarer med data.
    quick_start: |
      curl -X POST https://api.entur.io/transit-data/v1beta/mcp \
        -H "Content-Type: application/json" -H "Accept: application/json, text/event-stream" \
        -H "ET-Client-Name: norapi-curation" \
        -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"demo","version":"1"}}}'


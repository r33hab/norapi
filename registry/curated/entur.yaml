  - id: entur-osdm
    title: OSDM (setereservasjon for reisende med periodekort)
    title_en: OSDM (seat reservation for travel pass holders)
    description: >-
      Enturs implementasjon av en delmengde av OSDM 3.7.1, den europeiske standarden for salg og distribusjon av
      togbilletter. Foreløpig støttes bare setereservasjon for reisende med periodekort. Krever partneravtale,
      OAuth2 client credentials, rollen Sales channel - OSDM og en Requestor-header med salgssted.
    category: transport-og-samferdsel
    access: restricted
    auth: oauth2
    formats: [JSON]
    endpoints:
      - https://api.entur.io/bifrost/osdm
    docs_url: https://developer.entur.no/docs/partner-services/osdm
    keywords: [osdm, setereservasjon, tog, periodekort, billettering, seat reservation]
    tags: [agreement, oauth2]
    caveats:
      - Krever partneravtale og en klient med rollen Klientrolle - Sales channel - OSDM.
      - Bare en delmengde av OSDM er implementert.
      - Ingen lisens oppgitt.
    quick_start: |
      # token fra https://partner.entur.org/oauth/token; Requestor er base64 av {"entur-pos":"...","entur-distribution-channel":"..."}
      curl -H "Authorization: Bearer $TOKEN" -H "ET-Client-Name: firma-app" -H "Requestor: $REQUESTOR" \
        "https://api.entur.io/bifrost/osdm/reduction-cards"


updated: 2026-11-16
provider:
  name: Avinor
  orgnr: "985198292"
  sector: statlig-selskap
apis:
  - id: avinor-flydata
    title: Avinor flydata (XML-feed)
    description: >-
      Ankomster og avganger for alle Avinors lufthavner med rutenummer, flyselskap, planlagt og
      estimert tid, gate og status. XML uten nøkkel; maks ett kall per lufthavn per tre minutter.
    category: transport-og-samferdsel
    access: open
    auth: none
    formats: [XML]
    endpoints:
      - https://asrv.avinor.no/XmlFeed/v1.0
    docs_url: https://avinor.no/konsern/tjenester/flydata/
    keywords: [fly, flyplass, avganger, ankomster, lufthavn, gardermoen, flights, airport]
    tags: [no-auth, rate-limited]
    quick_start: |
      curl "https://asrv.avinor.no/XmlFeed/v1.0?airport=OSL&direction=D&TimeFrom=0&TimeTo=2"

  - id: avinor-agol
    title: Avinors kartdata på ArcGIS Online (REST)
    title_en: Avinor map data on ArcGIS Online (REST)
    description: >-
      Avinors åpne tjenestekatalog på ArcGIS Online med 25 publiserte tjenester, blant annet RPAS- og dronerestriksjonsområder, utflygingstrase, støysoner og reisetider. Hvert lag kan spørres med /query og gir JSON eller GeoJSON, uten nøkkel. Katalogen er et arbeidsområde, så lag kommer og går og innholdet varierer i kvalitet.
    category: kart-og-geodata
    access: open
    auth: none
    formats: [JSON, GeoJSON]
    endpoints:
      - https://services-eu1.arcgis.com/WCiVfG6duh6vR43N/arcgis/rest/services
    docs_url: https://services-eu1.arcgis.com/WCiVfG6duh6vR43N/arcgis/rest/services
    probe_url: https://services-eu1.arcgis.com/WCiVfG6duh6vR43N/arcgis/rest/services?f=json
    keywords: [avinor, kart, arcgis, arcgis online, kartlag, gis, geodata, feature service]
    tags: [no-auth]
    caveats:
      - Ingen lisens oppgitt.
      - Katalogen er et arbeidsområde der lag kommer og går, og noen lag er under arbeid eller test.
      - Noen lag kan inneholde innspill fra innbyggere, så sjekk laget før du bruker det.
    quick_start: |
      # tjenestene i organisasjonens katalog
      curl "https://services-eu1.arcgis.com/WCiVfG6duh6vR43N/arcgis/rest/services?f=json"
      # antall objekter i ett lag
      curl "https://services-eu1.arcgis.com/WCiVfG6duh6vR43N/arcgis/rest/services/Reisetider_grunnkrets_kommune/FeatureServer/0/query?where=1%3D1&returnCountOnly=true&f=json"

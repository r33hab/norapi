provider:
  name: Universitetet i Bergen
  orgnr: "874789542"
  sector: stat
apis:
  - id: uib-eida-fdsn
    title: Norsk nasjonalt seismisk nettverk (FDSN-tjenester)
    title_en: Norwegian National Seismic Network FDSN web services
    description: >-
      Standard FDSN-webtjenester fra UiB for metadata om seismiske stasjoner og bølgeformer (miniSEED), for det faste
      nettverket NS og en rekke midlertidige nettverk. ObsPy og andre FDSN-klienter virker uten endringer. Tjenesten for
      jordskjelvkataloger (event) finnes ikke her.
    category: natur-og-miljo
    access: open
    auth: none
    formats: [XML, text, miniSEED]
    endpoints:
      - https://eida.geo.uib.no/fdsnws/station/1/
      - https://eida.geo.uib.no/fdsnws/dataselect/1/
    docs_url: https://eida.geo.uib.no/fdsnws/station/1/application.wadl
    probe_url: https://eida.geo.uib.no/fdsnws/station/1/version
    keywords: [seismikk, jordskjelv, seismograf, fdsn, miniseed, nnsn, eida, seismology]
    tags: [no-auth]
    caveats:
      - Ingen lisens oppgitt på tjenesten.
      - Jordskjelvkatalogen (FDSN event) finnes ikke her.
    quick_start: |
      curl "https://eida.geo.uib.no/fdsnws/station/1/query?network=NS&level=station&format=text"

  - id: uib-boap-oai
    title: Bergen Open Access Publishing (OAI-PMH)
    title_en: Bergen Open Access Publishing at UiB (OAI-PMH)
    description: >-
      OAI-PMH-endepunkt for BOAP, UiBs åpne tidsskriftsplattform (Open Journal Systems). Høsting av metadata for
      artikler og hefter fra tidsskrifter utgitt ved og i samarbeid med Universitetet i Bergen, uten nøkkel.
      ListSets viser tidsskriftene, og ListRecords med metadataPrefix=oai_dc gir postene.
    category: kultur-og-kunnskap
    access: open
    auth: none
    formats: [XML]
    endpoints:
      - https://boap.uib.no/index.php/index/oai
    docs_url: https://www.openarchives.org/OAI/openarchivesprotocol.html
    probe_url: https://boap.uib.no/index.php/index/oai?verb=Identify
    keywords: [oai-pmh, tidsskrift, artikler, åpen tilgang, open access, ojs, høsting, uib, harvesting]
    tags: [no-auth, feed]
    caveats:
      - Ingen lisens oppgitt; lisensen følger det enkelte tidsskriftet og artikkelen.
    quick_start: |
      curl "https://boap.uib.no/index.php/index/oai?verb=Identify"
      curl "https://boap.uib.no/index.php/index/oai?verb=ListSets"

  - id: uib-clarino-repository-oai
    title: CLARINO Bergen-arkivet (OAI-PMH, språkressurser)
    title_en: CLARINO Bergen repository (OAI-PMH, language resources)
    description: >-
      OAI-PMH-endepunkt for CLARINO-arkivet ved UiB, som samler norske språkressurser som korpus, leksikon og
      språkmodeller. Standardverbene Identify, ListSets, ListMetadataFormats og ListRecords svarer uten nøkkel, og
      metadata kan høstes i oai_dc. Ressursene selv har egne lisenser.
    category: kultur-og-kunnskap
    access: open
    auth: none
    formats: [XML]
    endpoints:
      - https://repo.clarino.uib.no/oai/request
    docs_url: https://repo.clarino.uib.no/
    probe_url: https://repo.clarino.uib.no/oai/request?verb=Identify
    keywords: [clarino, clarin, språkressurser, korpus, oai-pmh, språkteknologi, norsk, language resources]
    tags: [no-auth, feed]
    caveats:
      - Ingen lisens oppgitt for selve metadataene.
    quick_start: |
      curl "https://repo.clarino.uib.no/oai/request?verb=Identify"

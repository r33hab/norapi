updated: 2026-11-16
provider:
  name: UiT Norges arktiske universitet
  orgnr: "970422528"
  sector: stat
apis:
  - id: uit-dataverseno
    title: DataverseNO API (forskningsdata)
    title_en: DataverseNO research data repository API
    description: >-
      DataverseNO er det nasjonale arkivet for åpne forskningsdata, som UiT driver for et konsortium av norske
      institusjoner. Dataverse-API-et gir søk, metadata og fillister for publiserte datasett uten nøkkel; lisensen
      settes per datasett. Vanlige Dataverse-klienter virker.
    category: kultur-og-kunnskap
    access: open
    auth: none
    formats: [JSON]
    endpoints:
      - https://dataverse.no/api/
    docs_url: https://guides.dataverse.org/en/latest/api/
    probe_url: https://dataverse.no/api/info/version
    keywords: [forskningsdata, datasett, dataverse, åpen forskning, fair, research data]
    tags: [no-auth]
    quick_start: |
      curl "https://dataverse.no/api/search?q=norway&per_page=1"

  - id: uit-divvun
    title: Divvun API (samisk stave- og grammatikkontroll, talesyntese)
    title_en: Divvun API (Sámi spelling, grammar and speech)
    description: >-
      Stavekontroll for nordsamisk, sørsamisk, lulesamisk, enaresamisk, skoltesamisk, færøysk og grønlandsk,
      grammatikkontroll for de fleste av dem, og talesyntese, fra Divvun og Giellatekno ved UiT. Kallene er POST med
      teksten som JSON og svarer uten nøkkel.
    category: kultur-og-kunnskap
    access: open
    auth: none
    formats: [JSON, WAV, MP3]
    endpoints:
      - https://api.giellalt.org/
    docs_url: https://api.giellalt.org/
    keywords: [samisk, sámi, stavekontroll, grammatikk, talesyntese, divvun, giellatekno, språkteknologi]
    tags: [no-auth]
    caveats:
      - Alle kall er POST; helsesjekken /health som dokumentasjonen nevner, svarer 404.
      - Ingen lisens oppgitt.
    quick_start: |
      curl -X POST "https://api.giellalt.org/speller/se" -H "Content-Type: application/json" -d '{"text":"sami"}'

  - id: uit-septentrio-oai
    title: Septentrio Academic Publishing (OAI-PMH)
    title_en: Septentrio Academic Publishing at UiT (OAI-PMH)
    description: >-
      OAI-PMH-endepunkt for Septentrio, UiTs åpne publiseringstjeneste for tidsskrifter og skriftserier (Open
      Journal Systems). Høsting av metadata for artikler og hefter uten nøkkel. ListSets viser tidsskriftene, og
      ListRecords med metadataPrefix=oai_dc gir postene.
    category: kultur-og-kunnskap
    access: open
    auth: none
    formats: [XML]
    endpoints:
      - https://septentrio.uit.no/index.php/index/en/oai
    docs_url: https://www.openarchives.org/OAI/openarchivesprotocol.html
    probe_url: https://septentrio.uit.no/index.php/index/en/oai?verb=Identify
    keywords: [oai-pmh, tidsskrift, artikler, åpen tilgang, open access, ojs, høsting, uit, harvesting]
    tags: [no-auth, feed]
    caveats:
      - Ingen lisens oppgitt; lisensen følger det enkelte tidsskriftet og artikkelen.
      - Basis-URL-en uten språkkode (/index/oai) svarer med 302 til språkvarianten.
    quick_start: |
      curl "https://septentrio.uit.no/index.php/index/en/oai?verb=Identify"
      curl "https://septentrio.uit.no/index.php/index/en/oai?verb=ListSets"

  - id: uit-dataverseno-oai
    title: DataverseNO OAI-PMH (forskningsdata)
    title_en: DataverseNO OAI-PMH (research data)
    description: >-
      OAI-PMH-endepunkt for DataverseNO, den nasjonale åpne forskningsdatatjenesten som drives av UiT. Du kan høste
      metadata om datasett per samling (set) med verbene Identify, ListSets og ListRecords, uten nøkkel. For søk og
      filnedlasting finnes eget Dataverse-API.
    category: kultur-og-kunnskap
    access: open
    auth: none
    formats: [XML]
    endpoints:
      - https://dataverse.no/oai
    docs_url: https://guides.dataverse.org/en/latest/admin/harvestserver.html
    probe_url: https://dataverse.no/oai?verb=Identify
    keywords: [dataverseno, forskningsdata, oai-pmh, metadata, høsting, datasett, research data]
    tags: [no-auth, feed]
    caveats:
      - Ingen lisens oppgitt for selve metadataene, datasettene har egne lisenser.
    quick_start: |
      curl "https://dataverse.no/oai?verb=Identify"

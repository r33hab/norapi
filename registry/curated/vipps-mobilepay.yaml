  - id: vipps-mobilepay-userinfo
    title: Vipps MobilePay Userinfo API
    title_en: Vipps MobilePay Userinfo API
    description: >-
      Henter brukeropplysninger (navn, telefon, e-post, adresse) for en bruker som har samtykket, i flyter som
      ePayment og Checkout, via sub-identifikator. Krever bedriftsavtale og Bearer-token.
    category: identitet-og-tilgang
    access: restricted
    auth: api-key
    formats: [JSON]
    endpoints:
      - https://api.vipps.no/vipps-userinfo-api/userinfo/{sub}
    docs_url: https://developer.vippsmobilepay.com/docs/APIs/userinfo-api/
    spec_url: https://developer.vippsmobilepay.com/redocusaurus/userinfo-swagger-id.yaml
    keywords: [vipps, mobilepay, userinfo, brukeropplysninger, samtykke, sub]
    tags: [private-provider, agreement, personal-data]
    caveats:
      - Krever bedriftsavtale; svarene er personopplysninger og krever samtykke fra brukeren.
      - Ingen lisens oppgitt.
    quick_start: |
      TOKEN=$(curl -s -X POST "https://apitest.vipps.no/accesstoken/get" -H "client_id: $VIPPS_CLIENT_ID" -H "client_secret: $VIPPS_CLIENT_SECRET" -H "Ocp-Apim-Subscription-Key: $VIPPS_SUBSCRIPTION_KEY" -d "" | jq -r .access_token)
      curl "https://apitest.vipps.no/vipps-userinfo-api/userinfo/<sub>" \
        -H "Authorization: Bearer $TOKEN" -H "Ocp-Apim-Subscription-Key: $VIPPS_SUBSCRIPTION_KEY" -H "Merchant-Serial-Number: $VIPPS_MSN"

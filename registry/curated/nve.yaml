apis:
  - id: nve-api
    title: NVE API-portal
    description: >-
      NVEs åpne API-er samlet: kraftverk og magasinstatistikk, nettselskap, skredvarsler (varsom),
      flomvarsel, snødata og vassdrag. Dokumentert per tjeneste på api.nve.no.
    category: natur-og-miljo
    access: open
    auth: none
    formats: [JSON]
    endpoints:
      - https://api.nve.no/
    docs_url: https://api.nve.no/doc/

updated: 2026-10-21
provider:
  name: Norges vassdrags- og energidirektorat
  orgnr: "970205039"
  sector: stat
apis:
  - id: nve-api
    title: NVE API-portal
    description: >-
      NVEs åpne API-er samlet: kraftverk og magasinstatistikk, nettselskap, skredvarsler (varsom),
      flomvarsel, snødata og vassdrag. Dokumentert per tjeneste på api.nve.no.
    category: natur-og-miljo
    access: open
    auth: none
    formats: [JSON]
    endpoints:
      - https://api.nve.no/
    docs_url: https://api.nve.no/doc/
    license: NLOD 2.0
    keywords: [kraftverk, magasin, vannkraft, skred, flom, snø, vassdrag, energi, nettselskap]
    tags: [no-auth]

  - id: nve-hydapi
    title: HydAPI (hydrologiske observasjoner)
    description: >-
      Vannføring, vannstand, vanntemperatur og snø fra NVEs målestasjoner, historisk og sanntid.
      Gratis API-nøkkel ved registrering.
    category: natur-og-miljo
    access: open
    auth: api-key
    formats: [JSON]
    endpoints:
      - https://hydapi.nve.no/api/v1/Stations
    docs_url: https://hydapi.nve.no/UserDocumentation/
    license: NLOD 2.0
    keywords: [vannføring, vannstand, hydrologi, målestasjon, elv, snødybde]
    tags: [registration]

  - id: nve-varsom
    title: Varsom API (snøskred-, flom- og jordskredvarsler)
    title_en: Varsom warnings API
    description: >-
      De offisielle farevarslene fra Varsom som JSON: snøskredvarsel per varslingsregion med faregrad, skredproblemer
      og råd, og egne API-er for flom- og jordskredvarsler. Hvert varsel har sitt eget versjonerte endepunkt under
      api01.nve.no, dokumentert per tjeneste på api.nve.no.
    category: vaer-og-klima
    access: open
    auth: none
    formats: [JSON, XML]
    endpoints:
      - https://api01.nve.no/hydrology/forecast/avalanche/v6.3.0/api/
    docs_url: https://api.nve.no/doc/snoeskredvarsel/
    probe_url: https://api01.nve.no/hydrology/forecast/avalanche/v6.3.0/api/AvalancheWarningByRegion/Simple/3011/1/2026-01-15/2026-01-15
    license: NLOD 2.0
    keywords: [snøskred, skredvarsel, faregrad, flomvarsel, jordskred, varsom, farevarsel, avalanche]
    tags: [no-auth]
    quick_start: |
      # snøskredvarsel for Tromsø (region 3011) på norsk (språk 1)
      curl "https://api01.nve.no/hydrology/forecast/avalanche/v6.3.0/api/AvalancheWarningByRegion/Simple/3011/1/2026-01-15/2026-01-15"

  - id: nve-regobs
    title: Regobs API (observasjoner av snø, is, vann og skred)
    title_en: Regobs observations API
    description: >-
      Feltobservasjoner fra publikum og fagfolk: snødekke, skred, faretegn, isforhold, flom og jordskred, med bilder,
      posisjon og tidspunkt. Datagrunnlaget bak Varsom og Regobs-appen. Søk er en POST med filtre i JSON.
    category: vaer-og-klima
    access: open
    auth: none
    formats: [JSON]
    endpoints:
      - https://api.regobs.no/v5/Search
    docs_url: https://api.regobs.no/v5/swagger/ui/index
    spec_url: https://api.regobs.no/v5/swagger/docs/v5
    probe_url: https://api.regobs.no/v5/KdvElements
    keywords: [regobs, observasjon, snø, skred, is, isforhold, faretegn, varsom, observations]
    tags: [no-auth]
    quick_start: |
      curl -X POST https://api.regobs.no/v5/Search \
        -H "Content-Type: application/json" -d '{"NumberOfRecords":3,"LangKey":1}'

  - id: nve-gridtimeseries
    title: GridTimeSeries (seNorge-data i rutenett)
    title_en: GridTimeSeries API
    description: >-
      Tidsserier for et punkt eller område i Norge fra NVEs rutenettdata: nedbør, temperatur, snødybde, snømengde,
      skiføre, regn og snøsmelting, avrenning og over 80 andre temaer, noen fra 1957. Det er dataene bak seNorge og
      xgeo. Punktet oppgis i UTM sone 33N.
    category: vaer-og-klima
    access: open
    auth: none
    formats: [JSON, XML, CSV]
    endpoints:
      - https://gts.nve.no/api/GridTimeSeries/
    docs_url: https://api.nve.no/doc/gridtimeseries-data-gts/
    probe_url: https://gts.nve.no/api/GridTimeSeries/Themes/json
    keywords: [senorge, xgeo, snødybde, snømengde, nedbør, temperatur, rutenett, tidsserie, avrenning, grid]
    tags: [no-auth]
    quick_start: |
      # døgntemperatur (tm) for et punkt i Oslo (UTM 33: 262000, 6650000)
      curl "https://gts.nve.no/api/GridTimeSeries/262000/6650000/2026-10-01/2026-10-07/tm.json"

  - id: nve-magasinstatistikk
    title: Magasinstatistikk
    title_en: Reservoir statistics
    description: >-
      Fyllingsgrad i vannmagasinene uke for uke, for hele landet og per elspotområde (NO1 til NO5), med kapasitet
      og fylling i TWh, endring fra forrige uke og dato for neste publisering. Egne kall gir hele historikken og
      minimum, maksimum og median per uke.
    category: natur-og-miljo
    access: open
    auth: none
    formats: [JSON]
    endpoints:
      - https://biapi.nve.no/magasinstatistikk/api/Magasinstatistikk/HentOffentligDataSisteUke
    docs_url: https://www.nve.no/energi/analyser-og-statistikk/om-magasinstatistikken/
    spec_url: https://biapi.nve.no/magasinstatistikk/swagger/v1/swagger.json
    merge_with: https://dataservice-catalog.fellesdatakatalog.digdir.no/data-services/6299b5e13e53054cb8027405
    keywords: [magasin, fyllingsgrad, vannkraft, kraftsituasjon, elspotområde, twh, reservoir]
    tags: [no-auth]
    quick_start: |
      curl "https://biapi.nve.no/magasinstatistikk/api/Magasinstatistikk/HentOffentligDataSisteUke"

  - id: nve-vannkraftdatabase
    title: Vannkraftdatabasen API
    title_en: Hydropower plant database API
    description: >-
      Alle vannkraftverk i Norge, i drift eller alle, med hovedeier og organisasjonsnummer, fylke og kommune, dato for
      første utnyttelse, konsesjoner og ytelse. Hele listen over verk i drift er rundt 2 MB JSON. Dokumentert på
      api.nve.no, uten nøkkel.
    category: natur-og-miljo
    access: open
    auth: none
    formats: [JSON]
    endpoints:
      - https://api.nve.no/web/Powerplant/GetHydroPowerPlantsInOperation
      - https://api.nve.no/web/Powerplant/GetHydroPowerPlants
    docs_url: https://api.nve.no/doc/vannkraftdatabase/
    license: NLOD
    keywords: [vannkraft, kraftverk, energi, konsesjon, kraftproduksjon, hydropower]
    tags: [no-auth, reference-data]
    quick_start: |
      curl "https://api.nve.no/web/Powerplant/GetHydroPowerPlantsInOperation"

  - id: nve-vindkraftdatabase
    title: Vindkraftdatabasen API
    title_en: Wind power plant database API
    description: >-
      Vindkraftverk i drift med eiere, organisasjonsnummer og eierandel, prisområde, turbiner med fabrikat, ytelse og
      rotordata, idriftsettelse og forventet årsproduksjon. Dokumentert på api.nve.no, uten nøkkel.
    category: natur-og-miljo
    access: open
    auth: none
    formats: [JSON]
    endpoints:
      - https://api.nve.no/web/WindPowerplant/GetWindPowerPlantsInOperation
    docs_url: https://api.nve.no/doc/vindkraftdatabase/
    license: NLOD
    keywords: [vindkraft, vindturbin, kraftverk, energi, eierskap, wind power]
    tags: [no-auth, reference-data]
    quick_start: |
      curl "https://api.nve.no/web/WindPowerplant/GetWindPowerPlantsInOperation"

  - id: nve-elsertifikater
    title: Elsertifikater API
    title_en: Electricity certificates API
    description: >-
      Søknader og godkjenninger i den norsk-svenske elsertifikatordningen per anlegg: status, type (vann, vind og
      andre), effekt, forventet sertifikatberettiget produksjon, start- og sluttdato, eier med organisasjonsnummer,
      fylke og kommune. Ordningen er stengt for nye anlegg, så dataene er mest historiske.
    category: natur-og-miljo
    access: open
    auth: none
    formats: [JSON]
    endpoints:
      - https://api.nve.no/web/ElCert/GetApplications
    docs_url: https://api.nve.no/doc/elsertifikater/
    license: NLOD
    keywords: [elsertifikat, fornybar, kraftverk, energi, sertifikatordningen, electricity certificates]
    tags: [no-auth]
    quick_start: |
      curl "https://api.nve.no/web/ElCert/GetApplications"

  - id: nve-chartserver
    title: NVE ChartServer (hydrologiske tidsserier)
    title_en: NVE ChartServer (hydrological time series)
    description: >-
      Tidsserier for vannføring, nedbør, snødybde, grunnvann og annet som JSON, angitt med serie-id i en
      spørrestreng, blant annet de historiske vannføringsseriene for uregulerte stasjoner som NVE-dokumentasjonen peker
      til. Spørrespråket er bare beskrevet gjennom eksempler på startsiden og i et Python-eksempel fra NVE. Uten nøkkel.
    category: vaer-og-klima
    access: open
    auth: none
    formats: [JSON, HTML]
    endpoints:
      - https://chartserver.nve.no/ShowData.aspx
    docs_url: https://api.nve.no/doc/historiske-vannfoeringsdata/
    probe_url: https://chartserver.nve.no/ShowData.aspx?req=getchart&ver=1.0&vfmt=json&time=20140101T0000;20140105T0000&chd=ds=htsr,da=29,id=212.10.0.1001.1
    keywords: [vannføring, hydrologi, tidsserier, nedbør, snødybde, grunnvann, streamflow]
    tags: [no-auth, undocumented]
    caveats:
      - Spørrespråket er bare beskrevet gjennom eksempler.
      - NVE oppgir NLOD for data på api.nve.no, men sier ikke uttrykkelig at ChartServer er omfattet.
    quick_start: |
      curl "https://chartserver.nve.no/ShowData.aspx?req=getchart&ver=1.0&vfmt=json&time=20140101T0000;20140105T0000&chd=ds=htsr,da=29,id=212.10.0.1001.1"

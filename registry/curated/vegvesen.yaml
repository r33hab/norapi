    keywords: [kjøretøy, eier, kjøretøyregisteret, kjennemerke, understellsnummer, vehicle owner]
    tags: [agreement, maskinporten, personal-data]
    caveats:
      - Leverer navn og adresse til eier, så virksomheten blir behandlingsansvarlig og må ha behandlingsgrunnlag.
      - Du kan ikke bygge et historisk register av eieropplysninger; slå opp på nytt mot registeret.
      - Testmiljøet er gratis, men krever en henvendelse til Statens vegvesen.


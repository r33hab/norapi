      Tekniske kjøretøydata med eieropplysninger fra Kjøretøyregisteret, slått opp på kjennemerke, understellsnummer eller
      eier, også tilbake i tid. Åpent bare for virksomheter som har avtale med Statens vegvesen, og du bestiller i Din
      side med BankID og riktige Altinn-rettigheter. Autentisering skjer med Maskinporten (scope
      svv:kjoretoy/kjoretoyopplysninger), og tilgangen faktureres per måned etter oppslagskvote.

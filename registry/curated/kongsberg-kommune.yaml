provider:
  name: Kongsberg kommune
  orgnr: "942402465"
  sector: kommune
apis:
  - id: kongsberg-kommune-agol
    title: Kongsberg kommunes kartdata på ArcGIS Online (REST)
    title_en: Kongsberg municipality map data on ArcGIS Online (REST)
    description: >-
      Kongsberg kommunes åpne tjenestekatalog på ArcGIS Online med 186 publiserte tjenester, blant annet badeplasser, barnehager, fredet eiendom og boligreserve. Hvert lag kan spørres med /query og gir JSON eller GeoJSON, uten nøkkel. Katalogen er et arbeidsområde, så lag kommer og går og innholdet varierer i kvalitet.
    category: kart-og-geodata
    access: open
    auth: none
    formats: [JSON, GeoJSON]
    endpoints:
      - https://services-eu1.arcgis.com/GTQv7BSJVIHXMx2p/arcgis/rest/services
    docs_url: https://services-eu1.arcgis.com/GTQv7BSJVIHXMx2p/arcgis/rest/services
    probe_url: https://services-eu1.arcgis.com/GTQv7BSJVIHXMx2p/arcgis/rest/services?f=json
    keywords: [kongsberg, kommune, kart, arcgis, arcgis online, kartlag, gis, geodata, feature service]
    tags: [no-auth]
    caveats:
      - Ingen lisens oppgitt.
      - Katalogen er et arbeidsområde der lag kommer og går, og noen lag er under arbeid eller test.
      - Noen lag kan inneholde innspill fra innbyggere, så sjekk laget før du bruker det.
    quick_start: |
      # tjenestene i organisasjonens katalog
      curl "https://services-eu1.arcgis.com/GTQv7BSJVIHXMx2p/arcgis/rest/services?f=json"
      # antall objekter i ett lag
      curl "https://services-eu1.arcgis.com/GTQv7BSJVIHXMx2p/arcgis/rest/services/frilufthcparkering/FeatureServer/0/query?where=1%3D1&returnCountOnly=true&f=json"

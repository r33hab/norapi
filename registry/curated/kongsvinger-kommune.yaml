updated: 2026-11-16
provider:
  name: Kongsvinger kommune
  orgnr: "944117784"
  sector: kommune
apis:
  - id: kongsvinger-kommune-agol
    title: Kongsvinger kommunes kartdata på ArcGIS Online (REST)
    title_en: Kongsvinger municipality map data on ArcGIS Online (REST)
    description: >-
      Kongsvinger kommunes åpne tjenestekatalog på ArcGIS Online med 112 publiserte tjenester, blant annet badeplasser, skoler, verdsatte naturtyper og sykkelskilt. Hvert lag kan spørres med /query og gir JSON eller GeoJSON, uten nøkkel. Katalogen er et arbeidsområde, så lag kommer og går og innholdet varierer i kvalitet.
    category: kart-og-geodata
    access: open
    auth: none
    formats: [JSON, GeoJSON]
    endpoints:
      - https://services-eu1.arcgis.com/JDjng4fWGMwWUpNf/arcgis/rest/services
    docs_url: https://services-eu1.arcgis.com/JDjng4fWGMwWUpNf/arcgis/rest/services
    probe_url: https://services-eu1.arcgis.com/JDjng4fWGMwWUpNf/arcgis/rest/services?f=json
    keywords: [kongsvinger, kommune, kart, arcgis, arcgis online, kartlag, gis, geodata, feature service]
    tags: [no-auth]
    caveats:
      - Ingen lisens oppgitt.
      - Katalogen er et arbeidsområde der lag kommer og går, og noen lag er under arbeid eller test.
      - Noen lag kan inneholde innspill fra innbyggere, så sjekk laget før du bruker det.
    quick_start: |
      # tjenestene i organisasjonens katalog
      curl "https://services-eu1.arcgis.com/JDjng4fWGMwWUpNf/arcgis/rest/services?f=json"
      # antall objekter i ett lag
      curl "https://services-eu1.arcgis.com/JDjng4fWGMwWUpNf/arcgis/rest/services/Sykkelskilt/FeatureServer/0/query?where=1%3D1&returnCountOnly=true&f=json"

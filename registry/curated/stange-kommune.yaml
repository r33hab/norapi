updated: 2026-11-16
provider:
  name: Stange kommune
  sector: kommune
apis:
  - id: stange-kommune-agol
    title: Stange kommunes kartdata på ArcGIS Online (REST)
    title_en: Stange municipality map data on ArcGIS Online (REST)
    description: >-
      Stange kommunes åpne tjenestekatalog på ArcGIS Online, med omtrent 370 publiserte kartlag, blant annet badevannsprøver, barnehager, idrettsanlegg, innsamlingsroder, stemmekretser og vegnett. Hvert lag
      kan spørres med /query og gir JSON eller GeoJSON, uten nøkkel. Katalogen er kommunens arbeidsområde, så lag
      kommer og går og innholdet varierer i kvalitet.
    category: kart-og-geodata
    access: open
    auth: none
    formats: [JSON, GeoJSON]
    endpoints:
      - https://services-eu1.arcgis.com/odXSXZtZc842y9uS/arcgis/rest/services
    docs_url: https://services-eu1.arcgis.com/odXSXZtZc842y9uS/arcgis/rest/services
    probe_url: https://services-eu1.arcgis.com/odXSXZtZc842y9uS/arcgis/rest/services?f=json
    keywords: [kommune, kart, arcgis, arcgis online, kartlag, gis, geodata, feature service]
    tags: [no-auth]
    caveats:
      - Ingen lisens oppgitt.
      - Laglisten er kommunens arbeidskart og endres uten varsel; noen lag er under arbeid eller test.
      - Noen lag kan inneholde innspill fra innbyggere eller andre persondata, så sjekk laget før du bruker det.
    quick_start: |
      # tjenestene i organisasjonens katalog
      curl "https://services-eu1.arcgis.com/odXSXZtZc842y9uS/arcgis/rest/services?f=json"

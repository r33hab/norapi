provider:
  name: Nasjonalbiblioteket
  orgnr: "976029100"
  sector: stat
apis:
  - id: nb-api
    title: Nasjonalbibliotekets API (nb.no)
    description: >-
      Søk i digitaliserte bøker, aviser, bilder, kart og tidsskrifter i nb.no, med metadata, fulltekst der
      rettighetene tillater, og IIIF for bilder.
    category: kultur-og-kunnskap
    access: open
    auth: none
    formats: [JSON, IIIF]
    endpoints:
      - https://api.nb.no/catalog/v1/items
    docs_url: https://api.nb.no/
    probe_url: https://api.nb.no/catalog/v1/items?q=Ibsen&size=1
    keywords: [bibliotek, bøker, aviser, bilder, digitalisert, iiif, fulltekst, library]
    tags: [no-auth]
    quick_start: |
      curl "https://api.nb.no/catalog/v1/items?q=Ibsen&size=3"

  - id: nb-dhlab
    title: DH-lab API (tekst- og korpusanalyse)
    title_en: DH-lab text analysis API
    description: >-
      Tekstanalyse over Nasjonalbibliotekets samling: n-gram over bøker, aviser og tidsskrifter, konkordanser,
      frekvenslister, spredning og egne korpus satt sammen fra metadata. Det er API-et bak Python-pakken dhlab, og
      Swagger-dokumentasjonen ligger på selve API-et.
    category: kultur-og-kunnskap
    access: open
    auth: none
    formats: [JSON]
    endpoints:
      - https://api.nb.no/dhlab/
    docs_url: https://api.nb.no/dhlab/
    spec_url: https://api.nb.no/dhlab/apispec_1.json
    probe_url: https://api.nb.no/dhlab/totals/5
    keywords: [ngram, korpus, konkordans, tekstanalyse, språk, digital humaniora, frekvens, dhlab, corpus]
    tags: [no-auth]
    quick_start: |
      curl -X POST https://api.nb.no/dhlab/ngram_book -H "Content-Type: application/json" \
        -d '{"word":["klima"],"period":[2000,2005]}'

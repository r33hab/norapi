updated: 2026-11-16
provider:
  name: Ringsaker kommune
  sector: kommune
apis:
  - id: ringsaker-kommune-agol
    title: Ringsaker kommunes kartdata på ArcGIS Online (REST)
    title_en: Ringsaker municipality map data on ArcGIS Online (REST)
    description: >-
      Ringsaker kommunes åpne tjenestekatalog på ArcGIS Online, med omtrent 209 publiserte kartlag, blant annet grunnkretser med befolkningstall, eiendomsskattesoner, gang- og sykkelveg, AR5 og innspill til kommuneplanens arealdel. Hvert lag
      kan spørres med /query og gir JSON eller GeoJSON, uten nøkkel. Katalogen er kommunens arbeidsområde, så lag
      kommer og går og innholdet varierer i kvalitet.
    category: kart-og-geodata
    access: open
    auth: none
    formats: [JSON, GeoJSON]
    endpoints:
      - https://services-eu1.arcgis.com/0JaBzQFeLKLywnub/arcgis/rest/services
    docs_url: https://services-eu1.arcgis.com/0JaBzQFeLKLywnub/arcgis/rest/services
    probe_url: https://services-eu1.arcgis.com/0JaBzQFeLKLywnub/arcgis/rest/services?f=json
    keywords: [kommune, kart, arcgis, arcgis online, kartlag, gis, geodata, feature service]
    tags: [no-auth]
    caveats:
      - Ingen lisens oppgitt.
      - Laglisten er kommunens arbeidskart og endres uten varsel; noen lag er under arbeid eller test.
      - Noen lag kan inneholde innspill fra innbyggere eller andre persondata, så sjekk laget før du bruker det.
    quick_start: |
      # tjenestene i organisasjonens katalog
      curl "https://services-eu1.arcgis.com/0JaBzQFeLKLywnub/arcgis/rest/services?f=json"
      # fem objekter fra ett lag, som GeoJSON
      curl "https://services-eu1.arcgis.com/0JaBzQFeLKLywnub/arcgis/rest/services/3411_grunnkretser/FeatureServer/0/query?where=1%3D1&outFields=*&resultRecordCount=5&f=geojson"

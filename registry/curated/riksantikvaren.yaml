apis:
  - id: riksantikvaren-wp-api
    title: Riksantikvaren.no (innholds-API for nyheter, fredninger og veiledere)
    title_en: Riksantikvaren.no content API (news, listings and guides)
    description: >-
      WordPress REST-API på riksantikvaren.no med nyheter, pressemeldinger, fredningssaker, veiledere, prosjekter,
      kalender, nettutstillinger og ordliste som JSON. Åpent uten nøkkel, men ikke dokumentert av eieren. Typene
      «ansatte» finnes også; ikke bruk dem til å kartlegge enkeltpersoner.
    category: kultur-og-kunnskap
    access: open
    auth: none
    formats: [JSON]
    endpoints:
      - https://www.riksantikvaren.no/wp-json/wp/v2
    docs_url: https://developer.wordpress.org/rest-api/reference/
    probe_url: https://www.riksantikvaren.no/wp-json/wp/v2/posts?per_page=1
    keywords: [riksantikvaren, kulturminner, fredning, vern, pressemeldinger, veiledere, cultural heritage, wordpress]
    tags: [no-auth, undocumented]
    caveats:
      - Ikke dokumentert av eieren, og kan endres uten forvarsel.
      - Ingen lisens oppgitt.
    quick_start: |
      # siste nyheter
      curl "https://www.riksantikvaren.no/wp-json/wp/v2/posts?per_page=5&_fields=id,date,link,title"
      # fredningssaker
      curl "https://www.riksantikvaren.no/wp-json/wp/v2/fredning?per_page=5&_fields=id,date,link,title"


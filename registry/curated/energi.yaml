  sector: statlig-selskap
apis:
  - id: statnett-driftsdata
    title: Driftsdata (produksjon, forbruk og flyt i sanntid)
    description: >-
      Det nordiske kraftsystemet akkurat nå: produksjon og forbruk per land, utveksling mellom områder,
      frekvens og kraftbalanse, som JSON. Det er API-et bak Statnetts egen driftsdata-side; det er åpent,
      men ikke formelt dokumentert, så feltnavn kan endre seg uten varsel.
    category: natur-og-miljo
    access: open
    auth: none
    formats: [JSON]
    endpoints:
      - https://driftsdata.statnett.no/restapi/ProductionConsumption/GetLatestDetailedOverview
    docs_url: https://driftsdata.statnett.no/
    keywords: [kraft, strøm, produksjon, forbruk, frekvens, kraftbalanse, nordpool, sanntid, power grid]
    tags: [no-auth, undocumented]
    caveats:
      - Ikke dokumentert av Statnett, og kan endres uten forvarsel.
    quick_start: |
      curl "https://driftsdata.statnett.no/restapi/ProductionConsumption/GetLatestDetailedOverview"

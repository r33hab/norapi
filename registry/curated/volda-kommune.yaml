provider:
  name: Volda kommune
  orgnr: "939760946"
  sector: kommune
apis:
  - id: volda-kommune-agol
    title: Volda kommunes kartdata på ArcGIS Online (REST)
    title_en: Volda municipality map data on ArcGIS Online (REST)
    description: >-
      Volda kommunes åpne tjenestekatalog på ArcGIS Online med 39 publiserte tjenester, blant annet naturtyper, rødlista arter, kulturlandskap og akvakultur. Hvert lag kan spørres med /query og gir JSON eller GeoJSON, uten nøkkel. Katalogen er et arbeidsområde, så lag kommer og går og innholdet varierer i kvalitet.
    category: kart-og-geodata
    access: open
    auth: none
    formats: [JSON, GeoJSON]
    endpoints:
      - https://services-eu1.arcgis.com/Q7w7sXevXH7cs2Gl/arcgis/rest/services
    docs_url: https://services-eu1.arcgis.com/Q7w7sXevXH7cs2Gl/arcgis/rest/services
    probe_url: https://services-eu1.arcgis.com/Q7w7sXevXH7cs2Gl/arcgis/rest/services?f=json
    keywords: [volda, kommune, kart, arcgis, arcgis online, kartlag, gis, geodata, feature service]
    tags: [no-auth]
    caveats:
      - Ingen lisens oppgitt.
      - Katalogen er et arbeidsområde der lag kommer og går, og noen lag er under arbeid eller test.
      - Noen lag kan inneholde innspill fra innbyggere, så sjekk laget før du bruker det.
    quick_start: |
      # tjenestene i organisasjonens katalog
      curl "https://services-eu1.arcgis.com/Q7w7sXevXH7cs2Gl/arcgis/rest/services?f=json"
      # antall objekter i ett lag
      curl "https://services-eu1.arcgis.com/Q7w7sXevXH7cs2Gl/arcgis/rest/services/Naturtyper_p%C3%A5_land_%28NiN%29/FeatureServer/0/query?where=1%3D1&returnCountOnly=true&f=json"

  - id: volda-kommune-agol-sentrumsplan-3d
    title: Volda kommunes plan- og 3D-kartdata på ArcGIS Online (REST)
    title_en: Volda municipality planning and 3D map data on ArcGIS Online (REST)
    description: >-
      Voldas andre åpne ArcGIS Online-katalog med 46 tjenester, i hovedsak underlag for sentrumsplanlegging og 3D-modellering: bygningsflater fra FKB, høyder, takform, akser, utbyggingstomter og kommuneplansoner. Hvert lag kan spørres med /query og gir JSON eller GeoJSON, uten nøkkel. Katalogen er kommunens arbeidskart, så lag kommer og går og navnene er lite beskrivende.
    category: kart-og-geodata
    access: open
    auth: none
    formats: [JSON, GeoJSON]
    endpoints:
      - https://services-eu1.arcgis.com/cQuv4IteGgu1IZ7b/arcgis/rest/services
    docs_url: https://services-eu1.arcgis.com/cQuv4IteGgu1IZ7b/arcgis/rest/services
    probe_url: https://services-eu1.arcgis.com/cQuv4IteGgu1IZ7b/arcgis/rest/services?f=json
    keywords: [volda, kommune, kart, arcgis, arcgis online, bygninger, 3d, sentrumsplan, kartlag, gis, geodata, feature service]
    tags: [no-auth]
    caveats:
      - Ingen lisens oppgitt.
      - Laglisten er kommunens arbeidskart og endres uten varsel.
    quick_start: |
      # tjenestene i organisasjonens katalog
      curl "https://services-eu1.arcgis.com/cQuv4IteGgu1IZ7b/arcgis/rest/services?f=json"
      # antall bygningsflater i ett lag
      curl "https://services-eu1.arcgis.com/cQuv4IteGgu1IZ7b/arcgis/rest/services/FKB_BygningFlate_typebygg/FeatureServer/0/query?where=1%3D1&returnCountOnly=true&f=json"

    docs_url: https://skatteetaten.github.io/api-dokumentasjon/api/innrapportering-amelding-filopplasting
    keywords: [a-melding, filopplasting, a-ordningen, innrapportering]
    tags: [agreement, maskinporten]

  - id: skatteetaten-avstemmingsrapport-amelding
    title: Avstemmingsrapport A-melding API
    description: >-
      Tjeneste for avstemmingsrapporten til a-meldingen (tidligere A06 og A07). Krever Maskinporten med scope

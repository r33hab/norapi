apis:
  - id: skatteetaten-api-portal
    title: Skatteetatens API-er (oversikt)
    description: >-
      Samlet dokumentasjon for Skatteetatens API-er: summert skattegrunnlag, inntektsmottakere, a-melding,
      mva-melding, skattemelding, tjenestepensjon og mer. Nesten alt krever Maskinporten med et scope som
      tildeles etter søknad, og mange er avgrenset til bestemte brukergrupper (banker, kommuner, NAV).
    category: skatt-og-avgift
    access: restricted
    auth: maskinporten
    formats: [JSON]
    endpoints:
      - https://api.skatteetaten.no/
    docs_url: https://skatteetaten.github.io/api-dokumentasjon/
    keywords: [skatt, skattemelding, inntekt, a-melding, mva, summert skattegrunnlag, tjenestepensjon, tax]
    tags: [agreement, maskinporten]

  - id: skatteetaten-folkeregisteret
    title: Folkeregisteret API
    description: >-
      Oppslag og hendelsesfeed fra Folkeregisteret: personer, identitetsnummer, bosted, familierelasjoner
      og statuser. Tilgang gis etter rettsgrunnlag, med Maskinporten og ulike rettighetspakker.
    category: offentlig-forvaltning
    access: restricted
    auth: maskinporten
    formats: [JSON]
    endpoints:
      - https://api.skatteetaten.no/folkeregisteret
    docs_url: https://skatteetaten.github.io/folkeregisteret-api-dokumentasjon/
    keywords: [folkeregister, fødselsnummer, d-nummer, bosted, personopplysninger, population register]
    tags: [agreement, maskinporten, personal-data]

  - id: skatteetaten-innrapportering-amelding
    title: Innrapportering A-melding API
    description: >-
      REST-API for innrapportering av a-meldingen fra lønns- og regnskapssystemer (tidligere A02), med et eget
      filopplastings-API og et tilbakemeldings-API. Krever Maskinporten med scope
      `skatteetaten:innrapporteringamelding` og systembruker i Altinn. Tilbakemeldingen fra Skatteetaten hentes
      ved å lytte på hendelser i Dialogporten.
    category: skatt-og-avgift
    access: restricted
    auth: maskinporten
    formats: [JSON]
    endpoints:
      - https://innrapporteringamelding.api.skatteetaten.no
    spec_url: https://api.swaggerhub.com/apis/skatteetaten/innrapportering-amelding-api/0.1.2
    docs_url: https://skatteetaten.github.io/api-dokumentasjon/api/innrapportering-amelding
    keywords: [a-melding, a-ordningen, lønn, innrapportering, arbeidsgiver]
    tags: [agreement, maskinporten]

  - id: skatteetaten-innrapportering-amelding-filopplasting
    title: Innrapportering A-melding filopplasting API
    description: >-
      Tjeneste for innrapportering av a-meldingen ved filopplasting, med samme innhold som REST-API-et for
      a-melding. Scopet `skatteetaten:innrapporteringamelding` brukes også her, sammen med Maskinporten og
      systembruker i Altinn. Skatteetaten må gi virksomheten tilgang, og tilbakemelding kommer via Dialogporten.
    category: skatt-og-avgift
    access: restricted
    auth: maskinporten

  - id: skatteetaten-mva-melding-innsending
    title: Mva-melding innsending API
    description: >-
      Innsending av mva-melding fra sluttbrukersystem: ordinær mva-melding (RF-0002/0004), omvendt avgiftsplikt
      (RF-0005) og skattemelding for merverdiavgiftskompensasjon (RF-0009). Innsendingen går mot en Altinn 3-app
      via instans-API-et, og du veksler ID-porten-token til Altinn-token (scope `altinn:instances.read` og
      `altinn:instances.write`). Skatteetaten har et eget validerings-API du bør kalle først.
    category: skatt-og-avgift
    access: restricted
    auth: id-porten
    formats: [JSON]
    endpoints:
      - https://skd.apps.altinn.no/skd/mva-melding-innsending-v1
    docs_url: https://skatteetaten.github.io/api-dokumentasjon/api/mvameldinginnsending
    keywords: [mva-melding, merverdiavgift, innsending, altinn, RF-0002]
    tags: [agreement, id-porten]
    caveats:
      - "Testmiljøet ligger i Altinn tt02 (skd.apps.tt02.altinn.no) og krever syntetiske organisasjoner."

  - id: skatteetaten-mva-melding-validering
    title: Mva-melding validering API
    description: >-
      Validerer en mva-melding som XML før innsending, med POST til valideringstjenesten. Krever ID-porten-token
      med scope `skatteetaten:mvameldingvalidering`, og tilgang bestilles hos Skatteetaten. Testmiljøet ligger
      på idporten-api-test.sits.no.
    category: skatt-og-avgift
    access: restricted
    auth: id-porten
    formats: [XML, JSON]
    endpoints:
      - https://idporten.api.skatteetaten.no/api/mva/grensesnittstoette/mva-melding/valider
    docs_url: https://skatteetaten.github.io/api-dokumentasjon/api/mvameldingvalidering
    keywords: [mva-melding, validering, merverdiavgift]
    tags: [agreement, id-porten]

  - id: skatteetaten-innrapportering-skattemelding
    title: Innrapportering skattemelding API
    description: >-
      Innsending av skattemelding og næringsspesifikasjon fra sluttbrukersystem, med egne utfyllings- og
      valideringstjenester. Krever Maskinporten med scope `skatteetaten:formueinntekt/skattemelding`, og selve
      innsendingen går mot en Altinn 3-app. Signering og videresending fra skattepliktig eller revisor krever
      ID-porten, siden Skatteetaten må vite hvem som handler. Dokumentasjon og spesifikasjoner ligger på GitHub.
    category: skatt-og-avgift
    access: restricted
    auth: maskinporten
    formats: [XML]
    endpoints:
      - https://skd.apps.altinn.no/skd/formueinntekt-skattemelding-v2
      - https://idporten.api.skatteetaten.no/api/skattemelding/v2
    docs_url: https://skatteetaten.github.io/api-dokumentasjon/api/innrapportering-skattemelding
    keywords: [skattemelding, næringsspesifikasjon, innsending, sluttbrukersystem, altinn]
    tags: [agreement, maskinporten, id-porten]

  - id: skatteetaten-skattekort-til-arbeidsgiver
    title: Skattekort til arbeidsgiver API
    description: >-
      Arbeidsgivere og lønnssystemer henter skattekort for sine ansatte: du bestiller skattekort og henter svar
      og endringer. Krever Maskinporten med scope `skatteetaten:skattekorttilarbeidsgiver` og systembruker i
      Altinn. Tilgang bestilles via Skatteetatens servicedesk.
    category: skatt-og-avgift
    access: restricted
    auth: maskinporten
    formats: [JSON, XML]
    endpoints:
      - https://api.skatteetaten.no/api/forskudd
    spec_url: https://api.swaggerhub.com/apis/skatteetaten/skattekort-til-arbeidsgiver/3.0.1
    docs_url: https://skatteetaten.github.io/api-dokumentasjon/api/skattekorttilarbeidsgiver
    keywords: [skattekort, forskuddstrekk, arbeidsgiver, lønn]
    tags: [agreement, maskinporten, personal-data]
    caveats:
      - "Leverer skattekort for enkeltpersoner, så virksomheten må ha behandlingsgrunnlag."

  - id: skatteetaten-innkrevingsoppdrag
    title: Innkrevingsoppdrag API
    description: >-
      Oppdragsgivere som bruker Skatteetaten til innkreving av pengekrav oppretter, endrer og avskriver
      innkrevingsoppdrag, avstemmer dem og henter oversikt over egne krav. Målgruppen er i hovedsak offentlige
      virksomheter. Krever Maskinporten med scope `skatteetaten:innkrevingsoppdrag` og en rettighetspakke etter
      kontakt med Skatteetaten.
    category: skatt-og-avgift
    access: restricted
    auth: maskinporten
    formats: [JSON]
    spec_url: https://api.swaggerhub.com/apis/skatteetaten/oppdragsinnkreving-api/1.0.6
    docs_url: https://skatteetaten.github.io/api-dokumentasjon/api/innkrevingsoppdrag
    keywords: [innkreving, innkrevingsoppdrag, krav, oppdragsgiver]
    tags: [agreement, maskinporten]

  - id: skatteetaten-utleggsbegjaering-elan
    title: "ELAN Utleggsbegjæring API (innsending, innsyn og status)"
    description: >-
      ELAN sender utleggsbegjæringer til namsmannen gjennom Skatteetatens systemløsninger, med egne tjenester
      for innsyn i trekk og status på sak. Målgruppen er inkassosystemer, kommuner og andre systemleverandører.
      Krever Maskinporten med scope `skatteetaten:utleggsbegjaering` og systembruker (ressurs `ske-
      utleggsbegjaering`), og tilgang avtales med Skatteetaten.
    category: skatt-og-avgift
    access: restricted
    auth: maskinporten
    formats: [JSON]
    endpoints:
      - https://api.skatteetaten.no/api/utleggsbegjaering/v2
    spec_url: https://api.swaggerhub.com/apis/skatteetaten/utleggsbegjaering-api/2.1.0
    docs_url: https://skatteetaten.github.io/api-dokumentasjon/api/utleggsbegjaering
    keywords: [utleggsbegjæring, namsmann, innkreving, ELAN, utleggstrekk]
    tags: [agreement, maskinporten]
    caveats:
      - "Testmiljøet ligger på api-test.sits.no, og enkelte av tjenestene er ikke ferdig implementert."

  - id: skatteetaten-utleggstrekk-fra-kommune
    title: Utleggstrekkbeslutning fra kommune API
    description: >-
      For kommuner som bruker særnamsmyndigheten og behandler utlegg etter nytt regelverk: kommunen sender
      utleggstrekkbeslutninger til Skatteetaten. Krever Maskinporten med scope
      `skatteetaten:utleggstrekkbeslutningkommune` og systembruker. OpenAPI-spesifikasjonen ligger på
      SwaggerHub.
    category: skatt-og-avgift
    access: restricted
    auth: maskinporten
    formats: [JSON]
    spec_url: https://api.swaggerhub.com/apis/skatteetaten/utleggsbegjaering-kommune-api/2.0.1
    docs_url: https://skatteetaten.github.io/api-dokumentasjon/api/utleggstrekkfrakommune
    keywords: [utleggstrekk, kommune, særnamsmyndighet, innkreving]
    tags: [agreement, maskinporten]
    caveats:
      - "Dokumentasjonen oppgir ennå ikke ressurs-id for systembruker (står som TIL AVKLARING)."

  - id: skatteetaten-trekkpaalegg
    title: Trekkpålegg API
    description: >-
      Grensesnitt der lønns- og personalsystemer henter trekkpålegg om utleggstrekk i lønn fra Skatteetaten på
      vegne av trekkpliktige arbeidsgivere. Krever Maskinporten med scope `skatteetaten:trekkpaalegg` og
      systembruker med ressurs `ske-informasjon-om-trekkpaalegg`. Arbeidsgiver kan fortsatt hente de samme
      trekkpåleggene fra Altinn-innboksen.
    category: skatt-og-avgift
    access: restricted
    auth: maskinporten
    formats: [JSON]
    endpoints:
      - https://api.skatteetaten.no/api/trekkpaalegg/v1
    spec_url: https://api.swaggerhub.com/apis/skatteetaten/trekkpaalegg-app/1.5.2
    docs_url: https://skatteetaten.github.io/api-dokumentasjon/api/trekkpaalegg
    keywords: [trekkpålegg, utleggstrekk, lønn, arbeidsgiver]
    tags: [agreement, maskinporten, personal-data]
    caveats:
      - "Grensesnittet tilbys først i test og piloter, og supplerer det eksisterende grensesnittet for trekkformidling."

  - id: skatteetaten-skatt-dialogdokumenter
    title: Skatt dialogdokumenter API
    description: >-
      Henter dokumenter som Skatteetaten legger ved dialoger i Dialogporten for formues- og inntektsskatt, for
      eksempel skatteoppgjør og brev om skattemeldingen. URL-en til dokumentet står i dialogen og skal ikke
      settes sammen selv. Krever Maskinporten med systembruker og scope `skatteetaten:skattdialogdokument`.
    category: skatt-og-avgift
    access: restricted
    auth: maskinporten
    formats: [JSON]
    endpoints:
      - https://api.skatteetaten.no/api/skatt-dialog-dokumenter/v1
    docs_url: https://skatteetaten.github.io/api-dokumentasjon/api/skattdialogdokumenter
    keywords: [dialogporten, skatteoppgjør, skattemelding, dokumenter]
    tags: [agreement, maskinporten, personal-data]
    caveats:
      - "Scopet `skatteetaten:formueinntekt/skattemelding` gir tilgang i en overgangsperiode."

  - id: skatteetaten-utlegg-dataprodukter
    title: Utlegg dataprodukter API
    description: >-
      Henter fortløpende data og hendelser om utleggsbegjæringssaker og utleggssaker som Namsfogden har
      behandlet i systemet SIRO, med sekvensnummer og paginering. Målgruppen er Namsfogden og Politiet, og
      tilgang søkes hos Skatteetaten etter at bruksvilkår er godtatt. Maskinporten med scope
      `skatteetaten:innkrevingsaksgangan` brukes for saksgang-tjenesten.
    category: skatt-og-avgift
    access: non-public
    auth: maskinporten
    formats: [JSON]
    spec_url: https://api.swaggerhub.com/apis/skatteetaten/dataprodukt-saksgang-siro-api/1.0.11
    docs_url: https://skatteetaten.github.io/api-dokumentasjon/api/utlegg-dataprodukter-namsfogden
    keywords: [utlegg, namsfogden, SIRO, saksgang, politiet]
    tags: [agreement, maskinporten]
    caveats:
      - Scope for tjenesten utlegg for part er ikke bestemt ennå.

  - id: skatteetaten-forsendelse-aapnet
    title: Forsendelse Åpnet API
    description: >-
      Markerer en forsendelse i en Dialogporten-dialog som åpnet, slik at den også regnes som åpnet i Altinn og
      Skatteetatens innboks. Endepunktet står i forsendelsens contentReference, og du skal bare bruke API-et når
      URL-en der peker til tjenesten. Autentisering skjer med et dialogtoken fra Dialogporten, gyldig for én
      dialog.
    category: skatt-og-avgift
    access: restricted
    auth: unknown
    formats: [JSON]
    docs_url: https://skatteetaten.github.io/api-dokumentasjon/api/forsendelseaapnet
    keywords: [dialogporten, forsendelse, åpnet, altinn]
    tags: [agreement]

  - id: skatteetaten-siste-tilgjengelige-skatteoppgjoer
    title: Siste tilgjengelige skatteoppgjør API
    description: >-
      Oppgir siste inntektsår det foreligger skatteoppgjør for en person, oppslått med personidentifikator.
      Støttetjeneste til oppslagstjenestene for skatteoppgjør, og den bruker samme scope som dem
      (`skatteetaten:summertskattegrunnlag` eller `skatteetaten:spesifisertsummertskattegrunnlag`). Skatteetaten
      trenger ikke gi egen tilgang utover den du har til oppslagstjenesten.
    category: skatt-og-avgift
    access: restricted
    auth: maskinporten
    formats: [JSON]
    endpoints:
      - https://sistetilgjengeligeskatteoppgjoer.api.skatteetaten.no/v1
    spec_url: https://api.swaggerhub.com/apis/skatteetaten/siste-tilgjengelige-skatteoppgjoer/1.1.1
    docs_url: https://skatteetaten.github.io/api-dokumentasjon/api/sistetilgjengeligeskatteoppgjoer
    keywords: [skatteoppgjør, inntektsår, skattegrunnlag]
    tags: [agreement, maskinporten, personal-data]
    caveats:
      - "Oppslag skjer på personidentifikator, så virksomheten må ha behandlingsgrunnlag."

  - id: skatteetaten-hendelser
    title: "Hendelseslister (Skatteetatens datatjenester)"
    description: >-
      Tynne hendelseslister som varsler om at data er nye, endret eller slettet for en person eller virksomhet,
      og som du følger med sekvensnummer. Det finnes en liste per datatjeneste, blant andre for inntekt, mva-
      melding, skattemelding, skatteoppgjør, næringsspesifikasjon og utleggstrekk. Listene bruker samme scope
      som den tilhørende oppslagstjenesten, så du trenger ikke egen tilgang. Skatteetaten ber om at du bruker
      listene i stedet for periodiske oppslag.
    category: skatt-og-avgift
    access: restricted
    auth: maskinporten
    formats: [JSON]
    docs_url: https://skatteetaten.github.io/api-dokumentasjon/api/hendelser
    keywords: [hendelser, sekvensnummer, varsling, endringer, feed]
    tags: [agreement, maskinporten, feed]
    caveats:
      - "Det er flere separate API-er, hver med egen spesifikasjon på SwaggerHub og eget vertsnavn (for eksempel inntekthendelser.api.skatteetaten.no)."


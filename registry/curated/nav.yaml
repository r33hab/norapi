      det er ikke dokumentert og kan endres uten varsel.
    owner_terms: >-
      Nav dokumenterer ikke dette endepunktet. For å hente og videredistribuere stillingsannonser peker Nav på det
      dokumenterte stillingsfeedet, som har egne vilkår. Annonsetekster kan inneholde kontaktpersoner.
    quick_start: |
      curl "https://arbeidsplassen.nav.no/stillinger/api/search?q=sykepleier&size=5"

  sector: stat
apis:
  - id: nav-stillingsfeed
    title: Stillingsfeed fra arbeidsplassen.nav.no
    title_en: Job vacancy feed
    description: >-
      Alle stillingsannonser på arbeidsplassen.nav.no som en paginert feed med 1000 oppføringer per side,
      pluss full annonsetekst per oppføring. Et offentlig testtoken hentes fra /api/publicToken; produksjon
      krever eget token tildelt av Nav. Finn.no-annonser er ikke med. Inaktive annonser skal ikke vises videre.
    category: arbeid-og-velferd
    access: open
    auth: api-key
    formats: [JSON]
    endpoints:
      - https://pam-stilling-feed.nav.no/api/v1/feed
    docs_url: https://navikt.github.io/pam-stilling-feed/
    license: Vilkår på https://arbeidsplassen.nav.no/vilkar-api
    keywords: [stillinger, stillingsannonser, ledige stillinger, jobb, rekruttering, arbeidsmarked, job ads, vacancies]
    tags: [starter, feed]
    quick_start: |
      TOKEN=$(curl -s https://pam-stilling-feed.nav.no/api/publicToken | grep -oE '[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}')
      curl -H "Authorization: Bearer $TOKEN" -H "Accept: application/json" \
        -H "If-Modified-Since: $(date -u -v-1d '+%a, %d %b %Y %H:%M:%S GMT')" \
        "https://pam-stilling-feed.nav.no/api/v1/feed"

  - id: nav-grunnbelop
    title: Grunnbeløpet (G)
    title_en: National insurance base amount
    description: >-
      Gjeldende grunnbeløp i folketrygden med månedsbeløp, gjennomsnitt per år og omregningsfaktor, og grunnbeløpet
      som gjaldt på en gitt dato med parameteren dato. Ett lite endepunkt for alt som regner ytelser, pensjon eller
      grenser i G.
    category: arbeid-og-velferd
    access: open
    auth: none
    formats: [JSON]
    endpoints:
      - https://g.nav.no/api/v1/grunnbel%C3%B8p
    docs_url: https://github.com/navikt/g
    keywords: [grunnbeløp, g, folketrygd, pensjon, trygd, ytelse, omregningsfaktor, base amount]
    tags: [no-auth, reference-data]
    quick_start: |
      curl "https://g.nav.no/api/v1/grunnbeløp"
      curl "https://g.nav.no/api/v1/grunnbeløp?dato=2020-06-01"

  - id: nav-hjelpemidler-import-api
    title: Hjelpemiddeldatabasen Import-API (finnhjelpemiddel.nav.no)
    title_en: Assistive devices import API (finnhjelpemiddel.nav.no)
    description: >-
      API for leverandører som laster opp og publiserer hjelpemidler på finnhjelpemiddel.nav.no: produkter, serier,
      tilbehør, reservedeler, bilder og dokumenter, med godkjenningsstatus og HMS-nummer for rammeavtaler. Skriving
      krever hemmelig nøkkel (bearer token) fra Nav. Referansedata som ISO-kategorier svarer uten innlogging.
    category: arbeid-og-velferd
    access: restricted
    auth: api-key
    formats: [JSON]
    endpoints:
      - https://finnhjelpemiddel-api.nav.no/import/api/v1/
    docs_url: https://navikt.github.io/hm-grunndata-import/
    probe_url: https://finnhjelpemiddel-api.nav.no/import/api/v1/isocategories
    keywords: [hjelpemidler, hjelpemiddeldatabasen, finnhjelpemiddel, iso 9999, rammeavtale, hms-nummer, assistive devices]
    tags: [registration]
    caveats:
      - Laget for leverandører som skal publisere produkter; alle skrivekall krever Authorization med bearer-nøkkel.
      - Noen leseendepunkter for referansedata (for eksempel isocategories) svarer anonymt, men er ikke lovet åpne.
      - Ingen lisens oppgitt.
    quick_start: |
      # åpent referansekall
      curl "https://finnhjelpemiddel-api.nav.no/import/api/v1/isocategories"
      # opplasting krever nøkkel
      # curl -X POST -H "Authorization: Bearer $NAV_KEY" -H "Content-Type: application/x-json-stream" \
      #   "https://finnhjelpemiddel-api.nav.no/import/api/v1/products/transfers/"


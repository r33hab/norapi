    title_en: Job ad search on arbeidsplassen.nav.no (the site's search API)
    description: >-
      JSON-endepunktet som stillingssøket på arbeidsplassen.nav.no kaller: fritekstsøk i åpne stillingsannonser og
      svar i Elasticsearch-format med treff, antall og fasetter (fylke, bransje, omfang, ansettelsesform m.m.).
      Fungerer uten nøkkel, men er ikke dokumentert. For videredistribusjon av annonser gjelder Navs vilkår for det
      dokumenterte stillingsfeedet.
    category: arbeid-og-velferd
    access: open
    auth: none
    formats: [JSON]
    endpoints:
      - https://arbeidsplassen.nav.no/stillinger/api/search
    docs_url: https://arbeidsplassen.nav.no/stillinger
    probe_url: https://arbeidsplassen.nav.no/stillinger/api/search?q=sykepleier&size=1
    keywords: [stillinger, stillingsannonser, ledige stillinger, jobbsøk, arbeidsmarked, elasticsearch, job search]
    tags: [no-auth, undocumented]
    caveats:
      - Ikke dokumentert av eieren, og kan endres uten forvarsel.
      - Annonsetekster kan inneholde kontaktpersoner; bruk dem bare til det de er publisert for.

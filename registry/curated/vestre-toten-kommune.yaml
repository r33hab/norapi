updated: 2026-11-16
provider:
  name: Vestre Toten kommune
  orgnr: "971028300"
  sector: kommune
apis:
  - id: vestre-toten-kommune-agol
    title: Vestre Toten kommunes kartdata på ArcGIS Online (REST)
    title_en: Vestre Toten municipality map data on ArcGIS Online (REST)
    description: >-
      Vestre Toten kommunes åpne tjenestekatalog på ArcGIS Online med 147 publiserte tjenester, blant annet kommuneplan, reguleringsplaner, veger, stier og trafikktellinger. Hvert lag kan spørres med /query og gir JSON eller GeoJSON, uten nøkkel. Mange lag er tomme maler eller arbeidslag, så sjekk antall objekter før du bruker et lag.
    category: kart-og-geodata
    access: open
    auth: none
    formats: [JSON, GeoJSON]
    endpoints:
      - https://services-eu1.arcgis.com/DXXr4lb5mZYaElUa/arcgis/rest/services
    docs_url: https://services-eu1.arcgis.com/DXXr4lb5mZYaElUa/arcgis/rest/services
    probe_url: https://services-eu1.arcgis.com/DXXr4lb5mZYaElUa/arcgis/rest/services?f=json
    keywords: [vestre-toten, kommune, kart, arcgis, arcgis online, kartlag, gis, geodata, feature service]
    tags: [no-auth]
    caveats:
      - Ingen lisens oppgitt.
      - Laglisten er kommunens arbeidskart og endres uten varsel.
    quick_start: |
      # tjenestene i organisasjonens katalog
      curl "https://services-eu1.arcgis.com/DXXr4lb5mZYaElUa/arcgis/rest/services?f=json"
      # antall objekter i ett lag (kommuneplan)
      curl "https://services-eu1.arcgis.com/DXXr4lb5mZYaElUa/arcgis/rest/services/Kommuneplan/FeatureServer/0/query?where=1%3D1&returnCountOnly=true&f=json"

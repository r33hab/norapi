provider:
  name: Hemsedal kommune
  orgnr: "964952701"
  sector: kommune
apis:
  - id: hemsedal-kommune-agol
    title: Hemsedal kommunes kartdata på ArcGIS Online (REST)
    title_en: Hemsedal municipality map data on ArcGIS Online (REST)
    description: >-
      Hemsedal kommunes åpne tjenestekatalog på ArcGIS Online med sju publiserte tjenester, blant annet lag for landbruk i kommuneplanens arealdel og et prosjektlag. Hvert lag kan spørres med /query og gir JSON eller GeoJSON, uten nøkkel. Katalogen er et lite arbeidsområde, så lag kommer og går.
    category: kart-og-geodata
    access: open
    auth: none
    formats: [JSON, GeoJSON]
    endpoints:
      - https://services-eu1.arcgis.com/y91OdYXqptgOACtV/arcgis/rest/services
    docs_url: https://services-eu1.arcgis.com/y91OdYXqptgOACtV/arcgis/rest/services
    probe_url: https://services-eu1.arcgis.com/y91OdYXqptgOACtV/arcgis/rest/services?f=json
    keywords: [hemsedal, kommune, kart, arcgis, arcgis online, kartlag, gis, geodata, feature service, kommuneplan]
    tags: [no-auth]
    caveats:
      - Ingen lisens oppgitt.
      - Laglisten er kommunens arbeidskart og endres uten varsel.
    quick_start: |
      # tjenestene i organisasjonens katalog
      curl "https://services-eu1.arcgis.com/y91OdYXqptgOACtV/arcgis/rest/services?f=json"
      # antall objekter i prosjektlaget
      curl "https://services-eu1.arcgis.com/y91OdYXqptgOACtV/arcgis/rest/services/Prosjekter_punkt/FeatureServer/0/query?where=1%3D1&returnCountOnly=true&f=json"

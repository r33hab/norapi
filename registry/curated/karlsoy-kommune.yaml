updated: 2026-11-16
provider:
  name: Karlsøy kommune
  sector: kommune
  orgnr: "940330408"
apis:
  - id: karlsoy-kommune-agol
    title: Karlsøy kommunes kartdata på ArcGIS Online (REST)
    title_en: Karlsøy municipality map data on ArcGIS Online (REST)
    description: >-
      Karlsøy kommunes tjenestekatalog på ArcGIS Online, med rundt 60 lag. Innholdet er mest naturkartlegging (myr,
      kelp, verneområder, viltområder, hekkende sjøfugl) pluss kommuneplanens arealformål. Hvert lag kan spørres med
      /query og gir JSON uten nøkkel.
    category: kart-og-geodata
    access: open
    auth: none
    formats: [JSON, GeoJSON]
    endpoints:
      - https://services-eu1.arcgis.com/n6x4811rArpOOeaT/arcgis/rest/services
    docs_url: https://services-eu1.arcgis.com/n6x4811rArpOOeaT/arcgis/rest/services
    probe_url: https://services-eu1.arcgis.com/n6x4811rArpOOeaT/arcgis/rest/services?f=json
    keywords: [kommune, kart, arcgis, arcgis online, kartlag, gis, geodata, feature service, kommuneplan, naturtyper, Karlsøy]
    tags: [no-auth]
    caveats:
      - Ingen lisens oppgitt.
      - Laglisten er kommunens arbeidskart og endres uten varsel.
      - Noen lag er lokale innspill fra innbyggere, så sjekk laget før du bruker det.
    quick_start: |
      # tjenestene i organisasjonens katalog
      curl "https://services-eu1.arcgis.com/n6x4811rArpOOeaT/arcgis/rest/services?f=json"
      # kommuneplanens arealformål, uten geometri
      curl "https://services-eu1.arcgis.com/n6x4811rArpOOeaT/arcgis/rest/services/KpArealform%C3%A5lOmr%C3%A5de_ny/FeatureServer/0/query?where=1%3D1&outFields=OBJTYPE,AREALST&resultRecordCount=1&returnGeometry=false&f=json"

provider:
  name: Troms fylkeskommune
  orgnr: "930068128"
  sector: fylke
apis:
  - id: troms-fylkeskommune-kartserver
    title: Troms fylkeskommunes kartserver (ArcGIS REST)
    title_en: Troms county map server (ArcGIS REST)
    description: >-
      Fylkeskommunens kartlag: basisdata (kommunegrenser, bratthetskart), arealregnskap og arealbruksintensitet,
      inngrepsfrie naturområder (INON) og naturskog. Hvert lag spørres med /query og svarer i JSON eller GeoJSON. Uten
      nøkkel.
    category: kart-og-geodata
    access: open
    auth: none
    formats: [JSON, GeoJSON]
    endpoints:
      - https://gis.tromsfylke.no/arcgis/rest/services
    docs_url: https://gis.tromsfylke.no/arcgis/rest/services
    probe_url: https://gis.tromsfylke.no/arcgis/rest/services?f=json
    keywords: [troms, fylkeskommune, kart, arcgis, arealregnskap, inon, naturskog, kommunegrenser, gis]
    tags: [no-auth]
    caveats:
      - Ingen lisens oppgitt.
      - Testmappene (Test, Test2, Test_print) er arbeidsområder; bygg ikke på dem.
      - Serveren sender ikke mellomsertifikatet (GlobalSign RSA OV SSL CA 2018), så klienter som ikke henter det selv, som Python og Node, avviser TLS-tilkoblingen; curl på macOS og nettlesere svarer.
    quick_start: |
      curl "https://gis.tromsfylke.no/arcgis/rest/services?f=json"
      curl "https://gis.tromsfylke.no/arcgis/rest/services/Basisdata/Kommunegrenser/MapServer/0/query?where=1%3D1&outFields=*&resultRecordCount=1&f=geojson"

  - id: troms-fylkeskommune-arcgis-online
    title: Troms fylkeskommunes kartdata (ArcGIS Online)
    title_en: Troms county map data (ArcGIS Online)
    description: >-
      Troms fylkeskommunes åpne tjenestekatalog på ArcGIS Online med 225 publiserte tjenester, blant annet broer og tunneler på fylkesveg, ferjekaier, driftskontrakter og arealregnskap. Hvert lag kan spørres med /query og gir JSON eller GeoJSON, uten nøkkel. Katalogen er et arbeidsområde, så lag kommer og går og innholdet varierer i kvalitet.
    category: kart-og-geodata
    access: open
    auth: none
    formats: [JSON, GeoJSON]
    endpoints:
      - https://services-eu1.arcgis.com/U1hRksOlPi5uQQht/arcgis/rest/services
    docs_url: https://services-eu1.arcgis.com/U1hRksOlPi5uQQht/arcgis/rest/services
    probe_url: https://services-eu1.arcgis.com/U1hRksOlPi5uQQht/arcgis/rest/services?f=json
    keywords: [troms fylkeskommune, kart, arcgis, arcgis online, kartlag, gis, geodata, feature service]
    tags: [no-auth]
    caveats:
      - Ingen lisens oppgitt.
      - Katalogen er et arbeidsområde der lag kommer og går, og noen lag er under arbeid eller test.
      - Noen lag kan inneholde innspill fra innbyggere, så sjekk laget før du bruker det.
    quick_start: |
      # tjenestene i organisasjonens katalog
      curl "https://services-eu1.arcgis.com/U1hRksOlPi5uQQht/arcgis/rest/services?f=json"
      # antall objekter i ett lag
      curl "https://services-eu1.arcgis.com/U1hRksOlPi5uQQht/arcgis/rest/services/FergekaierTroms/FeatureServer/0/query?where=1%3D1&returnCountOnly=true&f=json"

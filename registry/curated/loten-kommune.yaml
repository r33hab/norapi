updated: 2026-11-16
provider:
  name: Løten kommune
  orgnr: "964950679"
  sector: kommune
apis:
  - id: loten-kommune-agol
    title: Løten kommunes kartdata på ArcGIS Online (REST)
    title_en: Løten municipality map data on ArcGIS Online (REST)
    description: >-
      Løten kommunes åpne tjenestekatalog på ArcGIS Online med 59 publiserte tjenester, blant annet veger, turstier, skolekretser, kommuneplan og reguleringsplaner. Hvert lag kan spørres med /query og gir JSON eller GeoJSON, uten nøkkel. Mange lag er tomme maler eller arbeidslag, så sjekk antall objekter før du bruker et lag.
    category: kart-og-geodata
    access: open
    auth: none
    formats: [JSON, GeoJSON]
    endpoints:
      - https://services-eu1.arcgis.com/355yvIqJ6dNm0GTh/arcgis/rest/services
    docs_url: https://services-eu1.arcgis.com/355yvIqJ6dNm0GTh/arcgis/rest/services
    probe_url: https://services-eu1.arcgis.com/355yvIqJ6dNm0GTh/arcgis/rest/services?f=json
    keywords: [loten, kommune, kart, arcgis, arcgis online, kartlag, gis, geodata, feature service]
    tags: [no-auth]
    caveats:
      - Ingen lisens oppgitt.
      - Laglisten er kommunens arbeidskart og endres uten varsel.
    quick_start: |
      # tjenestene i organisasjonens katalog
      curl "https://services-eu1.arcgis.com/355yvIqJ6dNm0GTh/arcgis/rest/services?f=json"
      # antall objekter i ett lag (veger)
      curl "https://services-eu1.arcgis.com/355yvIqJ6dNm0GTh/arcgis/rest/services/Veger_WFL1/FeatureServer/0/query?where=1%3D1&returnCountOnly=true&f=json"

provider:
  name: Helsedirektoratet
  orgnr: "983544622"
  sector: stat
apis:
  - id: helsedirektoratet-apne-data
    title: Helsedirektoratets åpne data (HAPI)
    description: >-
      Innholdet på helsedirektoratet.no som data: nasjonale faglige retningslinjer, pakkeforløp, rundskriv,
      tilskudd og nyheter, pluss nasjonale kvalitetsindikatorer og legemiddeldata som ATC-registeret. Leveres som
      JSON, Markdown og HTML under NLOD, med krav om kildehenvisning og om at faglig innhold ikke endres.
    category: arbeid-og-velferd
    access: open
    auth: none
    formats: [JSON, Markdown, HTML]
    endpoints:
      - https://utvikler.helsedirektoratet.no/
    docs_url: https://www.helsedirektoratet.no/om-oss/apne-data-api/om-api-tjenesten
    license: NLOD 2.0
    keywords: [retningslinjer, pakkeforløp, kvalitetsindikatorer, atc, legemidler, helse, rundskriv]
    tags: [no-auth]

  - id: helsedata-katalog
    title: Helsedata.no katalog-API (helseregistre og variabler)
    title_en: Helsedata.no catalogue API (health registers and variables)
    description: >-
      JSON-tjenesten bak helsedata.no: katalogen over helseregistre og datakilder (rundt 100) og nesten 48 000
      variabelbeskrivelser med navn, beskrivelse, tema, register, identifiserbarhet og gyldighet. Bare metadata; tilgang
      til selve dataene søkes om hos Helsedataservice. Ikke dokumentert.
    category: arbeid-og-velferd
    access: open
    auth: none
    formats: [JSON]
    endpoints:
      - https://helsedata.no/api/1.0/
    docs_url: https://helsedata.no/no/datakilder/
    probe_url: https://helsedata.no/api/1.0/healthregister/SearchResult?page=1&sort=0&lang=no
    keywords: [helseregister, helsedata, variabler, metadata, forskning, helsedataservice, health registries]
    tags: [no-auth, undocumented, reference-data]
    caveats:
      - Ikke dokumentert; tjenesten bak helsedata.no kan endres uten forvarsel.
      - Bare metadata; selve helsedataene krever søknad.
    quick_start: |
      curl "https://helsedata.no/api/1.0/healthregister/SearchResult?page=1&sort=0&lang=no"

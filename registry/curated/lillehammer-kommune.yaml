updated: 2026-11-16
provider:
  name: Lillehammer kommune
  sector: kommune
apis:
  - id: lillehammer-kommune-agol
    title: Lillehammer kommunes kartdata på ArcGIS Online (REST)
    title_en: Lillehammer municipality map data on ArcGIS Online (REST)
    description: >-
      Lillehammer kommunes åpne tjenestekatalog på ArcGIS Online, med omtrent 257 publiserte kartlag, blant annet kommunegrense, badeplasser, grunnkretser med folketall, barnehageadresser og eiendomsgrenser. Hvert lag
      kan spørres med /query og gir JSON eller GeoJSON, uten nøkkel. Katalogen er kommunens arbeidsområde, så lag
      kommer og går og innholdet varierer i kvalitet.
    category: kart-og-geodata
    access: open
    auth: none
    formats: [JSON, GeoJSON]
    endpoints:
      - https://services6.arcgis.com/giKuZ2uywMLJfvgY/arcgis/rest/services
    docs_url: https://services6.arcgis.com/giKuZ2uywMLJfvgY/arcgis/rest/services
    probe_url: https://services6.arcgis.com/giKuZ2uywMLJfvgY/arcgis/rest/services?f=json
    keywords: [kommune, kart, arcgis, arcgis online, kartlag, gis, geodata, feature service]
    tags: [no-auth]
    caveats:
      - Ingen lisens oppgitt.
      - Laglisten er kommunens arbeidskart og endres uten varsel; noen lag er under arbeid eller test.
      - Noen lag kan inneholde innspill fra innbyggere eller andre persondata, så sjekk laget før du bruker det.
    quick_start: |
      # tjenestene i organisasjonens katalog
      curl "https://services6.arcgis.com/giKuZ2uywMLJfvgY/arcgis/rest/services?f=json"
      # fem objekter fra ett lag, som GeoJSON
      curl "https://services6.arcgis.com/giKuZ2uywMLJfvgY/arcgis/rest/services/Kommunegrense/FeatureServer/0/query?where=1%3D1&outFields=*&resultRecordCount=5&f=geojson"

updated: 2026-11-16
provider:
  name: Meteorologisk institutt
  orgnr: "971274042"
  sector: stat
apis:
  - id: met-locationforecast
    title: Locationforecast 2.0 (værvarsel)
    title_en: Locationforecast 2.0 (weather forecast)
    description: >-
      Værvarsel for et koordinat, time for time i opptil ti dager: temperatur, nedbør, vind, symbol.
      Dataene bak Yr. Krever en identifiserende User-Agent, ellers ingen nøkkel. Respekter
      Expires-headeren og cache svarene.
    category: vaer-og-klima
    access: open
    auth: none
    formats: [JSON]
    endpoints:
      - https://api.met.no/weatherapi/locationforecast/2.0/
    docs_url: https://api.met.no/weatherapi/locationforecast/2.0/documentation
    license: CC BY 4.0
    keywords: [vær, værvarsel, temperatur, nedbør, vind, yr, weather, forecast]
    tags: [starter, no-auth]
    quick_start: |
      curl -H "User-Agent: norapi-demo/0.1 github.com/r33hAB/norapi" \
        "https://api.met.no/weatherapi/locationforecast/2.0/compact?lat=59.91&lon=10.75"

  - id: met-weatherapi
    title: MET Weather API (alle produkter)
    description: >-
      Samleportalen for MET sine API-produkter: Locationforecast, Nowcast (nedbør neste to timer),
      Oceanforecast, Sunrise, MetAlerts (farevarsler), Airqualityforecast og flere. Samme vilkår og
      User-Agent-krav for alle.
    category: vaer-og-klima
    access: open
    auth: none
    formats: [JSON, XML]
    endpoints:
      - https://api.met.no/
    docs_url: https://api.met.no/
    license: CC BY 4.0
    keywords: [farevarsel, nowcast, soloppgang, luftkvalitet, bølger, havvarsel, metalerts]
    tags: [no-auth]

  - id: met-frost
    title: Frost API (observasjoner og klimadata)
    description: >-
      Historiske værobservasjoner fra MET sine målestasjoner: temperatur, nedbør, vind og snø tilbake til
      1800-tallet, pluss klimanormaler. Gratis klient-id ved registrering.
    category: vaer-og-klima
    access: open
    auth: api-key
    formats: [JSON, CSV]
    endpoints:
      - https://frost.met.no/
    docs_url: https://frost.met.no/index.html
    license: CC BY 4.0
    keywords: [observasjoner, klima, målestasjon, historisk vær, nedbør, temperatur, climate]
    tags: [registration]

  - id: yr-api-v0
    title: Yr.no sitt interne API (badetemperaturer, varsel, stedssøk)
    title_en: Yr.no internal API (bathing temperatures, forecasts, place search)
    description: >-
      JSON-endepunktene yr.no selv bruker: badetemperaturer fra rundt 200 badeplasser, stedssøk, varsel for et sted, varsel
      for neste time og sol- og månetider. Badetemperaturene finnes ikke i de dokumenterte API-ene på api.met.no. Ikke
      dokumentert eller støttet, og vilkårene for api.met.no gjelder ikke nødvendigvis her; bruk api.met.no for varsler.
    category: vaer-og-klima
    access: open
    auth: none
    formats: [JSON]
    endpoints:
      - https://www.yr.no/api/v0/
    docs_url: https://www.yr.no/
    probe_url: https://www.yr.no/api/v0/regions/NO/watertemperatures
    keywords: [yr, badetemperatur, badevann, vær, værvarsel, stedssøk, bathing water]
    tags: [no-auth, undocumented]
    caveats:
      - Yr.no sitt interne API, ikke dokumentert eller støttet, og kan endres uten forvarsel.
      - yr.no sin robots.txt sperrer KI-crawlere; bruk api.met.no til varsler og følg METs vilkår.
    quick_start: |
      curl "https://www.yr.no/api/v0/regions/NO/watertemperatures"

  - id: met-havvarsel-frost
    title: Havvarsel-Frost (badevann og havobservasjoner)
    title_en: Havvarsel-Frost (bathing water and ocean observations)
    description: >-
      METs Frost-tjeneste for havobservasjoner, blant annet badevannstemperaturer fra bøyer og badeplasser med posisjon og
      kilde. API-et svarer uten nøkkel; dokumentasjon og bruksvilkår ligger på samme adresse.
    category: vaer-og-klima
    access: open
    auth: none
    formats: [JSON]
    endpoints:
      - https://havvarsel-frost.met.no/api/v1/obs/badevann/get
    docs_url: https://havvarsel-frost.met.no/docs/starthere
    keywords: [badetemperatur, badevann, sjøtemperatur, havtemperatur, bøye, frost, met, sea temperature]
    tags: [no-auth]
    caveats:
      - TLS-sertifikatet utløp 20. oktober 2026, så kall feiler med sertifikatfeil til MET fornyer det; ikke slå av sertifikatsjekken.
      - MET kaller tjenesten «work in progress» og garanterer ikke at den alltid oppfører seg som dokumentert.
    quick_start: |
      curl "https://havvarsel-frost.met.no/api/v1/obs/badevann/get"

  - id: met-senda-csw
    title: S-ENDA metadatakatalog (CSW)
    title_en: S-ENDA metadata catalogue (CSW)
    description: >-
      OGC CSW-katalog (pycsw) med metadata om norske meteorologiske, hav- og klimadatasett fra MET og partnere, i
      ISO 19115- og Dublin Core-format. Åpen uten innlogging; brukes til å finne datasett og lenker til
      nedlastings- og visningstjenester.
    category: vaer-og-klima
    access: open
    auth: none
    formats: [XML]
    endpoints:
      - https://csw.s-enda.k8s.met.no/
    docs_url: https://csw.s-enda.k8s.met.no/?service=CSW&version=2.0.2&request=GetCapabilities
    probe_url: https://csw.s-enda.k8s.met.no/?service=CSW&version=2.0.2&request=GetCapabilities
    keywords: [csw, metadata, katalog, s-enda, iso 19115, meteorologi, datasett, pycsw]
    tags: [no-auth, reference-data]
    caveats:
      - Ingen lisens oppgitt for selve katalogen.
    quick_start: |
      curl "https://csw.s-enda.k8s.met.no/?service=CSW&version=2.0.2&request=GetCapabilities"

  - id: met-nbs-satellittdata-csw
    title: Nasjonalt bakkesegment for satellittdata (CSW-katalog)
    title_en: Norwegian National Ground Segment for Satellite Data (CSW catalogue)
    description: >-
      OGC CSW 2.0.2 og 3.0.0-katalog over Sentinel-data i det norske nasjonale bakkesegmentet, drevet av MET. Gir
      metadata og nedlastingslenker for satellittscener over norske områder. Katalogen er åpen, men selve
      dataproduktene kan kreve innlogging hos bakkesegmentet.
    category: kart-og-geodata
    access: open
    auth: none
    formats: [XML]
    endpoints:
      - https://nbs.csw.met.no/
    docs_url: https://www.satellittdata.no/
    probe_url: https://nbs.csw.met.no/?service=CSW&version=2.0.2&request=GetCapabilities
    keywords: [satellitt, sentinel, csw, metadata, jordobservasjon, bakkesegment, copernicus, earth observation]
    tags: [no-auth, reference-data]
    caveats:
      - Nedlasting av selve dataproduktene kan kreve innlogging.
      - Ingen lisens oppgitt for selve katalogen.
    quick_start: |
      curl "https://nbs.csw.met.no/?service=CSW&version=2.0.2&request=GetCapabilities"

  - id: met-nbs-stac-test
    title: Nasjonalt bakkesegment for satellittdata (STAC, testtjeneste)
    title_en: Norwegian National Ground Segment for Satellite Data (STAC, test service)
    description: >-
      STAC 1.0.0 og OGC API Records (OARec) på pycsw for Sentinel-scener i det norske bakkesegmentet, i tillegg til
      CSW, OpenSearch og OAI-PMH. Testtjeneste med bare de siste ukene av Sentinel-data fra 2026, og uten garanti
      for tilgjengelighet. En STAC-nettleser finnes på stac-browser.wps.met.no.
    category: kart-og-geodata
    access: open
    auth: none
    formats: [JSON]
    endpoints:
      - https://test-nbs.csw.met.no/stac
    docs_url: https://www.satellittdata.no/en/node/1157
    spec_url: https://test-nbs.csw.met.no/openapi?f=json
    probe_url: https://test-nbs.csw.met.no/stac
    keywords: [stac, satellitt, sentinel, ogc api records, jordobservasjon, bakkesegment, earth observation]
    tags: [no-auth]
    caveats:
      - Testtjeneste uten leveringsgaranti; ikke hele katalogen.
      - Eldre dataprodukter kan ha utdaterte nedlastingslenker.
      - Ingen lisens oppgitt.
    quick_start: |
      curl "https://test-nbs.csw.met.no/stac/search?limit=1"

provider:
  name: NILU
  orgnr: "941705561"
  sector: privat
apis:
  - id: nilu-api
    title: NILU luftkvalitets-API
    title_en: NILU air quality API
    description: >-
      NILUs API for luftkvalitetsmålinger fra målestasjonene i Norge, med siste målinger og historikk per stasjon og
      komponent. Dokumentasjonen ligger fortsatt åpent på api.nilu.no, men datakallene krever nå innlogging.
    category: natur-og-miljo
    access: restricted
    auth: unknown
    formats: [JSON]
    endpoints:
      - https://api.nilu.no/aq/utd
    docs_url: https://api.nilu.no/
    keywords: [luftkvalitet, luftforurensning, svevestøv, no2, målestasjon, nilu, air quality]
    tags: [agreement]
    caveats:
      - Datakallene krever brukernavn og passord (HTTP Basic) og svarer 401 uten.
      - Oppslagstjenestene under /lookup er avviklet og svarer 410.
      - Åpne luftmålinger uten innlogging finnes i Miljødirektoratets luftkvalitet-API (miljodir-luftkvalitet).

  - id: nilu-thredds
    title: NILU THREDDS (EBAS, ACTRIS og FLEXPART)
    title_en: NILU THREDDS (EBAS, ACTRIS and FLEXPART)
    description: >-
      THREDDS-server hos NILU med atmosfæredata i NetCDF: EBAS-målinger av luft og nedbør fra stasjoner i Europa og
      Arktis, ACTRIS-data i nær sanntid og FLEXPART-spredningsberegninger. Katalogen er åpen, og filene kan hentes
      over OPeNDAP eller HTTP uten nøkkel. Katalogen Protected krever tilgang.
    category: natur-og-miljo
    access: open
    auth: none
    formats: [XML, NetCDF]
    endpoints:
      - https://thredds.nilu.no/thredds/
    docs_url: https://ebas-data.nilu.no/
    probe_url: https://thredds.nilu.no/thredds/catalog/catalog.xml
    keywords: [nilu, ebas, actris, flexpart, thredds, opendap, atmosfære, luftkjemi, netcdf, air quality]
    tags: [no-auth]
    caveats:
      - Ingen lisens oppgitt.
      - Katalogen Protected er ikke åpen.
      - Datasettene er ikke bare fra Norge, EBAS dekker stasjoner i hele Europa og Arktis.
    quick_start: |
      curl "https://thredds.nilu.no/thredds/catalog/catalog.xml"

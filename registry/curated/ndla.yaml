provider:
  # NDLA er et fylkeskommunalt samarbeid med Vestland som vertsfylke; katalogen fører
  # API-ene under Vestland fylkeskommunes organisasjonsnummer.
  name: NDLA (Vestland fylkeskommune)
  orgnr: "821311632"
  sector: fylke
apis:
  - id: ndla-search-api
    title: NDLA søk (search-api)
    title_en: NDLA search API
    description: >-
      Felles søk i alt NDLA har publisert for videregående skole: fagartikler, læringsstier, bilder og lyd, med
      filtre for fag, ressurstype og språk. Det enkleste stedet å begynne i NDLAs API-er. Åpent for lesing, uten
      nøkkel; lisensen står per ressurs i metadataene, oftest Creative Commons.
    category: kultur-og-kunnskap
    access: open
    auth: none
    formats: [JSON]
    endpoints:
      - https://api.ndla.no/search-api/v1/search
    docs_url: https://api.ndla.no/
    license: Per ressurs, oftest CC BY-SA 4.0
    spec_url: https://api.ndla.no/search-api/api-docs
    probe_url: https://api.ndla.no/search-api/v1/search?query=fotosyntese&page-size=1
    merge_with: https://dataservice-catalog.fellesdatakatalog.digdir.no/data-services/5f461df34e59ff37b6caea10
    keywords: [ndla, læremidler, videregående, skole, søk, fag, læringsressurser, learning resources]
    tags: [no-auth, starter]
    caveats:
      - Lisensen gjelder per ressurs og står i metadataene; noe innhold har strengere vilkår enn CC BY-SA.
      - Kladd-API-et (draft-api) og Min NDLA krever innlogging og er ikke åpne.
    quick_start: |
      curl "https://api.ndla.no/search-api/v1/search?query=fotosyntese&page-size=3"

  - id: ndla-article-api
    title: NDLA fagartikler (article-api)
    title_en: NDLA article API
    description: >-
      Fagartiklene på ndla.no med innhold, ingress, metadata, lisens og revisjonshistorikk. Søk med tekst eller tagger,
      eller hent en artikkel på id. Uten nøkkel.
    category: kultur-og-kunnskap
    access: open
    auth: none
    formats: [JSON, RSS]
    endpoints:
      - https://api.ndla.no/article-api/v2/articles
    docs_url: https://api.ndla.no/
    license: Per ressurs, oftest CC BY-SA 4.0
    spec_url: https://api.ndla.no/article-api/api-docs
    probe_url: https://api.ndla.no/article-api/v2/articles?query=fotosyntese&page-size=1
    merge_with: https://dataservice-catalog.fellesdatakatalog.digdir.no/data-services/5f461df34e59ff37b6caea1f
    keywords: [ndla, fagartikkel, artikkel, læremidler, videregående, article]
    tags: [no-auth]
    caveats:
      - Lisensen gjelder per artikkel og står i feltet copyright.license.
    quick_start: |
      curl "https://api.ndla.no/article-api/v2/articles?query=fotosyntese&page-size=3"

  - id: ndla-image-api
    title: NDLA bilder (image-api)

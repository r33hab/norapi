    description: >-
      Bildene som brukes på NDLA, med bildetekst, alt-tekst, opphavsperson og lisens per bilde, og URL til bildefilen.
      Søk med tekst eller tagger. Uten nøkkel.
    category: kultur-og-kunnskap
    access: open
    auth: none
    formats: [JSON]
    endpoints:
      - https://api.ndla.no/image-api/v3/images
    docs_url: https://api.ndla.no/
    license: Per ressurs, oftest CC BY-SA 4.0
    spec_url: https://api.ndla.no/image-api/api-docs
    probe_url: https://api.ndla.no/image-api/v3/images?query=fjord&page-size=1
    merge_with: https://dataservice-catalog.fellesdatakatalog.digdir.no/data-services/5f461df34e59ff37b6caea1c
    keywords: [ndla, bilder, bildearkiv, illustrasjon, lisens, images]
    tags: [no-auth]
    caveats:
      - Lisensen varierer per bilde (fra fri bruk til CC BY-NC); sjekk copyright.license før bruk.
    quick_start: |
      curl "https://api.ndla.no/image-api/v3/images?query=fjord&page-size=3"


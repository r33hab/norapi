  - id: ndla-taxonomy
    title: NDLA fagstruktur (taxonomy)
    title_en: NDLA subject taxonomy API
    description: >-
      Strukturen som binder NDLA sammen: fag, emner og ressurser som noder med koblinger, og læreplankoblinger. Bruk
      den for å finne alt innhold i et fag, eller for å bygge navigasjon. Uten nøkkel.
    category: kultur-og-kunnskap
    access: open
    auth: none
    formats: [JSON]
    endpoints:
      - https://api.ndla.no/taxonomy/v1/nodes
    docs_url: https://api.ndla.no/
    license: Per ressurs, oftest CC BY-SA 4.0
    spec_url: https://api.ndla.no/taxonomy/api-docs
    probe_url: https://api.ndla.no/taxonomy/v1/nodes?nodeType=SUBJECT&language=nb
    keywords: [ndla, fag, emne, taksonomi, fagstruktur, læreplan, taxonomy, subjects]
    tags: [no-auth, reference-data]
    quick_start: |
      # alle fagene på NDLA
      curl "https://api.ndla.no/taxonomy/v1/nodes?nodeType=SUBJECT&language=nb"


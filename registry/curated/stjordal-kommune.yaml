provider:
  name: Stjørdal kommune
  orgnr: "939958851"
  sector: kommune
apis:
  - id: stjordal-kommune-agol
    title: Stjørdal kommunes kartdata på ArcGIS Online (REST)
    title_en: Stjørdal municipality map data on ArcGIS Online (REST)
    description: >-
      Stjørdal kommunes åpne tjenestekatalog på ArcGIS Online med 61 publiserte tjenester, blant annet skolekretser, skoler og barnehager, gang- og sykkelveger og plankart. Hvert lag kan spørres med /query og gir JSON eller GeoJSON, uten nøkkel. Katalogen er et arbeidsområde, så lag kommer og går og innholdet varierer i kvalitet.
    category: kart-og-geodata
    access: open
    auth: none
    formats: [JSON, GeoJSON]
    endpoints:
      - https://services-eu1.arcgis.com/WoQ61W4Nf8FizgpG/arcgis/rest/services
    docs_url: https://services-eu1.arcgis.com/WoQ61W4Nf8FizgpG/arcgis/rest/services
    probe_url: https://services-eu1.arcgis.com/WoQ61W4Nf8FizgpG/arcgis/rest/services?f=json
    keywords: [stjørdal, kommune, kart, arcgis, arcgis online, kartlag, gis, geodata, feature service]
    tags: [no-auth]
    caveats:
      - Ingen lisens oppgitt.
      - Katalogen er et arbeidsområde der lag kommer og går, og noen lag er under arbeid eller test.
      - Noen lag kan inneholde innspill fra innbyggere, så sjekk laget før du bruker det.
    quick_start: |
      # tjenestene i organisasjonens katalog
      curl "https://services-eu1.arcgis.com/WoQ61W4Nf8FizgpG/arcgis/rest/services?f=json"
      # antall objekter i ett lag
      curl "https://services-eu1.arcgis.com/WoQ61W4Nf8FizgpG/arcgis/rest/services/Skolekretser/FeatureServer/0/query?where=1%3D1&returnCountOnly=true&f=json"

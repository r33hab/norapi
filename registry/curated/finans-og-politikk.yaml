updated: 2026-10-21
provider:
  name: Norges Bank
  orgnr: "937884117"
  sector: stat
apis:
  - id: norges-bank-open-data
    title: Norges Bank åpne data (valutakurser og renter)
    description: >-
      Daglige valutakurser, styringsrente, statsobligasjoner og andre tidsserier som SDMX-REST:
      velg datasett, nøkkel og periode i URL-en, få JSON eller CSV.
    category: finans
    access: open
    auth: none
    formats: [JSON, CSV, XML]
    endpoints:
      - https://data.norges-bank.no/api/data/
    docs_url: https://www.norges-bank.no/en/topics/Statistics/open-data/
    probe_url: https://data.norges-bank.no/api/data/EXR/B.USD.NOK.SP?format=sdmx-json&lastNObservations=1
    license: NLOD 2.0
    keywords: [valutakurs, valuta, rente, styringsrente, eur, usd, sdmx, exchange rate]
    tags: [starter, no-auth]
    quick_start: |
      curl "https://data.norges-bank.no/api/data/EXR/B.USD.NOK.SP?format=sdmx-json&lastNObservations=1"

  - id: nbim-investeringer
    title: Oljefondets investeringer (NBIM, JSON)
    title_en: Government Pension Fund Global holdings (NBIM)
    description: >-
      Hele aksjebeholdningen til Statens pensjonsfond utland per rapporteringsperiode, rundt 8 900 selskaper med land,
      markedsverdi i kroner og dollar, eierandel og stemmeandel. init.json lister periodene og filnavnene (helår og
      halvår); hver periodefil er rundt 1,5 MB. Dataene bak «Alle investeringer» på nbim.no, ikke dokumentert som API.
    category: finans
    access: open
    auth: none
    formats: [JSON]
    endpoints:
      - https://www.nbim.no/api/investments/v2/
    docs_url: https://www.nbim.no/en/investments/all-investments/
    probe_url: https://www.nbim.no/api/investments/v2/init.json
    keywords: [oljefondet, nbim, pensjonsfond, investeringer, aksjer, eierandel, sovereign wealth fund]
    tags: [no-auth, undocumented]
    caveats:
      - Ikke dokumentert som API; filnavn og felter kan endres.
      - Søkekallet (/search/) svarer med 500; bruk periodefilene.
      - Ingen lisens oppgitt.
    quick_start: |
      curl "https://www.nbim.no/api/investments/v2/init.json"
      curl "https://www.nbim.no/api/investments/v2/2025-12-31.json"

  - id: nbim-fondets-verdi
    title: Oljefondets markedsverdi i sanntid (NBIM)
    title_en: Government Pension Fund Global live market value
    description: >-
      Fondets markedsverdi slik telleren på nbim.no viser den: en kort tidsserie med verdien i kroner, ett punkt per
      sekund. Nøkkelen i adressen er en fast verdi fra nettsiden, så kallet virker uten innlogging, men den kan byttes ut.
    category: finans
    access: open
    auth: none
    formats: [JSON]
    endpoints:
      - https://www.nbim.no/LiveNavHandler/Current.ashx
    docs_url: https://www.nbim.no/en/investments/the-funds-value/
    keywords: [oljefondet, nbim, markedsverdi, fondets verdi, sanntid, fund value]
    tags: [no-auth, undocumented]
    caveats:
      - Ikke dokumentert; nøkkelen i adressen er en fast verdi fra nettsiden og kan byttes ut.
      - Ingen lisens oppgitt.
    quick_start: |
      curl "https://www.nbim.no/LiveNavHandler/Current.ashx?l=en&PreviousNavValue=0&key=263c30dd-d5ba-41d6-a9b1-c1fb59cf30da"

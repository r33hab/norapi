  sector: kommune
apis:
  - id: selbu-kommune-agol
    title: Selbu kommunes kartdata på ArcGIS Online (REST)
    title_en: Selbu municipality map data on ArcGIS Online (REST)
    description: >-
      Selbu kommunes åpne tjenestekatalog på ArcGIS Online med 30 publiserte tjenester, blant annet VA-planer, kommuneplan, vindturbiner og plandatabaser. Hvert lag kan spørres med /query og gir JSON eller GeoJSON, uten nøkkel. Katalogen er et arbeidsområde, så lag kommer og går og innholdet varierer i kvalitet.
    category: kart-og-geodata
    access: open
    auth: none
    formats: [JSON, GeoJSON]
    endpoints:
      - https://services-eu1.arcgis.com/lyBESrfw0Heu55TX/arcgis/rest/services
    docs_url: https://services-eu1.arcgis.com/lyBESrfw0Heu55TX/arcgis/rest/services
    probe_url: https://services-eu1.arcgis.com/lyBESrfw0Heu55TX/arcgis/rest/services?f=json
    keywords: [selbu, kommune, kart, arcgis, arcgis online, kartlag, gis, geodata, feature service]
    tags: [no-auth]
    caveats:
      - Ingen lisens oppgitt.
      - Katalogen er et arbeidsområde der lag kommer og går, og noen lag er under arbeid eller test.
      - Noen lag kan inneholde innspill fra innbyggere, så sjekk laget før du bruker det.
    quick_start: |
      # tjenestene i organisasjonens katalog
      curl "https://services-eu1.arcgis.com/lyBESrfw0Heu55TX/arcgis/rest/services?f=json"
      # antall objekter i ett lag
      curl "https://services-eu1.arcgis.com/lyBESrfw0Heu55TX/arcgis/rest/services/Plandatabase_Nye_Uglan_sondre_hyttefelt_revidert_21c5d32/FeatureServer/0/query?where=1%3D1&returnCountOnly=true&f=json"

  orgnr: "970018131"
  sector: stat
apis:
  - id: udir-grep
    title: Grep (læreplaner og kompetansemål)
    description: >-
      Alle læreplaner i Kunnskapsløftet 2020 som data: fag, kompetansemål, kjerneelementer, tverrfaglige
      temaer og koder (NOR01-06 og lignende). REST med JSON eller XML, pluss et SPARQL-endepunkt. Oppdateres
      nattlig. Ingen nøkkel, NLOD-lisens.
    category: kultur-og-kunnskap
    access: open
    auth: none
    formats: [JSON, XML, RDF]
    endpoints:
      - https://data.udir.no/kl06/v201906/
    docs_url: https://data.udir.no/kl06
    probe_url: https://data.udir.no/kl06/v201906/laereplaner-lk20
    license: NLOD 2.0
    keywords: [læreplan, kompetansemål, grep, skole, fag, kunnskapsløftet, lk20, curriculum]
    tags: [no-auth, reference-data]
    quick_start: |
      curl -H "Accept: application/json" "https://data.udir.no/kl06/v201906/laereplaner-lk20"
      curl -H "Accept: application/json" "https://data.udir.no/kl06/v201906/laereplaner-lk20/NOR01-06"

  - id: udir-nsr
    title: Nasjonalt skoleregister (NSR)
    title_en: National School Register
    description: >-
      Alle grunnskoler og videregående skoler med organisasjonsnummer, adresse, koordinat, skolekategori, offentlig
      eller privat, elevtall, antall ansatte og trinn, og endringer etter en gitt dato. Oppslag per kommune, fylke,
      skolekategori, næringskode eller organisasjonsnummer.
    category: offentlig-forvaltning
    access: open
    auth: none
    formats: [JSON]
    endpoints:
      - https://data-nsr.udir.no/v4/enheter
    docs_url: https://data-nsr.udir.no/
    spec_url: https://data-nsr.udir.no/swagger/v4/swagger.json
    probe_url: https://data-nsr.udir.no/v4/enhet/976207815
    merge_with: https://dataservice-catalog.fellesdatakatalog.digdir.no/data-services/657865f762c1e74d12c69262
    license: NLOD 2.0
    keywords: [skole, skoleregister, grunnskole, videregående, elevtall, nsr, school register]
    tags: [no-auth, reference-data]
    quick_start: |
      # alle skoler i Trondheim (kommunenummer 5001)
      curl "https://data-nsr.udir.no/v4/enheter/kommune/5001"


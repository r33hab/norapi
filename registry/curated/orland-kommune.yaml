  sector: kommune
apis:
  - id: orland-kommune-agol
    title: Ørland kommunes kartdata på ArcGIS Online (REST)
    title_en: Ørland municipality map data on ArcGIS Online (REST)
    description: >-
      Ørland kommunes åpne tjenestekatalog på ArcGIS Online med 54 publiserte tjenester, blant annet kartlagte friluftslivsområder, naturtyper, kulturlandskap og dyrkbar jord. Hvert lag kan spørres med /query og gir JSON eller GeoJSON, uten nøkkel. Katalogen er et arbeidsområde, så lag kommer og går og innholdet varierer i kvalitet.
    category: kart-og-geodata
    access: open
    auth: none
    formats: [JSON, GeoJSON]
    endpoints:
      - https://services-eu1.arcgis.com/4q1grBf9brOsQsDZ/arcgis/rest/services
    docs_url: https://services-eu1.arcgis.com/4q1grBf9brOsQsDZ/arcgis/rest/services
    probe_url: https://services-eu1.arcgis.com/4q1grBf9brOsQsDZ/arcgis/rest/services?f=json
    keywords: [ørland, kommune, kart, arcgis, arcgis online, kartlag, gis, geodata, feature service]
    tags: [no-auth]
    caveats:
      - Ingen lisens oppgitt.
      - Katalogen er et arbeidsområde der lag kommer og går, og noen lag er under arbeid eller test.
      - Noen lag kan inneholde innspill fra innbyggere, så sjekk laget før du bruker det.
    quick_start: |
      # tjenestene i organisasjonens katalog
      curl "https://services-eu1.arcgis.com/4q1grBf9brOsQsDZ/arcgis/rest/services?f=json"
      # antall objekter i ett lag
      curl "https://services-eu1.arcgis.com/4q1grBf9brOsQsDZ/arcgis/rest/services/KartlagteFriluftslivsomr_5057_orland_25832_FILEGDB/FeatureServer/0/query?where=1%3D1&returnCountOnly=true&f=json"

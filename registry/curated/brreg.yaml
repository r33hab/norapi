provider:
  name: Brønnøysundregistrene
  orgnr: "974760673"
  sector: stat
apis:
  - id: brreg-enhetsregisteret
    title: Enhetsregisteret API
    title_en: Central Coordinating Register for Legal Entities API
    description: >-
      Oppslag og søk i alle norske enheter og underenheter: organisasjonsnummer, navn, organisasjonsform,
      adresser, næringskoder, antall ansatte, roller og oppdateringer. Ingen autentisering, ingen nøkkel.
      Den vanligste inngangen til norske virksomhetsdata.
    category: bedrift-og-organisasjon
    access: open
    auth: none
    formats: [JSON]
    endpoints:
      - https://data.brreg.no/enhetsregisteret/api
    docs_url: https://data.brreg.no/enhetsregisteret/api/docs/index.html
    license: NLOD 2.0
    keywords: [organisasjonsnummer, enheter, underenheter, roller, bedrift, selskap, firma, orgnr, company register]
    tags: [starter, no-auth, high-volume]
    quick_start: |
      curl "https://data.brreg.no/enhetsregisteret/api/enheter?navn=Digitaliseringsdirektoratet"
      curl "https://data.brreg.no/enhetsregisteret/api/enheter/991825827"

  - id: brreg-regnskapsregisteret
    title: Regnskapsregisteret API
    description: >-
      Siste innsendte årsregnskap per organisasjonsnummer som strukturert JSON: resultat, balanse,
      egenkapital og nøkkelfelt fra regnskapet.
    category: bedrift-og-organisasjon
    access: open
    auth: none
    formats: [JSON]
    endpoints:
      - https://data.brreg.no/regnskapsregisteret/regnskap
    docs_url: https://www.brreg.no/produkter-og-tjenester/apne-data/
    probe_url: https://data.brreg.no/regnskapsregisteret/regnskap/923609016
    license: NLOD 2.0
    keywords: [årsregnskap, regnskap, resultat, balanse, nøkkeltall]
    tags: [no-auth]
    quick_start: |
      # siste årsregnskap for Equinor ASA (404 betyr at enheten ikke har levert regnskap)
      curl "https://data.brreg.no/regnskapsregisteret/regnskap/923609016"

  - id: brreg-frivillighetsregisteret
    title: Frivillighetsregisteret API
    description: >-
      Frivillige organisasjoner registrert i Frivillighetsregisteret, med kategori, grasrotandel og
      kontaktdata, som søkbart JSON-API uten nøkkel.
    category: bedrift-og-organisasjon
    access: open
    auth: none
    formats: [JSON]
    endpoints:
      - https://data.brreg.no/frivillighetsregisteret/api/frivillige-organisasjoner
    docs_url: https://www.brreg.no/produkter-og-tjenester/apne-data/
    license: NLOD 2.0
    keywords: [frivillighet, organisasjoner, lag, foreninger, grasrotandel, idrettslag]
    tags: [no-auth]
    quick_start: |
      curl "https://data.brreg.no/frivillighetsregisteret/api/frivillige-organisasjoner?size=3"

  - id: brreg-kommunalt-rapporteringsregister
    title: Kommunalt rapporteringsregister API
    title_en: Register of municipal reporting obligations API
    description: >-
      Rapporteringspliktene kommuner, fylkeskommuner og deres foretak har overfor staten, som KOSTRA: hjemmel i lov og
      forskrift, formål, rapporteringsområde (barnehage, barnevern, vann og andre), medium og mottaker. Filtrer på
      rapporteringsområde, organisasjonsform og organisasjonsnummer. Åpent, uten nøkkel.
    category: offentlig-forvaltning
    access: open
    auth: none
    formats: [JSON]
    endpoints:
      - https://data.brreg.no/kommunalt-rapporteringsregister/api/
    docs_url: https://data.brreg.no/kommunalt-rapporteringsregister/api/docs/index.html
    probe_url: https://data.brreg.no/kommunalt-rapporteringsregister/api/rapporteringsomraader
    license: NLOD 2.0
    keywords: [kommune, rapportering, rapporteringsplikt, kostra, hjemmel, fylkeskommune, reporting obligations]
    tags: [no-auth, reference-data]
    quick_start: |
      curl "https://data.brreg.no/kommunalt-rapporteringsregister/api/rapporteringsplikter?rapporteringsomraader=BARNEHAGE"

  - id: brreg-oppgaveregisteret
    title: Oppgaveregisteret API (skjema til det offentlige)
    title_en: Register of reporting obligations for businesses API
    description: >-
      Skjemaene og rapportene virksomheter må sende til offentlige etater, over 900 i alt, med skjemaeier, formål,
      vedleggskrav og hvilke organisasjonsformer og næringer de gjelder, pluss kodelister for skjemaeiere og
      næringskoder. Kallene krever Accept: application/json; hele registeret finnes også som én fil (skjema/alle.json).
    category: offentlig-forvaltning
    access: open
    auth: none
    formats: [JSON]
    endpoints:
      - https://data.brreg.no/oppgaveregisteret/api/
    docs_url: https://data.brreg.no/oppgaveregisteret/api/docs/index.html
    probe_url: https://data.brreg.no/oppgaveregisteret/api/skjema/alle.json
    keywords: [skjema, rapportering, oppgaveplikt, oppgavebyrde, offentlige skjema, reporting burden]
    tags: [no-auth, reference-data]
    quick_start: |
      curl -H "Accept: application/json" "https://data.brreg.no/oppgaveregisteret/api/skjema?start=0&antall=2"

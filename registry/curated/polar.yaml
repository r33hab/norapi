apis:
  - id: npolar-api
    title: Norsk Polarinstitutt API
    description: >-
      Datasett, publikasjoner, stedsnavn på Svalbard og i Antarktis, ekspedisjoner og måleserier fra
      polarområdene som JSON.
    category: natur-og-miljo
    access: open
    auth: none
    formats: [JSON]
    endpoints:
      - https://api.npolar.no/placename/
    docs_url: https://github.com/npolar/api.npolar.no
    probe_url: https://api.npolar.no/placename/?q=Longyear
    license: CC BY 4.0
    keywords: [svalbard, antarktis, polar, stedsnavn, ekspedisjon, arktis]
    tags: [no-auth]

  - id: npolar-geodata-arcgis-rest
    title: Norsk Polarinstitutt kartserver (ArcGIS Server REST, Svalbard)
    title_en: Norwegian Polar Institute map server (ArcGIS Server REST, Svalbard)
    description: >-
      ArcGIS Server med kartdata for Svalbard, Jan Mayen og polarområdene: basiskart og flyfoto som WMTS, og
      temalag som sjøfuglkolonier, sjøpattedyr, reinsdyr, vegetasjon, fenologi og geologi. Åpen uten nøkkel, og
      enkelte lag kan spørres som JSON via query.
    category: kart-og-geodata
    access: open
    auth: none
    formats: [JSON, WMS, WMTS]
    endpoints:
      - https://geodata.npolar.no/arcgis/rest/services
    docs_url: https://geodata.npolar.no/arcgis/rest/services
    probe_url: https://geodata.npolar.no/arcgis/rest/services?f=json
    keywords: [svalbard, jan mayen, arcgis, rest, sjøfugl, reinsdyr, vegetasjon, geologi, basiskart, polar]
    tags: [no-auth]
    caveats:
      - Ikke alle MapServer-lag støtter query; sjekk lagets side for støttede operasjoner.
      - Ingen lisens oppgitt på tjenestemappen.
    quick_start: |
      curl "https://geodata.npolar.no/arcgis/rest/services/Temadata?f=json"
      # sjøfuglkolonier på Svalbard (lag 1)
      curl "https://geodata.npolar.no/arcgis/rest/services/Temadata/F_Seabirds_Svalbard/MapServer/1/query?where=1%3D1&outFields=*&resultRecordCount=1&f=json"

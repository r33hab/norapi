    description: >-
      Lar leverandører sette opp protokollsystemer i Fiks IO via API i stedet for webgrensesnittet: opprette og
      slette kontoer, laste opp offentlig nøkkel, sette parter, gi og be om tilganger mellom systemer og søke etter
      systemer og kontoer. Selve protokollsystemet må opprettes av en administrator i kundens Fiks-organisasjon. Auth
      er Maskinporten med scope ks:fiks pluss integrasjons-id og passord, og integrasjonen må ha privilegiet
      FIKS.KONFIGURER.

    docs_url: https://developers.fiks.ks.no/tjenester/dokumentlager/index.html
    keywords: [dokumentlager, dokumenter, opplasting, kommune, fiks, ks, document storage]
    tags: [maskinporten, agreement]
    caveats:
      - Krever avtale med KS og integrasjon opprettet i Fiks Konfigurasjon.
      - Ingen OpenAPI-spesifikasjon funnet; endepunkter er beskrevet i dokumentasjonen.
      - Ingen lisens oppgitt.
    quick_start: |
      curl -X POST -H "Authorization: Bearer $TOKEN" -H "IntegrasjonId: $ID" -H "IntegrasjonPassord: $PASSORD" \
        -F "metadata=@metadata.json;type=application/json" -F "dokument=@fil.pdf" \
        "https://api.fiks.ks.no/dokumentlager/api/v1/{fiksOrganisasjonId}/kontoer/{kontoId}/dokumenter/"

  - id: ks-fiks-protokoll-konfigurasjon

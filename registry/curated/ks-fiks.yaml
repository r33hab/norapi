apis:
  - id: ks-fiks-io
    title: "Fiks IO (sikker meldingsutveksling)"
    title_en: "Fiks IO (secure message exchange)"
    description: >-
      Kø-basert maskin-til-maskin-kanal mellom fagsystemer og organisasjoner, bygget på RabbitMQ med
      ende-til-ende-kryptering og signerte meldinger (ASiC-E). Meldingstypene defineres i Fiks Protokoll, for
      eksempel arkiv, plan og matrikkelføring. Du trenger Maskinporten-scope ks:fiks og en konto i Fiks-plattformen,
      og store filer går via Fiks Dokumentlager (opptil 5 GB). Ingen leveringsgaranti, meldinger har 7 dagers
      levetid som standard.
    category: offentlig-forvaltning
    access: restricted
    auth: maskinporten
    formats: [JSON]
    endpoints:
      - https://api.fiks.ks.no/fiks-io/katalog/api/v1
      - https://api.fiks.test.ks.no/fiks-io/katalog/api/v1
    docs_url: https://developers.fiks.ks.no/tjenester/fiksprotokoll/fiksio/
    spec_url: https://developers.fiks.ks.no/api/fiksio-katalog-api-v1.json
    keywords: [fiks io, rabbitmq, amqp, meldingsutveksling, kommune, fiks protokoll, message queue]
    tags: [maskinporten, agreement]
    caveats:
      - "Krever avtale med KS og tilgang til Fiks-plattformen før du får brukt API-et, og tilgang gis per kommune eller virksomhet."
      - "Selve meldingsutvekslingen går over AMQP (RabbitMQ), ikke HTTP; REST-API-et i spesifikasjonen er katalogen over kontoer."
      - "Ingen lisens oppgitt."
    quick_start: |
      # 1) hent token fra Maskinporten med scope ks:fiks (virksomhetssertifikat)
      # 2) bruk token og integrasjons-id/passord fra Fiks-plattformen på kallene
      curl -H "Authorization: Bearer $MASKINPORTEN_TOKEN" -H "IntegrasjonId: $INTEGRASJON_ID" -H "IntegrasjonPassord: $INTEGRASJON_PASSORD" \
        "https://api.fiks.test.ks.no/fiks-io/katalog/api/v1/kontoer/{kontoId}"
  - id: ks-fiks-svarut
    title: "SvarUt (sending av forsendelser, REST)"
    title_en: "SvarUt (outgoing mail, REST)"
    description: >-
      Sender digital post, Altinn-melding eller fysisk post fra kommuner og andre virksomheter, med egne endepunkter
      per mottakertype (person, virksomhet, Norsk Helsenett, rett til print). Auth er OAuth 2.0 med Fiks-integrasjon
      og Maskinporten. Eldre SOAP-versjoner og REST v1 avvikles i 2027, så bruk v3 for sending.
    category: offentlig-forvaltning
    access: restricted
    auth: maskinporten
    formats: [JSON]
    endpoints:
      - https://svarut.ks.no/api
      - https://test.svarut.ks.no/api
    docs_url: https://developers.fiks.ks.no/tjenester/svarut/rest/
    spec_url: https://developers.fiks.ks.no/api/forsendelse-send-api-v3.json
    keywords: [svarut, forsendelse, digital post, brev, kommune, altinn, fysisk post]
    tags: [maskinporten, agreement]
    caveats:
      - "Krever avtale med KS og tilgang til Fiks-plattformen før du får brukt API-et, og tilgang gis per kommune eller virksomhet."
      - "Ingen lisens oppgitt."
    quick_start: |
      # 1) hent token fra Maskinporten med scope ks:fiks (virksomhetssertifikat)
      # 2) bruk token og integrasjons-id/passord fra Fiks-plattformen på kallene

  - id: ks-fiks-samtykke
    title: Fiks Samtykke (eksternt API)
    title_en: Fiks Consent (external API)
    description: >-
      API for fagsystemer som skal opprette, endre, invalidere og slette samtykker innbyggere tar stilling til i
      Fiks-portalen, og hente samtykkehistorikk. Kallene gjøres på vegne av en Fiks-organisasjon og krever
      Maskinporten/ID-porten-token pluss integrasjons-ID og passord fra Fiks Konfigurasjon. Har OpenAPI-spesifikasjon
      og testmiljø.
    category: offentlig-forvaltning
    access: restricted
    auth: maskinporten
    formats: [JSON]
    endpoints:
      - https://api.fiks.ks.no/samtykke/api/v1/ekstern
    docs_url: https://developers.fiks.ks.no/tjenester/samtykke/index.html
    spec_url: https://developers.fiks.ks.no/api/samtykke-ekstern-api-v1.json
    keywords: [samtykke, innbygger, kommune, fiks, ks, consent, fiksOrgId]
    tags: [maskinporten, agreement]
    caveats:
      - Krever avtale med KS og integrasjon opprettet i Fiks Konfigurasjon.
      - Ingen lisens oppgitt.
    quick_start: |
      curl -H "Authorization: Bearer $TOKEN" -H "IntegrasjonId: $ID" -H "IntegrasjonPassord: $PASSORD" \

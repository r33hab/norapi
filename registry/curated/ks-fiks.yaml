      for eksempel redusert foreldrebetaling i SFO og barnehage, praktisk bistand og langtidsopphold i institusjon.
      Fiks har et eget overbygg som regner sammen poster for flere personer, i tillegg til en proxy mot
      Skatteetatens delingstjeneste. Rollen som brukes må ligge i riktig tjenesteområde, og tilgangen er Maskinporten
      med scope ks:fiks pluss integrasjons-id og passord.

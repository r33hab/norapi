  - id: ks-fiks-svarinn
    title: "SvarInn (mottak av forsendelser, REST)"
    title_en: "SvarInn (incoming mail, REST)"
    description: >-
      Mottakersystemer henter forsendelser fra SvarUt og kvitterer dem ut, slik at sakssystemet kan importere dem
      direkte. Autentisering er HTTP Basic med brukernavn og et generert service-passord fra et mottakersystem som
      KS Digital oppretter. Forsendelsene er kryptert og må dekrypteres med din private nøkkel.
    category: offentlig-forvaltning
    access: restricted
    auth: api-key
    formats: [JSON]
    endpoints:
      - https://svarut.ks.no/api
      - https://test.svarut.ks.no/api
    docs_url: https://developers.fiks.ks.no/tjenester/svarut/svarinn-rest/
    spec_url: https://developers.fiks.ks.no/api/mottakersystem-api-v2.json
    keywords: [svarinn, mottak, sakssystem, svarut, kommune, basic auth]
    tags: [agreement]
    caveats:
      - "Krever avtale med KS og tilgang til Fiks-plattformen før du får brukt API-et, og tilgang gis per kommune eller virksomhet."
      - "Autentisering er HTTP Basic med service-passord, ikke en API-nøkkel i streng forstand."
      - "Ingen lisens oppgitt."
    quick_start: |
      curl -u "$MOTTAKERSYSTEM:$SERVICEPASSORD" "https://test.svarut.ks.no/api/v2/mottakersystem"

provider:
  name: BarentsWatch
  sector: stat
apis:
  - id: barentswatch-ais-live
    title: "AIS Live (sanntids skipstrafikk)"
    title_en: "AIS Live (real-time ship traffic)"
    description: >-
      Åpne AIS-data fra Kystverket for norsk økonomisk sone, Svalbard og Jan Mayen, som posisjoner og
      skipsinformasjon, også som strøm. Fiskefartøy under 15 meter og fritidsbåter under 45 meter er utelatt. Du må
      registrere bruker og API-klient på barentswatch.no og hente token fra id.barentswatch.no.
    category: transport-og-samferdsel
    access: restricted
    auth: oauth2
    formats: [JSON]
    endpoints:
      - https://live.ais.barentswatch.no
    docs_url: https://developer.barentswatch.no/docs/AIS/live-ais-api
    keywords: [ais, skip, fartøy, posisjon, kystverket, sanntid, vessel tracking]
    tags: [oauth2, registration]
    caveats:
      - "Krever bruker på barentswatch.no og en selvregistrert API-klient; tokenet hentes med client credentials."
      - "Åpne data har geografiske og størrelsesmessige begrensninger."
      - "Ingen lisens oppgitt."
    quick_start: |
      # 1) token (klient opprettes under Min side på barentswatch.no)
      curl -s -X POST https://id.barentswatch.no/connect/token -H 'Content-Type: application/x-www-form-urlencoded' \
        --data-urlencode "client_id=$CLIENT_ID" --data-urlencode "client_secret=$CLIENT_SECRET" \
        --data-urlencode "scope=ais" --data-urlencode "grant_type=client_credentials"
      # 2) kall API-et med Authorization: Bearer <token>
      curl -H "Authorization: Bearer $TOKEN" https://live.ais.barentswatch.no/v1/latest/combined
  - id: barentswatch-ais-historic
    title: "AIS Historisk"
    title_en: "AIS Historic"
    description: >-
      Historiske AIS-posisjoner fra de samme åpne Kystverket-dataene som Live-API-et, men med dataene lagret over
      tid. Samme begrensninger på fartøystyper og område gjelder, og dokumentasjonen oppgir at åpne data ikke er
      eldre enn 14 dager. Registrering og token som for øvrige BarentsWatch-API-er.
    category: transport-og-samferdsel
    access: restricted
    auth: oauth2
    formats: [JSON]
    endpoints:
      - https://historic.ais.barentswatch.no
    docs_url: https://developer.barentswatch.no/docs/AIS/historic-ais-api
    keywords: [ais, historiske data, skip, fartøy, kystverket, vessel tracking]
    tags: [oauth2, registration]
    caveats:
      - "Krever bruker på barentswatch.no og en selvregistrert API-klient; tokenet hentes med client credentials."
      - "Dokumentasjonen nevner at åpne data ikke er eldre enn 14 dager; sjekk gjeldende begrensning."
      - "Ingen lisens oppgitt."
    quick_start: |
      # 1) token (klient opprettes under Min side på barentswatch.no)
      curl -s -X POST https://id.barentswatch.no/connect/token -H 'Content-Type: application/x-www-form-urlencoded' \
        --data-urlencode "client_id=$CLIENT_ID" --data-urlencode "client_secret=$CLIENT_SECRET" \
        --data-urlencode "scope=ais" --data-urlencode "grant_type=client_credentials"
      # 2) kall API-et med Authorization: Bearer <token>
      curl -H "Authorization: Bearer $TOKEN" https://historic.ais.barentswatch.no/index.html
  - id: barentswatch-fishhealth
    title: "Fiskehelse API"
    title_en: "Fish Health API"
    description: >-
      Fiskehelsedata for akvakulturlokaliteter: lakselus, sykdommer og tiltak, rapportert til Mattilsynet. Dataene
      er rådata fra oppdrettere og ikke manuelt kontrollert. Det meste er NLOD, men skipsinformasjon under
      v1/shipinfo har kommersiell lisens. Det finnes også WFS og WMS på geoserver.barentswatch.no.
    category: natur-og-miljo
    access: restricted
    auth: oauth2
    formats: [JSON]
    endpoints:
      - https://www.barentswatch.no/bwapi/openapi/index.html?urls.primaryName=Fishhealth%20API
    docs_url: https://developer.barentswatch.no/docs/fishhealth
    license: "NLOD 2.0"
    keywords: [fiskehelse, lakselus, akvakultur, oppdrett, sykdom, mattilsynet, fish health]
    tags: [oauth2, registration]
    caveats:
      - "Krever bruker på barentswatch.no og en selvregistrert API-klient; tokenet hentes med client credentials."
      - "Rådata fra oppdretterne; Mattilsynet er ansvarlig for forvaltningsbruk."
    quick_start: |
      # 1) token (klient opprettes under Min side på barentswatch.no)
      curl -s -X POST https://id.barentswatch.no/connect/token -H 'Content-Type: application/x-www-form-urlencoded' \
        --data-urlencode "client_id=$CLIENT_ID" --data-urlencode "client_secret=$CLIENT_SECRET" \
        --data-urlencode "scope=api" --data-urlencode "grant_type=client_credentials"
      # 2) kall API-et med Authorization: Bearer <token>
      # endepunkter og skjema: se OpenAPI-visningen i endepunktlisten

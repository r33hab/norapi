apis:
  - id: opencom-apne-data-stavangerregionen
    title: Åpne data Stavangerregionen (CKAN-API)
    title_en: Stavanger region open data portal (CKAN API)
    description: >-
      CKAN-portalen opencom.no med rundt 360 datasett, de fleste fra Stavanger kommune, men også fra Gjesdal, Sandefjord,
      Time, Ålesund, Bærum, Trondheim, Kolumbus, Stavangerregionen havn og andre. Standard CKAN-API for søk og metadata,
      og datastore_search for spørringer rett i tabellene der det er slått på. Lisensen står per datasett, nesten alle
      NLOD.
    category: offentlig-forvaltning
    access: open
    auth: none
    formats: [JSON, CSV, GeoJSON, XML]
    endpoints:
      - https://opencom.no/api/3/action/
    docs_url: https://docs.ckan.org/en/2.11/api/
    probe_url: https://opencom.no/api/3/action/status_show
    keywords: [stavanger, kommune, åpne data, ckan, datakatalog, rogaland, open data portal]
    tags: [no-auth]
    quick_start: |
      curl "https://opencom.no/api/3/action/package_search?q=parkering&rows=3"

  - id: stavanger-kommune-agol
    title: Stavanger kommunes kartdata på ArcGIS Online (REST)
    title_en: Stavanger municipality map data on ArcGIS Online (REST)
    description: >-
      Stavanger kommunes åpne tjenestekatalog på ArcGIS Online, med omtrent 167 publiserte kartlag, blant annet barnehager, barneskoler med inntaksområder, gang- og sykkelveier, kulturminner og sikringssoner. Hvert lag
      kan spørres med /query og gir JSON eller GeoJSON, uten nøkkel. Katalogen er kommunens arbeidsområde, så lag
      kommer og går og innholdet varierer i kvalitet.
    category: kart-og-geodata
    access: open
    auth: none
    formats: [JSON, GeoJSON]
    endpoints:
      - https://services5.arcgis.com/GStBPPXG2zAeErGC/arcgis/rest/services
    docs_url: https://services5.arcgis.com/GStBPPXG2zAeErGC/arcgis/rest/services
    probe_url: https://services5.arcgis.com/GStBPPXG2zAeErGC/arcgis/rest/services?f=json
    keywords: [kommune, kart, arcgis, arcgis online, kartlag, gis, geodata, feature service]
    tags: [no-auth]
    caveats:
      - Ingen lisens oppgitt.
      - Laglisten er kommunens arbeidskart og endres uten varsel; noen lag er under arbeid eller test.
      - Noen lag kan inneholde innspill fra innbyggere eller andre persondata, så sjekk laget før du bruker det.
    quick_start: |
      # tjenestene i organisasjonens katalog
      curl "https://services5.arcgis.com/GStBPPXG2zAeErGC/arcgis/rest/services?f=json"
      # fem objekter fra ett lag, som GeoJSON
      curl "https://services5.arcgis.com/GStBPPXG2zAeErGC/arcgis/rest/services/Barnehager/FeatureServer/0/query?where=1%3D1&outFields=*&resultRecordCount=5&f=geojson"

  - id: stavanger-kommune-parkering-sanntid
    title: Stavanger Parkering (ledige plasser i parkeringshus)
    title_en: Stavanger parking garages (free spaces, near real time)
    description: >-
      JSON-fil med sted, koordinater og antall ledige plasser i parkeringshusene til Stavanger Parkering, oppdatert
      omtrent hvert andre minutt. Åpent uten nøkkel. Antallet kommer som tekst, og enkelte hus har teksten «Open»
      i stedet for et tall.
    category: transport-og-samferdsel
    access: open
    auth: none
    formats: [JSON, CSV]
    endpoints:
      - https://opencom.no/dataset/36ceda99-bbc3-4909-bc52-b05a6d634b3f/resource/d1bdc6eb-9b49-4f24-89c2-ab9f5ce2acce/download/parking.json
    docs_url: https://opencom.no/dataset/stavanger-parkering
    probe_url: https://opencom.no/dataset/36ceda99-bbc3-4909-bc52-b05a6d634b3f/resource/d1bdc6eb-9b49-4f24-89c2-ab9f5ce2acce/download/parking.json
    license: NLOD 2.0
    keywords: [parkering, parkeringshus, ledige plasser, stavanger, sanntid, parking]
    tags: [no-auth, feed]
    caveats:
      - Ikke et API i streng forstand; en fil som oppdateres jevnlig, med en adresse som følger ressurs-ID-ene i CKAN.
      - Feltene har norske navn og verdiene er tekst, også tallene.
    quick_start: |
      curl "https://opencom.no/dataset/36ceda99-bbc3-4909-bc52-b05a6d634b3f/resource/d1bdc6eb-9b49-4f24-89c2-ab9f5ce2acce/download/parking.json"

  - id: stavanger-kommune-sykkeltellere
    title: Sykkeltellere i Stavanger (timesvise passeringer)
    title_en: Stavanger bicycle counters (hourly passages)
    description: >-
      Timesvise sykkelpasseringer per målestasjon, bane og retning fra sykkelsensorene til Stavanger kommune, med
      antall, gjennomsnittsfart og temperatur. Oppdateres daglig, med én CSV-ressurs per år. Årsfilene ligger i
      CKAN-datalageret og kan spørres med datastore_search; ressurs-ID-en må slås opp via package_show.
    category: transport-og-samferdsel
    access: open
    auth: none
    formats: [JSON, CSV]
    endpoints:
      - https://opencom.no/api/3/action/datastore_search
    docs_url: https://opencom.no/dataset/sykkeldata
    probe_url: https://opencom.no/api/3/action/package_show?id=sykkeldata
    license: NLOD 2.0
    keywords: [sykkel, sykkelteller, sykkeltelling, stavanger, trafikktelling, cycling, counter]
    tags: [no-auth, feed]
    caveats:
      - Hvert år er en egen ressurs med egen ID; hent riktig ID fra package_show.
      - Plasseringen til tellerne ligger i et eget datasett, «Lokalisering sykkeltellere Stavanger», koblet på Station_id.
    quick_start: |
      # finn siste årsressurs
      curl "https://opencom.no/api/3/action/package_show?id=sykkeldata"
      # hent rader fra en ressurs (bytt inn resource_id fra svaret)
      curl "https://opencom.no/api/3/action/datastore_search?resource_id=c584f88c-c967-4ced-9e47-4126eb7b1e14&limit=5"

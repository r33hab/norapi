provider:
  name: Vang kommune
  orgnr: "961382246"
  sector: kommune
apis:
  - id: vang-kommune-agol
    title: Vang kommunes kartdata på ArcGIS Online (REST)
    title_en: Vang municipality map data on ArcGIS Online (REST)
    description: >-
      Vang kommunes åpne tjenestekatalog på ArcGIS Online med 77 publiserte tjenester, blant annet kulturminner, kartlagt naturtype (NiN), friluftslivsaktivitet og fritidsboliger. Hvert lag kan spørres med /query og gir JSON eller GeoJSON, uten nøkkel. Katalogen er et arbeidsområde, så lag kommer og går og innholdet varierer i kvalitet.
    category: kart-og-geodata
    access: open
    auth: none
    formats: [JSON, GeoJSON]
    endpoints:
      - https://services-eu1.arcgis.com/trmMpJu7PBphxS03/arcgis/rest/services
    docs_url: https://services-eu1.arcgis.com/trmMpJu7PBphxS03/arcgis/rest/services
    probe_url: https://services-eu1.arcgis.com/trmMpJu7PBphxS03/arcgis/rest/services?f=json
    keywords: [vang, kommune, kart, arcgis, arcgis online, kartlag, gis, geodata, feature service]
    tags: [no-auth]
    caveats:
      - Ingen lisens oppgitt.
      - Katalogen er et arbeidsområde der lag kommer og går, og noen lag er under arbeid eller test.
      - Noen lag kan inneholde innspill fra innbyggere, så sjekk laget før du bruker det.
    quick_start: |
      # tjenestene i organisasjonens katalog
      curl "https://services-eu1.arcgis.com/trmMpJu7PBphxS03/arcgis/rest/services?f=json"
      # antall objekter i ett lag
      curl "https://services-eu1.arcgis.com/trmMpJu7PBphxS03/arcgis/rest/services/kulturminner_historiske_vegfar/FeatureServer/0/query?where=1%3D1&returnCountOnly=true&f=json"

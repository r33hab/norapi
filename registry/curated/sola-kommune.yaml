provider:
  name: Sola kommune
  sector: kommune
  orgnr: "948243113"
apis:
  - id: sola-kommune-agol
    title: Sola kommunes kartdata på ArcGIS Online (REST)
    title_en: Sola municipality map data on ArcGIS Online (REST)
    description: >-
      Sola kommunes åpne tjenestekatalog på ArcGIS Online, med omtrent 250 publiserte kartlag, blant annet kommuneplan, reguleringsplaner, kommunegrense, eiendommer, veg og 3D-modeller av planer. Hvert lag kan spørres med /query og gir JSON, uten nøkkel. Katalogen er kommunens arbeidsområde, så lag kommer og går, og mange lag er planversjoner med datostempel.
    category: kart-og-geodata
    access: open
    auth: none
    formats: [JSON]
    endpoints:
      - https://services-eu1.arcgis.com/VvNOCxiLGodW0Moz/arcgis/rest/services
    docs_url: https://services-eu1.arcgis.com/VvNOCxiLGodW0Moz/arcgis/rest/services
    probe_url: https://services-eu1.arcgis.com/VvNOCxiLGodW0Moz/arcgis/rest/services?f=json
    keywords: [kommune, kart, arcgis, arcgis online, kartlag, gis, geodata, feature service, reguleringsplan, kommuneplan, Sola]
    tags: [no-auth]
    caveats:
      - Ingen lisens oppgitt.
      - Laglisten er kommunens arbeidskart og endres uten varsel.
    quick_start: |
      # tjenestene i organisasjonens katalog
      curl "https://services-eu1.arcgis.com/VvNOCxiLGodW0Moz/arcgis/rest/services?f=json"
      # kommunegrensen (antall objekter)
      curl "https://services-eu1.arcgis.com/VvNOCxiLGodW0Moz/arcgis/rest/services/kommunegrense/FeatureServer/0/query?where=1%3D1&returnCountOnly=true&f=json"

updated: 2026-11-17
provider:
  name: Kartverket
  orgnr: "971040238"
  sector: stat
apis:
  - id: geonorge-adresser
    title: Adresse-API (Geonorge)
    description: >-
      Søk og oppslag i alle offisielle adresser i Norge fra matrikkelen: fritekstsøk, punktsøk innenfor en
      radius, og strukturert søk på kommune, gate og nummer. Returnerer koordinater, postnummer og
      matrikkelnummer.
    category: kart-og-geodata
    access: open
    auth: none
    formats: [JSON]
    endpoints:
      - https://ws.geonorge.no/adresser/v1/
    docs_url: https://ws.geonorge.no/adresser/v1/
    license: CC BY 4.0
    keywords: [adresse, adressesøk, geokoding, postnummer, matrikkel, koordinater, address]
    tags: [starter, no-auth]
    quick_start: |
      curl "https://ws.geonorge.no/adresser/v1/sok?sok=Karl%20Johans%20gate%201&treffPerSide=3"

  - id: geonorge-stedsnavn
    title: Stedsnavn-API (Geonorge)
    description: >-
      Søk i Sentralt stedsnavnregister: fjell, vann, gårder, byer og øvrige navn med koordinater,
      navnetype og status.
    category: kart-og-geodata
    access: open
    auth: none
    formats: [JSON]
    endpoints:
      - https://ws.geonorge.no/stedsnavn/v1/
    docs_url: https://ws.geonorge.no/stedsnavn/v1/
    license: CC BY 4.0
    keywords: [stedsnavn, navn, fjell, innsjø, ssr]
    tags: [no-auth]

  - id: geonorge-kommuneinfo
    title: Kommuneinfo-API (Geonorge)
    description: >-
      Kommuner og fylker med nummer, navn, kommunesenter og omriss, og oppslag fra koordinat til kommune.
      Den enkleste måten å slå opp hvilken kommune et punkt ligger i.
    category: kart-og-geodata
    access: open
    auth: none
    formats: [JSON, GeoJSON]
    endpoints:
      - https://ws.geonorge.no/kommuneinfo/v1/
    spec_url: https://ws.geonorge.no/kommuneinfo/v1/static/openapi_doc.json
    docs_url: https://ws.geonorge.no/kommuneinfo/v1/
    license: CC BY 4.0
    keywords: [kommune, fylke, kommunenummer, punkt, omriss]
    tags: [no-auth, reference-data]
    quick_start: |
      curl "https://ws.geonorge.no/kommuneinfo/v1/punkt?nord=59.91&ost=10.75&koordsys=4258"

  - id: geonorge-kartkatalog
    title: Kartkatalogen API (Geonorge)
    description: >-
      Søk i den nasjonale geodatakatalogen: datasett, WMS/WFS-tjenester og nedlastinger fra alle
      norske geodataeiere, med metadata etter ISO 19115.
    category: kart-og-geodata
    access: open
    auth: none
    formats: [JSON]
    endpoints:
      - https://kartkatalog.geonorge.no/api/search
    docs_url: https://kartkatalog.geonorge.no/swagger/index.html
    probe_url: https://kartkatalog.geonorge.no/api/search?text=adresse
    license: CC BY 4.0
    keywords: [geodata, kartlag, wms, wfs, metadata, datasett, katalog]
    tags: [no-auth]
    quick_start: |
      curl "https://kartkatalog.geonorge.no/api/search?text=adresse&limit=3"

  - id: geonorge-hoydedata
    title: Høydedata-API (Geonorge)
    description: >-
      Terrenghøyde for et punkt eller en linje fra den nasjonale høydemodellen, med angitt datakilde og
      oppløsning. Ett kall, ingen nøkkel.
    category: kart-og-geodata
    access: open
    auth: none
    formats: [JSON]
    endpoints:
      - https://ws.geonorge.no/hoydedata/v1/
    docs_url: https://ws.geonorge.no/hoydedata/v1/
    license: CC BY 4.0
    keywords: [høyde, terreng, høydemodell, dtm, elevation, moh]
    tags: [no-auth]
    quick_start: |
      curl "https://ws.geonorge.no/hoydedata/v1/punkt?koordsys=4258&nord=59.91&ost=10.75"

  - id: kartverket-wmts-bakgrunnskart
    title: Bakgrunnskart som WMTS (cache.kartverket.no)
    description: >-
      Kartverkets bakgrunnskart som flisetjeneste: topografisk kart i farger og gråtone, sjøkart og flere,
      i WebMercator og UTM. Åpent for bruk i egne kartapplikasjoner, med CORS og CC BY 4.0.
    category: kart-og-geodata
    access: open
    auth: none
    formats: [WMTS, PNG]
    endpoints:
      - https://cache.kartverket.no/v1/wmts/1.0.0/WMTSCapabilities.xml
    docs_url: https://kartkatalog.geonorge.no/metadata/topografisk-norgeskart-wmts-cache/8f381180-1a47-4453-bee7-9a3d64843efa
    license: CC BY 4.0
    keywords: [bakgrunnskart, wmts, fliser, topografisk, kart, basemap, tiles]
    tags: [no-auth]
    quick_start: |
      # én flis, zoom 5, Sør-Norge
      curl -o flis.png "https://cache.kartverket.no/v1/wmts/1.0.0/topo/default/webmercator/5/9/17.png"

  - id: kartverket-vannstand
    title: Vannstand og tidevann (Se havnivå)
    description: >-
      Observert og varslet vannstand, tidevannstabeller og stasjonsliste for norskekysten, som XML fra
      Kartverkets sjødivisjon. Spør per koordinat eller stasjon og tidsrom.
    category: vaer-og-klima
    access: open
    auth: none
    formats: [XML]
    endpoints:
      - https://vannstand.kartverket.no/tideapi.php
    docs_url: https://www.kartverket.no/til-sjos/se-havniva
    probe_url: https://vannstand.kartverket.no/tideapi.php?tide_request=stationlist&type=perm
    license: CC BY 4.0
    keywords: [tidevann, vannstand, havnivå, flo, fjære, tide, sjø]
    tags: [no-auth]
    quick_start: |
      curl "https://vannstand.kartverket.no/tideapi.php?tide_request=stationlist&type=perm"

  - id: kartverket-matrikkel
    title: Matrikkel-API
    description: >-
      Eiendomsregisteret: eiendommer, bygninger, adresser og eierforhold. Krever avtale med Kartverket,
      og eierdata er underlagt tilgangsstyring. Adresser uten eier er fritt tilgjengelige gjennom Adresse-API.
    category: kart-og-geodata
    access: restricted
    auth: unknown
    formats: [XML, JSON]
    endpoints:
      - https://www.kartverket.no/api-og-data/eiendomsdata
    docs_url: https://www.kartverket.no/api-og-data/eiendomsdata
    keywords: [matrikkel, eiendom, bygning, grunnbok, hjemmelshaver, tomt]
    tags: [agreement]

  - id: geonorge-transformasjon
    title: Transformasjons-API (Geonorge)
    title_en: Coordinate transformation API
    description: >-
      Transformerer koordinater mellom koordinatsystemer og projeksjoner, for eksempel fra geografiske
      ETRS89-koordinater (EPSG:4258) til UTM sone 33 (EPSG:25833), og lister EPSG-kodene som støttes. Bygget på PROJ,
      og erstatter den eldre Transformasjon Web Service.
    category: kart-og-geodata
    access: open
    auth: none
    formats: [JSON]
    endpoints:
      - https://ws.geonorge.no/transformering/v1/
    docs_url: https://ws.geonorge.no/transformering/v1/
    spec_url: https://ws.geonorge.no/transformering/v1/openapi.json
    probe_url: https://ws.geonorge.no/transformering/v1/projeksjoner
    merge_with: https://ws.geonorge.no/transformering/v1/
    keywords: [koordinater, transformasjon, projeksjon, epsg, utm, euref89, etrs89, wgs84, proj]
    tags: [no-auth]
    quick_start: |
      # lengde/bredde i Oslo (EPSG:4258) til UTM sone 33 (EPSG:25833)
      curl "https://ws.geonorge.no/transformering/v1/transformer?x=10.75&y=59.91&fra=4258&til=25833"

  - id: geonorge-register
    title: Register-API (Geonorge)
    title_en: Geonorge register API (code lists)
    description: >-
      Kartverkets registre i maskinlesbar form: SOSI-kodelister som kommune- og fylkesnummer med status (gyldig eller
      tilbaketrukket) og gyldighetsdato, kommuner og etater med organisasjonsnummer, og andre fellesregistre for geodata.
      Legg .json på et registers adresse under /api/ for å få det som JSON. Kallet som skal liste alle registre, /api/register,
      svarer med feil, så gå inn via en kjent registeradresse.
    category: kart-og-geodata
    access: open
    auth: none
    formats: [JSON, XML]
    endpoints:
      - https://register.geonorge.no/api/
    docs_url: https://register.geonorge.no/swagger
    spec_url: https://register.geonorge.no/swagger/docs/v1
    probe_url: https://register.geonorge.no/api/v2/organisasjoner/kommuner/0301
    license: NLOD 2.0
    keywords: [kodeliste, sosi, kommunenummer, fylkesnummer, register, organisasjonsnummer, code list]
    tags: [no-auth, reference-data]
    caveats:
      - Kallet som skal liste alle registre (/api/register) svarer med 500; gå inn via en kjent registeradresse.
    quick_start: |
      # alle kommunenummer, også tilbaketrukne, med status og gyldighetsdato
      curl "https://register.geonorge.no/api/sosi-kodelister/inndelinger/inndelingsbase/kommunenummer.json"

  - id: kartverket-havnedata-ogcapi
    title: Havnedata 3.0 (OGC API Features)
    title_en: Port data 3.0 (OGC API Features)
    description: >-
      Detaljerte havnedata som OGC API Features, 22 samlinger: kaiområder og kaifronter, kraner, fortøyningsinnretninger,
      fendere, slipper, avfallspunkter, beredskapspunkter, elkobling (landstrøm), drivstofftilkoblinger,
      fartsrestriksjoner og forbudsområder, med koblingsnøkler til havnenes egne systemer. Ligger på Kartverkets
      testserver for OGC API, så adresse og innhold kan endres.
    category: kart-og-geodata
    access: open
    auth: none
    formats: [GeoJSON, JSON, HTML]
    endpoints:
      - https://ogcapitest.kartverket.no/rest/services/havnedata3_0/
    docs_url: https://ogcapitest.kartverket.no/rest/services/havnedata3_0/api?f=html
    spec_url: https://ogcapitest.kartverket.no/rest/services/havnedata3_0/api?f=json
    probe_url: https://ogcapitest.kartverket.no/rest/services/havnedata3_0/collections?f=json
    keywords: [havn, kai, kran, fortøyning, landstrøm, havnedata, ogc api, port data]
    tags: [no-auth]
    caveats:
      - Ligger på Kartverkets testserver for OGC API; adresse og innhold kan endres uten forvarsel.
      - Ingen lisens oppgitt for tjenesten.
    quick_start: |
      curl "https://ogcapitest.kartverket.no/rest/services/havnedata3_0/collections/havnesensor/items?f=json&limit=1"

  - id: kartverket-sirkumpolar-grunnkart-wms
    title: Sirkumpolar grunnkart (WMS)
    title_en: Circumpolar base map (WMS)
    description: >-
      WMS fra Kartverket med topografiske kart i målestokk 1:500 til 1:10 000 000, der Kartverket og Norsk
      Polarinstitutt dekker nordområdene, med transparent hav slik at kartet kan legges over andre lag. GetCapabilities
      og GetMap svarer uten nøkkel. Kartkatalogen merker tjenesten «Norge digitalt begrenset», men den svarte anonymt da vi
      prøvde.
    category: kart-og-geodata
    access: open
    auth: none
    formats: [WMS, PNG]
    endpoints:
      - https://wms.geonorge.no/skwms1/wms.sirkumpolar_grunnkart
    docs_url: https://kartkatalog.geonorge.no/metadata/uuid/ebf51cbe-8468-444e-93e8-8d2acba7ddda
    probe_url: https://wms.geonorge.no/skwms1/wms.sirkumpolar_grunnkart?service=WMS&request=GetCapabilities
    keywords: [sirkumpolar, grunnkart, arktis, nordområdene, wms, topografisk kart, svalbard]
    tags: [no-auth]
    caveats:
      - Kartkatalogen oppgir tilgang som «Norge digitalt begrenset», men tjenesten svarer uten innlogging; vilkårene kan være strengere enn det som er teknisk åpent.
      - Tjenestens adresse er funnet ved navnematch mot kartkatalogen, som ikke oppgir endepunkt for denne posten.
    quick_start: |
      curl "https://wms.geonorge.no/skwms1/wms.sirkumpolar_grunnkart?service=WMS&request=GetCapabilities"
      curl -o kart.png "https://wms.geonorge.no/skwms1/wms.sirkumpolar_grunnkart?service=WMS&version=1.3.0&request=GetMap&layers=sirkumpolar_grunnkart&styles=&crs=EPSG:4326&bbox=60,5,72,30&width=300&height=200&format=image/png"

  - id: kartverket-rutenett-turkart-wms
    title: UTM-rutenett for turkart (WMS)
    title_en: UTM grid for hiking maps (WMS)
    description: >-
      WMS fra Kartverket som tegner UTM-rutenett med kilometerlinjer for sonene 32, 33 og 35, laget for turkartportalen.
      GetCapabilities og GetMap svarer uten nøkkel, og laget er gjennomsiktig slik at det kan legges over et bakgrunnskart.
      Kartkatalogen merker tjenesten «Norge digitalt begrenset», men den svarte anonymt da vi prøvde.
    category: kart-og-geodata
    access: open
    auth: none
    formats: [WMS, PNG]
    endpoints:
      - https://wms.geonorge.no/skwms1/wms.rutenett_turkart
    docs_url: https://kartkatalog.geonorge.no/metadata/uuid/4ddddaba-ccc7-432c-82d7-b97cb9eb2ae2
    probe_url: https://wms.geonorge.no/skwms1/wms.rutenett_turkart?service=WMS&request=GetCapabilities
    keywords: [utm, rutenett, turkart, kartnett, wms, kilometerrutenett]
    tags: [no-auth]
    caveats:
      - Kartkatalogen oppgir tilgang som «Norge digitalt begrenset», men tjenesten svarer uten innlogging; vilkårene kan være strengere enn det som er teknisk åpent.
      - Tjenestens adresse er funnet ved navnematch mot kartkatalogen, som ikke oppgir endepunkt for denne posten.
    quick_start: |
      curl "https://wms.geonorge.no/skwms1/wms.rutenett_turkart?service=WMS&request=GetCapabilities"
      curl -o rutenett.png "https://wms.geonorge.no/skwms1/wms.rutenett_turkart?service=WMS&version=1.3.0&request=GetMap&layers=UTMrutenett_turkart&styles=&crs=EPSG:25832&bbox=500000,6600000,520000,6620000&width=300&height=300&format=image/png"

  - id: kartverket-farlige-bolger-wfs
    title: Områder med farlige bølger langs Norskekysten (WFS)
    title_en: Areas with dangerous waves along the Norwegian coast (WFS)
    description: >-
      WFS fra Kartverket med aktsomhetsområder for farlige bølger langs kysten, i feature-typen AktsomhetsområdeFarligeBølger
      (EPSG:4258). GetCapabilities svarer uten nøkkel. Kartkatalogen oppgir åpne data uten begrensninger.
    category: natur-og-miljo
    access: open
    auth: none
    formats: [WFS, GML]
    endpoints:
      - https://wfs.geonorge.no/skwms1/wfs.farligebolger
    docs_url: https://kartkatalog.geonorge.no/metadata/uuid/da81307f-c709-4d1c-8d84-f637b8e068a8
    probe_url: https://wfs.geonorge.no/skwms1/wfs.farligebolger?service=WFS&request=GetCapabilities
    keywords: [bølger, farlige bølger, aktsomhet, kyst, wfs, sjø, sikkerhet]
    tags: [no-auth]
    caveats:
      - Tjenestens adresse er funnet ved navnematch mot kartkatalogen, som ikke oppgir endepunkt for denne posten.
      - Bare GetCapabilities er kjørt; GetFeature er ikke prøvd.
    quick_start: |
      curl "https://wfs.geonorge.no/skwms1/wfs.farligebolger?service=WFS&request=GetCapabilities"

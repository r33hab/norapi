updated: 2026-10-20
provider:
  name: Kartverket
  orgnr: "971040238"
  sector: stat
apis:
  - id: geonorge-adresser
    title: Adresse-API (Geonorge)
    description: >-
      Søk og oppslag i alle offisielle adresser i Norge fra matrikkelen: fritekstsøk, punktsøk innenfor en
      radius, og strukturert søk på kommune, gate og nummer. Returnerer koordinater, postnummer og
      matrikkelnummer.
    category: kart-og-geodata
    access: open
    auth: none
    formats: [JSON]
    endpoints:
      - https://ws.geonorge.no/adresser/v1/
    docs_url: https://ws.geonorge.no/adresser/v1/
    license: CC BY 4.0
    keywords: [adresse, adressesøk, geokoding, postnummer, matrikkel, koordinater, address]
    tags: [starter, no-auth]
    quick_start: |
      curl "https://ws.geonorge.no/adresser/v1/sok?sok=Karl%20Johans%20gate%201&treffPerSide=3"

  - id: geonorge-stedsnavn
    title: Stedsnavn-API (Geonorge)
    description: >-
      Søk i Sentralt stedsnavnregister: fjell, vann, gårder, byer og øvrige navn med koordinater,
      navnetype og status.
    category: kart-og-geodata
    access: open
    auth: none
    formats: [JSON]
    endpoints:
      - https://ws.geonorge.no/stedsnavn/v1/
    docs_url: https://ws.geonorge.no/stedsnavn/v1/
    license: CC BY 4.0
    keywords: [stedsnavn, navn, fjell, innsjø, ssr]
    tags: [no-auth]

  - id: geonorge-kommuneinfo
    title: Kommuneinfo-API (Geonorge)
    description: >-
      Kommuner og fylker med nummer, navn, kommunesenter og omriss, og oppslag fra koordinat til kommune.
      Den enkleste måten å slå opp hvilken kommune et punkt ligger i.
    category: kart-og-geodata
    access: open
    auth: none
    formats: [JSON, GeoJSON]
    endpoints:
      - https://ws.geonorge.no/kommuneinfo/v1/
    spec_url: https://ws.geonorge.no/kommuneinfo/v1/static/openapi_doc.json
    docs_url: https://ws.geonorge.no/kommuneinfo/v1/
    license: CC BY 4.0
    keywords: [kommune, fylke, kommunenummer, punkt, omriss]
    tags: [no-auth, reference-data]
    quick_start: |
      curl "https://ws.geonorge.no/kommuneinfo/v1/punkt?nord=59.91&ost=10.75&koordsys=4258"

  - id: geonorge-kartkatalog
    title: Kartkatalogen API (Geonorge)
    description: >-
      Søk i den nasjonale geodatakatalogen: datasett, WMS/WFS-tjenester og nedlastinger fra alle
      norske geodataeiere, med metadata etter ISO 19115.
    category: kart-og-geodata
    access: open
    auth: none
    formats: [JSON]
    endpoints:
      - https://kartkatalog.geonorge.no/api/search
    docs_url: https://kartkatalog.geonorge.no/swagger/index.html
    probe_url: https://kartkatalog.geonorge.no/api/search?text=adresse
    license: CC BY 4.0
    keywords: [geodata, kartlag, wms, wfs, metadata, datasett, katalog]
    tags: [no-auth]
    quick_start: |
      curl "https://kartkatalog.geonorge.no/api/search?text=adresse&limit=3"

  - id: geonorge-hoydedata
    title: Høydedata-API (Geonorge)
    description: >-
      Terrenghøyde for et punkt eller en linje fra den nasjonale høydemodellen, med angitt datakilde og
      oppløsning. Ett kall, ingen nøkkel.
    category: kart-og-geodata
    access: open
    auth: none
    formats: [JSON]
    endpoints:
      - https://ws.geonorge.no/hoydedata/v1/
    docs_url: https://ws.geonorge.no/hoydedata/v1/
    license: CC BY 4.0
    keywords: [høyde, terreng, høydemodell, dtm, elevation, moh]
    tags: [no-auth]
    quick_start: |
      curl "https://ws.geonorge.no/hoydedata/v1/punkt?koordsys=4258&nord=59.91&ost=10.75"

  - id: kartverket-wmts-bakgrunnskart
    title: Bakgrunnskart som WMTS (cache.kartverket.no)
    description: >-
      Kartverkets bakgrunnskart som flisetjeneste: topografisk kart i farger og gråtone, sjøkart og flere,
      i WebMercator og UTM. Åpent for bruk i egne kartapplikasjoner, med CORS og CC BY 4.0.
    category: kart-og-geodata
    access: open
    auth: none
    formats: [WMTS, PNG]
    endpoints:
      - https://cache.kartverket.no/v1/wmts/1.0.0/WMTSCapabilities.xml
    docs_url: https://kartkatalog.geonorge.no/metadata/topografisk-norgeskart-wmts-cache/8f381180-1a47-4453-bee7-9a3d64843efa
    license: CC BY 4.0
    keywords: [bakgrunnskart, wmts, fliser, topografisk, kart, basemap, tiles]
    tags: [no-auth]
    quick_start: |
      # én flis, zoom 5, Sør-Norge
      curl -o flis.png "https://cache.kartverket.no/v1/wmts/1.0.0/topo/default/webmercator/5/9/17.png"

  - id: kartverket-vannstand
    title: Vannstand og tidevann (Se havnivå)
    description: >-
      Observert og varslet vannstand, tidevannstabeller og stasjonsliste for norskekysten, som XML fra
      Kartverkets sjødivisjon. Spør per koordinat eller stasjon og tidsrom.
    category: vaer-og-klima
    access: open
    auth: none
    formats: [XML]
    endpoints:
      - https://vannstand.kartverket.no/tideapi.php
    docs_url: https://www.kartverket.no/til-sjos/se-havniva
    probe_url: https://vannstand.kartverket.no/tideapi.php?tide_request=stationlist&type=perm
    license: CC BY 4.0
    keywords: [tidevann, vannstand, havnivå, flo, fjære, tide, sjø]
    tags: [no-auth]
    quick_start: |
      curl "https://vannstand.kartverket.no/tideapi.php?tide_request=stationlist&type=perm"

  - id: kartverket-matrikkel
    title: Matrikkel-API
    description: >-
      Eiendomsregisteret: eiendommer, bygninger, adresser og eierforhold. Krever avtale med Kartverket,
      og eierdata er underlagt tilgangsstyring. Adresser uten eier er fritt tilgjengelige gjennom Adresse-API.
    category: kart-og-geodata
    access: restricted
    auth: unknown
    formats: [XML, JSON]
    endpoints:
      - https://www.kartverket.no/api-og-data/eiendomsdata
    docs_url: https://www.kartverket.no/api-og-data/eiendomsdata
    keywords: [matrikkel, eiendom, bygning, grunnbok, hjemmelshaver, tomt]
    tags: [agreement]

  - id: geonorge-transformasjon
    title: Transformasjons-API (Geonorge)
    title_en: Coordinate transformation API
    description: >-
      Transformerer koordinater mellom koordinatsystemer og projeksjoner, for eksempel fra geografiske
      ETRS89-koordinater (EPSG:4258) til UTM sone 33 (EPSG:25833), og lister EPSG-kodene som støttes. Bygget på PROJ,
      og erstatter den eldre Transformasjon Web Service.
    category: kart-og-geodata
    access: open
    auth: none
    formats: [JSON]
    endpoints:
      - https://ws.geonorge.no/transformering/v1/
    docs_url: https://ws.geonorge.no/transformering/v1/
    spec_url: https://ws.geonorge.no/transformering/v1/openapi.json
    probe_url: https://ws.geonorge.no/transformering/v1/projeksjoner
    merge_with: https://ws.geonorge.no/transformering/v1/
    keywords: [koordinater, transformasjon, projeksjon, epsg, utm, euref89, etrs89, wgs84, proj]
    tags: [no-auth]
    quick_start: |
      # lengde/bredde i Oslo (EPSG:4258) til UTM sone 33 (EPSG:25833)
      curl "https://ws.geonorge.no/transformering/v1/transformer?x=10.75&y=59.91&fra=4258&til=25833"

  - id: geonorge-register
    title: Register-API (Geonorge)
    title_en: Geonorge register API (code lists)
    description: >-
      Kartverkets registre i maskinlesbar form: SOSI-kodelister som kommune- og fylkesnummer med status (gyldig eller
      tilbaketrukket) og gyldighetsdato, kommuner og etater med organisasjonsnummer, og andre fellesregistre for geodata.
      Legg .json på et registers adresse under /api/ for å få det som JSON. Kallet som skal liste alle registre, /api/register,
      svarer med feil, så gå inn via en kjent registeradresse.
    category: kart-og-geodata
    access: open
    auth: none
    formats: [JSON, XML]
    endpoints:
      - https://register.geonorge.no/api/
    docs_url: https://register.geonorge.no/swagger
    spec_url: https://register.geonorge.no/swagger/docs/v1
    probe_url: https://register.geonorge.no/api/v2/organisasjoner/kommuner/0301
    license: NLOD 2.0
    keywords: [kodeliste, sosi, kommunenummer, fylkesnummer, register, organisasjonsnummer, code list]
    tags: [no-auth, reference-data]
    quick_start: |
      # alle kommunenummer, også tilbaketrukne, med status og gyldighetsdato
      curl "https://register.geonorge.no/api/sosi-kodelister/inndelinger/inndelingsbase/kommunenummer.json"

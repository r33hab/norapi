  title: Ramsarområder WMS
  description: "Datasettet viser norske naturvernområder med status som ramsarområder, under den internasjonale\
    \ våtmarkskonvensjonen (Ramsarkonvensjonen). Alle norske ramsarområder er vernet som naturvernområder\
    \ (eget datasett). Noen ganger omfatter ramsarstatusen kun deler av det aktuelle naturvernområdet.\
    \ Et ramsarområde kan også omfatte areal i flere ulike naturvernområder. \n\nI dette datasettet defineres\
    \ entydig hvilke areal som omfattes av Ramsarkonvensjonen i Norge. I tillegg inneholder det en områdebeskrivelse\
    \ på norsk, som forklarer om historikk og begrunnelse for at områdene har fått en så viktig internasjonal\
    \ status."

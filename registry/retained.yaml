- id: statens-vegvesen-ecoc
  title: eCoC
  description: 'eCOC er a) en samsvarserklæring som bekrefter at det aktuelle kjøretøyet kjøretøy er i
    samsvar med en bestemt typegodkjenning, og b) tekniske data for det aktuelle kjøretøyet. Importør
    sender inn melding om preregistrering av kjøretøy inkludert eCoC i XML-format som definert av IVI-formatet
    (Initial Vehicle Information). Innsender får tilbakemelding på fra tjenesten, positiv tilbakemelding
    vil si at kjøretøyet er registrert i vår kjøretøydatabase. Ved negativ tilbakemelding vil de gis feilmeldinger
    for felter som er påkrevet. Begge typer tilbakemeldinger vil kunne inneholde varsler på felter som
    der er ønsket innhold i.


    Tjenesten er tilgjengelig for norske kjøretøyimportører / fabrikanter med norsk organisasjonsnummer
    som importerer eller produserer kjøretøy som skal førstegangsregistreres i Norge. Tjenesten legger
    til rette for importører og deres forhandlere å enkelt, raskt og sikkert kunne gjennomføre førstegangsregistrering.'

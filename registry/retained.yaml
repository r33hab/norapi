    \ menes beiteområder, leveområder, hekkeområder etc. Datasettet er ikke et fullstendig datasett for\
    \ alle arter, men er hovedsakelig fokusert på prioriterte arter etter naturmangfoldloven, rødlistearter\
    \ og artene som inngår i viltkartleggingen etter DN håndbok nr. 11- 2000 Viltkartlegging. \n\nDatasettet\
    \ inneholder\n    - Hjortevilt, herunder villrein\n    - Småvilt\n    - Trua og sårbare arter innen\
    \ alle organismegrupper\n    - Økologiske funksjonsområder for prioriterte arter etter naturmangfoldloven\n\
    \nDNs artsdata utveksles med Artsdatabankens tjeneste Artskart og kan gjenfinnes der sammen med data\

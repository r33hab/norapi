- id: miljodirektoratet-naturvernomrader-wms
  title: Naturvernområder WMS
  description: 'Tjenesten gir en oversikt over hvilke områder som er vernet etter følgende lover: naturmangfoldloven
    av 2009, biotopvern etter viltloven av 1981, naturvernloven av 1970, lov om naturvern av 1954, lov
    om Jan Mayen av 1930 og lov om naturfredning av 1910. I tillegg inneholder det områder vernet etter
    følgende lovverk på Svalbard: Svalbardloven av 1925 og Svalbardmiljøloven av 2002. Datasettet gir
    også tilgang til lovforskriften som gjelder for hvert enkelt vernevedtak.\\n\\nTjenesten gir også
    oversikt over foreslåtte naturvernområder som er under planlegging og kunngjort (§ 42) etter lov om
    Naturmangfold - Kapittel V (Områdevern). Tjenesten viser avgrensingen til området i høringsforslaget
    (§ 43).\\n\\nVerneområder opprettes først og fremst for å bevare naturverdier av nasjonal betydning.
    Dette er verdier vi skal ta vare på for all overskuelig framtid, også med tanke på naturopplevelse
    og kunnskap om naturen. Verneområdene forvaltes av fylkesmannen, kommunen eller et interkommunalt
    verneområdestyre.'
  summary: 'Tjenesten gir en oversikt over hvilke områder som er vernet etter følgende lover: naturmangfoldloven
    av 2009, biotopvern etter viltloven av 1981, naturvernloven av 1970, lov om naturvern av 1954, lov
    om Jan Mayen av 1930 og lov om…'

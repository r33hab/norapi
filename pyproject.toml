[project]
name = "norapi"
version = "0.1.0"
description = "A fast, searchable registry of Norwegian public APIs, for developers and AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "r33hAB" }]
keywords = ["norway", "open-data", "api", "registry", "mcp", "fdk"]
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6",
    "mcp>=1.2",
]

[project.scripts]
norapi = "norapi.cli:main"
norapi-mcp = "norapi.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/norapi"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# HTML templates: long attribute strings are clearer unwrapped.
"src/norapi/site.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
